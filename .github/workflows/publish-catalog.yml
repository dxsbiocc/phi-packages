name: Verify registry build

on:
  workflow_dispatch:
    inputs:
      phi_ref:
        description: Branch or tag of dxsbiocc/phi containing the registry builder
        required: true
        default: main
      wrapper_version:
        description: Optional explicit semver override for wrapper packages
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phi-packages
        uses: actions/checkout@v4
        with:
          path: phi-packages

      - name: Checkout Phi builder
        uses: actions/checkout@v4
        with:
          repository: dxsbiocc/phi
          ref: ${{ inputs.phi_ref }}
          token: ${{ secrets.PHI_REPO_TOKEN || github.token }}
          path: Phi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Phi dependencies
        working-directory: Phi
        run: npm ci

      - name: Run repository contract tests
        working-directory: phi-packages
        run: node --test tests/*.test.mjs

      - name: Build and verify unsigned registry assets
        working-directory: phi-packages
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.wrapper_version }}" ]; then
            EXTRA_ARGS="--wrapper-version ${{ inputs.wrapper_version }}"
          fi
          node scripts/prepare-catalog.mjs \
            --phi ../Phi \
            --out /tmp/phi-registry-out \
            $EXTRA_ARGS
          node --input-type=module -e '
            import { verifyCatalogAssets } from "./scripts/publish-catalog.mjs";
            const verified = verifyCatalogAssets("/tmp/phi-registry-out");
            console.log(JSON.stringify({
              packagesVerified: verified.packageCount,
              assetsVerified: verified.immutableAssets.length
            }, null, 2));
          '
