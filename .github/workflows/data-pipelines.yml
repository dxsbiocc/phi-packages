name: Data pipelines

on:
  push:
    branches: [main]
    paths: ["data-pipelines/**", ".github/workflows/data-pipelines.yml"]
  pull_request:
    paths: ["data-pipelines/**", ".github/workflows/data-pipelines.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pharmacogenomics:
    name: Pharmacogenomics tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: data-pipelines/pharmacogenomics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: data-pipelines/pharmacogenomics/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[test]'
      # The PharmacoSet extractor tests run r/extract_pset.R. They only need base R: the
      # pre-PharmacoGx-3 layout is read from its slots without PharmacoGx.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      # Tests use fixtures and never download the release files. PGX_REQUIRE_R makes the R
      # tests fail instead of skipping, so a broken R install cannot hide them.
      - name: Test
        run: python -m pytest -q -rs
        env:
          PGX_REQUIRE_R: "1"
