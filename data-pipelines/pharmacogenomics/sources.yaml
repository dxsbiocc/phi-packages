# Batch 1 and batch 2 downloads. Large matrices stay behind `phi-pgx download --live`
# or PHI_PGX_LIVE=1. Checksums are sha256 of the bytes retrieved on 2026-10-14.
#
# DepMap's portal catalogue (https://depmap.org/portal/api/download/files and
# /api/no-captcha/download/files) returned an HTTP 200 Cloudflare HTML page
# from this environment. Figshare release records answered, so those URLs are
# configured. Clear `url` and pass `--resolve-urls` to try the portal catalogue
# first and fall back to the figshare article.

batch: 1

