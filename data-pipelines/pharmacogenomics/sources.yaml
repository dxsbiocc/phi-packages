planned:
  - id: orcestra_nci60
    version: "2026"
    enabled: false
    notes: >
      ORCESTRA lists a canonical NCI60_2026 PharmacoSet, but no public Zenodo
      file with that name was found on 2026-10-14. The 2021 CC BY 4.0 deposit
      10.5281/zenodo.5570629 is an older NCI60 PSet and is not pinned. A future
      PSet must use dataset nci60_pset so it does not overwrite DTP nci60.
  - id: hmdb
    enabled: false
    notes: >
      HMDB bulk XML is a later local-download batch. The public site is behind
      Cloudflare, so this pipeline does not call per-metabolite HTTP lookups.
