    notes: Frozen ORCESTRA PSet UHNBreast. Not implemented.
  - id: orcestra_ccle
    enabled: false
    access: R/PharmacoGx or rpy2
    notes: >
      Frozen ORCESTRA CCLE PSet. Not implemented. Do not use an ORCESTRA PRISM
      PSet; PRISM in this pipeline comes from the DepMap Figshare releases.
  - id: hmdb
    enabled: false
    notes: >
      HMDB bulk XML is a later local-download batch. The public site is behind
      Cloudflare, so this pipeline does not call per-metabolite HTTP lookups.
