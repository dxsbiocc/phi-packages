planned:
  - id: nci60_dtp
    version: "2026-04"
    enabled: false
    notes: >
      NCI60 DTP April 2026 is not downloaded in batch 1. Add an NSC-to-PubChem
      crosswalk and an explicit cell-line-to-CVCL crosswalk, then emit the same
      drug_response and model_xref tables. Do not fuzzy-match NCI60 names.
  - id: orcestra_ctrpv2
    version: "2.1"
    enabled: false
    access: R/PharmacoGx or rpy2
    notes: Frozen ORCESTRA PSet CTRPv2.1. Not implemented.
  - id: orcestra_gcsi
    enabled: false
    access: R/PharmacoGx or rpy2
    notes: Frozen ORCESTRA PSet gCSI. Not implemented.
  - id: orcestra_fimm
