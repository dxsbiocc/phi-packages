[project]
name = "phi-pgx"
version = "0.1.0"
description = "Pharmacogenomics download, harmonization, and Parquet build"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
phi-pgx = "pgx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
