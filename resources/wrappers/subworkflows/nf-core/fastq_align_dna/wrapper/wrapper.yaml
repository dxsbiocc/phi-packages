# Agent-facing wrapper adapter for the vendored fastq_align_dna subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
# Curated: 'index' is a glob whose matched files are staged together as one aligner index (bowtie2 needs six
# files, bwa-mem/bwa-mem2 several, dragmap a directory); the file set must match 'aligner'.
id: nf-core/subworkflows/fastq-align-dna
name: "Align DNA reads"
summary: "Align FASTQ reads to a genome index with bowtie2/bwamem/bwamem2/dragmap/snap."

params:
  reads:
    kind: input
    type: path_glob
    required: true
    description: "FASTQ glob (paired or single)."
  index:
    kind: input
    type: path_glob
    required: true
    description: "Aligner index (glob; every matched file is staged together as the index, e.g. 'idx/*')."
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference genome FASTA."
  aligner:
    kind: option
    type: string
    required: true
    enum:
      - bowtie2
      - bwamem
      - bwamem2
      - dragmap
      - snap
    description: "Aligner to use."
  sort:
    kind: option
    type: boolean
    required: false
    description: "Sort the output BAM."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/fastq_align_dna'
    primary: true
