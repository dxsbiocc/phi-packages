# Agent-facing wrapper adapter for the vendored bam_create_som_pon_gatk subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
# Curated: one normal sample per invocation ('pon_norm' names the PON it contributes); 'intervals_gendb' is
# required because GenomicsDBImport (and therefore the PON) only runs with it; 'intervals' scatters Mutect2
# with num_intervals=1 (no scatter).
id: nf-core/subworkflows/bam-create-som-pon-gatk
name: "Create somatic PON (GATK)"
summary: "Call normal samples with Mutect2 and build a GATK somatic panel of normals."

params:
  bam:
    kind: input
    type: bam
    required: true
    description: "Normal-sample BAM/CRAM."
  bai:
    kind: input
    type: path
    required: true
    description: "Input index."
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference FASTA."
  fai:
    kind: input
    type: path
    required: true
    description: "Reference FASTA index."
  dict:
    kind: input
    type: path
    required: true
    description: "Reference dictionary."
  pon_norm:
    kind: option
    type: string
    required: true
    description: "Panel of normals name."
  intervals_gendb:
    kind: input
    type: path
    required: true
    description: "Interval file for GenomicsDBImport; the PON is only built when this is set, so it is required."
  intervals:
    kind: input
    type: path
    required: false
    description: "Interval file for scattering (optional)."
  sample_id:
    kind: option
    type: string
    required: false
    description: "Sample id."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/bam_create_som_pon_gatk'
    primary: true
