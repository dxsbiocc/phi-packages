# Agent-facing wrapper adapter for the vendored vcf_extract_relate_somalier subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
# Curated: every VCF is indexed by the subworkflow itself and all matched VCFs share
# the meta field 'cohort', so the subworkflow's common_id step groups them into one
# relatedness run; set 'common_id' to '' to relate each sample separately.
id: nf-core/subworkflows/vcf-extract-relate-somalier
name: "Relatedness (somalier)"
summary: "Extract somalier markers from VCFs and infer sample relatedness."

params:
  vcfs:
    kind: input
    type: path_glob
    required: true
    description: "Glob of VCF files (unindexed inputs are bgzipped/tabixed automatically)."
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference genome FASTA."
  fai:
    kind: input
    type: path
    required: true
    description: "Reference FASTA index (.fai)."
  somalier_sites:
    kind: input
    type: path
    required: true
    description: "somalier sites VCF."
  ped:
    kind: input
    type: path
    required: true
    description: "Pedigree file."
  sample_groups:
    kind: input
    type: path
    required: false
    description: "Sample groups txt (optional)."
  cohort:
    kind: option
    type: string
    required: false
    description: "Value of the shared meta field the subworkflow groups samples by (constant across all VCFs)."
  common_id:
    kind: option
    type: string
    required: false
    description: "Meta field whose value becomes the relate group id; must exist in the adapter meta ('cohort' or 'id'); set '' to relate each sample separately."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/vcf_extract_relate_somalier'
    primary: true
