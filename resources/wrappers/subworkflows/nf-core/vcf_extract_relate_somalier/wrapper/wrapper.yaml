# Agent-facing wrapper adapter for the vendored vcf_extract_relate_somalier subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
# REVIEW: VCF/index pairing and count val need curation for multi-sample input
id: nf-core/subworkflows/vcf-extract-relate-somalier
name: "Relatedness (somalier)"
summary: "Extract somalier markers from VCFs and infer sample relatedness."

params:
  vcfs:
    kind: input
    type: path_glob
    required: true
    description: "Glob of VCF files."
  vcf_indexes:
    kind: input
    type: path_glob
    required: true
    description: "Glob of matching VCF indexes."
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference genome FASTA."
  fai:
    kind: input
    type: path
    required: true
    description: "Reference FASTA index (.fai)."
  somalier_sites:
    kind: input
    type: path
    required: true
    description: "somalier sites VCF."
  ped:
    kind: input
    type: path
    required: true
    description: "Pedigree file."
  sample_groups:
    kind: input
    type: path
    required: false
    description: "Sample groups txt (optional)."
  common_id:
    kind: option
    type: string
    required: false
    description: "Common identifier for single-sample VCFs."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/vcf_extract_relate_somalier'
    primary: true
