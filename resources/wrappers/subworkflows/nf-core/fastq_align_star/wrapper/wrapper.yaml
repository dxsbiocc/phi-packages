# Agent-facing wrapper adapter for the vendored subworkflow at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: take shapes verified against the subworkflow nf-tests; the adapter maps flat params onto the required [meta, ...] channel shapes.
id: nf-core/subworkflows/fastq-align-star
name: fastq align star
summary: Align reads to a reference genome using STAR then sort with samtools
params:
  reads:
    kind: input
    type: path
    required: true
    description: Input reads for ch_reads.
  index:
    kind: input
    type: path
    required: true
    description: Input index for ch_index.
  gtf:
    kind: input
    type: path
    required: true
    description: Input gtf for ch_gtf.
  star_ignore_sjdbgtf:
    kind: option
    type: boolean
    required: true
    description: Option star_ignore_sjdbgtf.
  fasta:
    kind: input
    type: path
    required: true
    description: Input fasta for ch_fasta_fai.
  fai:
    kind: input
    type: path
    required: false
    description: Optional companion fai for ch_fasta_fai.
  fasta_2:
    kind: input
    type: path
    required: false
    description: Input fasta for ch_transcripts_fasta_fai.
  fai_2:
    kind: input
    type: path
    required: false
    description: Optional companion fai for ch_transcripts_fasta_fai.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the subworkflow's results.
outputs:
  results:
    type: directory
    path: ${outdir}/fastq_align_star
    primary: true
