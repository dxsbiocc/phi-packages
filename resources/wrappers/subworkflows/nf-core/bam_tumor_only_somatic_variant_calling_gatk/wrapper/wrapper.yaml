# Agent-facing wrapper adapter for the vendored bam_tumor_only_somatic_variant_calling_gatk subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
# REVIEW: single-sample adapter; reference resource channels are plain file values
id: nf-core/subworkflows/bam-tumor-only-somatic-variant-calling-gatk
name: "Tumor-only somatic calling (GATK)"
summary: "Call somatic variants from a tumor-only BAM with GATK Mutect2 + contamination filtering."

params:
  bam:
    kind: input
    type: bam
    required: true
    description: "Tumor BAM/CRAM."
  bai:
    kind: input
    type: path
    required: true
    description: "Input index."
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference FASTA."
  fai:
    kind: input
    type: path
    required: true
    description: "Reference FASTA index."
  dict:
    kind: input
    type: path
    required: true
    description: "Reference dictionary."
  germline_resource:
    kind: input
    type: path
    required: true
    description: "Germline resource VCF (e.g. gnomAD)."
  germline_resource_tbi:
    kind: input
    type: path
    required: true
    description: "Germline resource index."
  alleles:
    kind: input
    type: path
    required: false
    description: "Alleles VCF (optional)."
  alleles_tbi:
    kind: input
    type: path
    required: false
    description: "Alleles VCF index (optional)."
  panel_of_normals:
    kind: input
    type: path
    required: false
    description: "Panel of normals VCF (optional)."
  panel_of_normals_tbi:
    kind: input
    type: path
    required: false
    description: "PON index (optional)."
  interval_file:
    kind: input
    type: path
    required: false
    description: "Interval file (optional)."
  sample_id:
    kind: option
    type: string
    required: false
    description: "Sample id."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/bam_tumor_only_somatic_variant_calling_gatk'
    primary: true
