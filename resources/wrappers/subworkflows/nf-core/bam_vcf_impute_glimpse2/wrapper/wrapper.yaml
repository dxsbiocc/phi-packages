# Agent-facing wrapper adapter for the vendored bam_vcf_impute_glimpse2 subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
# REVIEW: chunk=true regenerates chunks; chunk_model needed for GLIMPSE2 chunking
id: nf-core/subworkflows/bam-vcf-impute-glimpse2
name: "Impute VCF (GLIMPSE2)"
summary: "Impute a low-coverage VCF with GLIMPSE2 against a reference panel."

params:
  vcf:
    kind: input
    type: path
    required: true
    description: "Input VCF."
  vcf_index:
    kind: input
    type: path
    required: true
    description: "Input VCF index (.csi)."
  infos:
    kind: option
    type: string
    required: false
    description: "Sample/info list (optional)."
  ref_vcf:
    kind: input
    type: path
    required: true
    description: "Reference panel VCF."
  ref_index:
    kind: input
    type: path
    required: true
    description: "Reference panel VCF index."
  region:
    kind: option
    type: string
    required: true
    description: "Reference region label."
  map:
    kind: input
    type: path
    required: true
    description: "Genetic map file."
  panel_id:
    kind: option
    type: string
    required: false
    description: "Panel id for meta."
  chr:
    kind: option
    type: string
    required: true
    description: "Chromosome."
  fasta:
    kind: input
    type: fasta
    required: false
    description: "Reference FASTA (optional)."
  fai:
    kind: input
    type: path
    required: false
    description: "Reference FASTA index (optional)."
  chunk:
    kind: option
    type: boolean
    required: false
    description: "Activate automatic chunking."
  chunk_model:
    kind: input
    type: path
    required: false
    description: "Chunking model file (optional)."
  splitreference:
    kind: option
    type: boolean
    required: false
    description: "Split reference step."
  sample_id:
    kind: option
    type: string
    required: false
    description: "Sample id."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/bam_vcf_impute_glimpse2'
    primary: true
