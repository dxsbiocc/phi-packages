# Agent-facing wrapper adapter for the vendored bam_telomere_estimation subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
# REVIEW: single-sample adapter
id: nf-core/subworkflows/bam-telomere-estimation
name: "Telomere length/content estimation"
summary: "Estimate telomere length (telseq/telogator2) and optionally content (telomerehunter)."

params:
  bam:
    kind: input
    type: bam
    required: true
    description: "Aligned BAM."
  bai:
    kind: input
    type: path
    required: true
    description: "BAM index."
  data_type:
    kind: option
    type: string
    required: true
    enum:
      - short
      - long
    description: "Read type."
  bed:
    kind: input
    type: path
    required: false
    description: "Exome BED for telseq (optional)."
  control_bam:
    kind: input
    type: bam
    required: false
    description: "Matched control BAM (optional)."
  control_bai:
    kind: input
    type: path
    required: false
    description: "Control BAM index (optional)."
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference FASTA."
  fai:
    kind: input
    type: path
    required: true
    description: "Reference FASTA index."
  cytoband:
    kind: input
    type: path
    required: false
    description: "Cytoband file for telomerehunter (optional)."
  run_telomerehunter:
    kind: option
    type: boolean
    required: false
    description: "Enable telomerehunter content profiling."
  length_estimator:
    kind: option
    type: string
    required: false
    description: "Override length estimator (short/long)."
  sample_id:
    kind: option
    type: string
    required: false
    description: "Sample id."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/bam_telomere_estimation'
    primary: true
