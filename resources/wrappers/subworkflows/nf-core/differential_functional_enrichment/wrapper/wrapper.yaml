# Agent-facing wrapper adapter for the vendored subworkflow at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: take shapes verified against the subworkflow nf-tests; the adapter maps flat params onto the required [meta, ...] channel shapes.
id: nf-core/subworkflows/differential-functional-enrichment
name: differential functional enrichment
summary: Run functional analysis on differential abundance analysis output
params:
  input_file:
    kind: input
    type: path
    required: true
    description: Option input_file.
  genesets_file:
    kind: input
    type: path
    required: false
    description: Option genesets_file.
  background_file:
    kind: input
    type: path
    required: false
    description: Option background_file.
  method_to_run:
    kind: option
    type: string
    required: true
    enum: [gsea, gprofiler2, decoupler, grea]
    description: Option method_to_run.
  variable:
    kind: option
    type: string
    required: false
    description: Optional companion variable for ch_contrasts.
  reference:
    kind: option
    type: string
    required: false
    description: Optional companion reference for ch_contrasts.
  target:
    kind: option
    type: string
    required: false
    description: Optional companion target for ch_contrasts.
  formula:
    kind: option
    type: string
    required: false
    description: Optional companion formula for ch_contrasts.
  comparison:
    kind: option
    type: string
    required: false
    description: Optional companion comparison for ch_contrasts.
  samples_sheet:
    kind: input
    type: path
    required: true
    description: Option samples_sheet.
  features_sheet:
    kind: input
    type: path
    required: true
    description: Option features_sheet.
  features_id:
    kind: option
    type: string
    required: true
    description: Option features_id.
  features_symbol:
    kind: option
    type: string
    required: true
    description: Option features_symbol.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the subworkflow's results.
outputs:
  results:
    type: directory
    path: ${outdir}/differential_functional_enrichment
    primary: true
