# Agent-facing wrapper adapter for the vendored fastq_align_dedup_bismark subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
id: nf-core/subworkflows/fastq-align-dedup-bismark
name: "Align + dedup (bismark)"
summary: "Align bisulfite reads with bismark, deduplicate and optionally report cytosines."

params:
  reads:
    kind: input
    type: path_glob
    required: true
    description: "FASTQ glob (paired or single)."
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference genome FASTA."
  fai:
    kind: input
    type: path
    required: true
    description: "Reference FASTA index (.fai)."
  bismark_index:
    kind: input
    type: path
    required: true
    description: "bismark index directory."
  skip_deduplication:
    kind: option
    type: boolean
    required: false
    description: "Skip deduplication."
  cytosine_report:
    kind: option
    type: boolean
    required: false
    description: "Run coverage2cytosine."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/fastq_align_dedup_bismark'
    primary: true
