# Agent-facing wrapper adapter for the vendored fasta_index_methylseq subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
# REVIEW: index directories are staged whole; verify companion semantics
id: nf-core/subworkflows/fasta-index-methylseq
name: "Build methylseq indexes"
summary: "Build the full set of methylseq aligner indexes (bismark/bwameth/bwamem) plus fai."

params:
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference genome FASTA."
  fasta_index:
    kind: input
    type: path
    required: false
    description: "Pre-built FASTA index (.fai)."
  bismark_index:
    kind: input
    type: path
    required: false
    description: "Pre-built bismark index directory."
  bwameth_index:
    kind: input
    type: path
    required: false
    description: "Pre-built bwameth index directory."
  bwamem_index:
    kind: input
    type: path
    required: false
    description: "Pre-built bwamem index directory."
  aligner:
    kind: option
    type: string
    required: true
    enum:
      - bismark
      - bismark_hisat
      - bwameth
      - bwamem
    description: "Aligner to index for."
  collecthsmetrics:
    kind: option
    type: boolean
    required: false
    description: "Run picard CollectHsMetrics."
  use_mem2:
    kind: option
    type: boolean
    required: false
    description: "Use bwamem2 for the bwameth index."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/fasta_index_methylseq'
    primary: true
