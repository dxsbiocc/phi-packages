# Agent-facing wrapper adapter for the vendored fastq_align_chromap subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
id: nf-core/subworkflows/fastq-align-chromap
name: "Align chromatin reads (chromap)"
summary: "Align FASTQ reads with chromap (chromatin accessibility / Hi-C)."

params:
  reads:
    kind: input
    type: path_glob
    required: true
    description: "FASTQ glob (paired or single)."
  index:
    kind: input
    type: path
    required: true
    description: "chromap index directory."
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference genome FASTA."
  fai:
    kind: input
    type: path
    required: true
    description: "Reference FASTA index (.fai)."
  barcodes:
    kind: input
    type: path
    required: false
    description: "Barcode file (optional)."
  whitelist:
    kind: input
    type: path
    required: false
    description: "Barcode whitelist (optional)."
  chr_order:
    kind: input
    type: path
    required: false
    description: "Chromosome order file (optional)."
  pairs_chr_order:
    kind: input
    type: path
    required: false
    description: "Pairs chromosome order file (optional)."
  update_readgroups:
    kind: option
    type: boolean
    required: false
    description: "Update read groups post alignment."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/fastq_align_chromap'
    primary: true
