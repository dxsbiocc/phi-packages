# Agent-facing wrapper adapter for the vendored fastq_align_dedup_bwameth subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
id: nf-core/subworkflows/fastq-align-dedup-bwameth
name: "Align + dedup (bwameth)"
summary: "Align bisulfite reads with bwameth, sort, dedup and compute stats."

params:
  reads:
    kind: input
    type: path_glob
    required: true
    description: "FASTQ glob (paired or single)."
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference genome FASTA."
  fai:
    kind: input
    type: path
    required: true
    description: "Reference FASTA index (.fai)."
  bwameth_index:
    kind: input
    type: path
    required: true
    description: "bwameth index directory."
  skip_deduplication:
    kind: option
    type: boolean
    required: false
    description: "Skip deduplication."
  use_gpu:
    kind: option
    type: boolean
    required: false
    description: "Use GPU alignment."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/fastq_align_dedup_bwameth'
    primary: true
