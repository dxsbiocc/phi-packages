# Agent-facing wrapper adapter for the vendored fastq_align_dedup_bwamem subworkflow
# at ../main.nf. Includes the subworkflow only — never another wrapper;
# the subworkflow references the already-migrated module directories.
# Follows docs/contracts/wrapper.md. Manually wired by scripts/wire-manual-subworkflows.py.
# Curated: use_gpu=true needs the licensed Parabricks container; 'interval_file'/'known_sites' are optional
# value channels (only the Parabricks path consumes them).
id: nf-core/subworkflows/fastq-align-dedup-bwamem
name: "Align + dedup (bwa-mem)"
summary: "Align reads with bwa-mem (or parabricks GPU), sort, dedup and compute stats."

params:
  reads:
    kind: input
    type: path_glob
    required: true
    description: "FASTQ glob (paired or single)."
  fasta:
    kind: input
    type: fasta
    required: true
    description: "Reference genome FASTA."
  fai:
    kind: input
    type: path
    required: true
    description: "Reference FASTA index (.fai)."
  bwamem_index:
    kind: input
    type: path
    required: true
    description: "bwa-mem index directory."
  skip_deduplication:
    kind: option
    type: boolean
    required: false
    description: "Skip deduplication."
  use_gpu:
    kind: option
    type: boolean
    required: false
    description: "Use GPU parabricks fq2bam."
  output_fmt:
    kind: option
    type: string
    required: false
    enum:
      - bam
      - cram
    description: "parabricks output format."
  interval_file:
    kind: input
    type: path
    required: false
    description: "Interval file (optional)."
  known_sites:
    kind: input
    type: path
    required: false
    description: "Known sites VCF (optional)."
  outdir:
    kind: output
    type: path
    required: true
    description: "Output directory for the subworkflow's results."

outputs:
  results:
    type: directory
    path: '${outdir}/fastq_align_dedup_bwamem'
    primary: true
