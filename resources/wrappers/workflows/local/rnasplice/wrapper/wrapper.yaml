# Agent-facing wrapper adapter for local/workflows/rnasplice.
# Follows docs/contracts/wrapper.md.
id: local/workflows/rnasplice
name: Alternative Splicing Quantification Workflow
summary: Alternative splicing quantification workflow composing vendored nf-core rMATS prep and SUPPA2 modules; produces .rmats and .dpsi tables for rna_splicing.
params:
  id:
    kind: option
    type: string
    required: false
    description: Contrast identifier used as output prefix.
  gtf:
    kind: input
    type: file
    required: true
    description: Reference gene annotation GTF file.
  bam_samplesheet:
    kind: input
    type: file
    required: false
    description: Optional CSV samplesheet (sample,bam) for RMATS_PREP.
  tx_tpm_cond1:
    kind: input
    type: file
    required: false
    description: Optional transcript-level TPM matrix TSV for condition 1 (SUPPA2).
  tx_tpm_cond2:
    kind: input
    type: file
    required: false
    description: Optional transcript-level TPM matrix TSV for condition 2 (SUPPA2).
  condition1_name:
    kind: option
    type: string
    required: false
    description: Label for condition 1 in SUPPA2 diffSplice.
  condition2_name:
    kind: option
    type: string
    required: false
    description: Label for condition 2 in SUPPA2 diffSplice.
  run_rmats:
    kind: option
    type: boolean
    required: false
    description: Run RMATS_PREP when BAM inputs are provided.
  run_suppa:
    kind: option
    type: boolean
    required: false
    description: Run SUPPA2 event generation, PSI calculation, and diffSplice when TPM matrices are provided.
  read_length:
    kind: option
    type: integer
    required: false
    minimum: 25
    description: RNA-seq read length for rMATS prep.
  suppa_event_type:
    kind: option
    type: string
    required: false
    description: Space-separated SUPPA2 event types.
  suppa_method:
    kind: option
    type: string
    required: false
    description: Statistical test mode for SUPPA2 diffSplice.
    enum:
      - empirical
      - classical
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for rMATS and SUPPA2 deliverables.
outputs:
  results:
    type: directory
    path: ${outdir}
    primary: true
