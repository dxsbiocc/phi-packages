# Agent-facing wrapper adapter for local/workflows/cutandrun.
# Follows docs/contracts/wrapper.md.
id: local/workflows/cutandrun
name: CUT&RUN and CUT&Tag Peak Calling Workflow
summary: CUT&RUN and CUT&Tag alignment and peak-calling workflow (Bowtie2, SEACR, MACS2); called peaks feed directly into chromatin-profiling.
params:
  samplesheet:
    kind: input
    type: file
    required: true
    description: CSV samplesheet describing samples (sample, single_end, fastq_1, fastq_2, bedgraph, ctrl_bedgraph, bam, ctrl_bam).
  bowtie2_index:
    kind: input
    type: path
    required: false
    description: Directory containing Bowtie2 index files (required if aligning FASTQs).
  fasta:
    kind: input
    type: file
    required: false
    description: Reference genome FASTA file (optional for BAM output).
  caller:
    kind: option
    type: string
    required: false
    description: Peak caller to execute on normalized bedGraphs (seacr) or BAMs (macs2).
    enum:
      - seacr
      - macs2
      - both
  seacr_threshold:
    kind: option
    type: number
    required: false
    minimum: 0.0001
    maximum: 1
    description: Top-fraction threshold for SEACR when IgG control bedGraph is omitted.
  seacr_mode:
    kind: option
    type: string
    required: false
    description: SEACR stringency mode.
    enum:
      - stringent
      - relaxed
  seacr_norm:
    kind: option
    type: string
    required: false
    description: SEACR internal normalization mode (norm or non).
    enum:
      - norm
      - non
  macs2_gsize:
    kind: option
    type: string
    required: false
    description: Effective genome size for MACS2 (hs, mm, or numeric value).
  run_align:
    kind: option
    type: boolean
    required: false
    description: Run BOWTIE2_ALIGN on fastq_1/fastq_2 entries before downstream peak calling.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for aligned BAMs and SEACR/MACS2 peaks.
outputs:
  results:
    type: directory
    path: ${outdir}
    primary: true
