# Agent-facing wrapper adapter for the vendored nf-core/scrnaseq pipeline at ../.
# Follows docs/contracts/wrapper.md. Params are a starter subset of
# nextflow_schema.json; REVIEW and curate before publishing.
id: nf-core/workflows/scrnaseq
name: nf-core/scrnaseq
summary: Pipeline for processing 10x Genomics single cell rnaseq data
params:
  input:
    kind: input
    type: csv
    required: true
    description: Path to comma-separated file containing information about the samples in the experiment.
  fasta:
    kind: input
    type: fasta
    required: false
    description: Path to FASTA genome file.
  gtf:
    kind: input
    type: gtf
    required: false
    description: Reference GTF annotation file
  genome:
    kind: input
    type: string
    required: false
    description: Name of iGenomes reference.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for all pipeline results.
  config_profile_name:
    kind: option
    type: string
    required: false
    description: Institutional config name.
  config_profile_description:
    kind: option
    type: string
    required: false
    description: Institutional config description.
  aligner:
    kind: option
    type: string
    required: false
    description: Name of the tool to use for scRNA (pseudo-) alignment.
  protocol:
    kind: option
    type: string
    required: false
    description: "The protocol that was used to generate the single cell data, e.g. 10x Genomics v2 Chemistry.\n\
      \n Can be 'auto' (cellranger only), '10XV1', '10XV2', '10XV3', '10XV4', or any other protocol string\
      \ that will get directly passed the respective aligner."
outputs:
  results:
    type: directory
    path: ${outdir}
    primary: true
