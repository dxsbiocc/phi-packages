# Agent-facing wrapper adapter for the vendored nf-core/sarek pipeline at ../.
# Follows docs/contracts/wrapper.md. Params are a starter subset of
# nextflow_schema.json; REVIEW and curate before publishing.
id: nf-core/workflows/sarek
name: nf-core/sarek
summary: An open-source analysis pipeline to detect germline or somatic variants from whole genome or
  targeted sequencing
params:
  input:
    kind: input
    type: csv
    required: true
    description: Path to comma-separated file containing information about the samples in the experiment.
  fasta:
    kind: input
    type: fasta
    required: false
    description: Path to FASTA genome file.
  genome:
    kind: input
    type: string
    required: false
    description: Name of iGenomes reference.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for all pipeline results.
  step:
    kind: option
    type: string
    required: true
    description: Starting step
  config_profile_name:
    kind: option
    type: string
    required: false
    description: Institutional config name.
  config_profile_description:
    kind: option
    type: string
    required: false
    description: Institutional config description.
  modules_testdata_base_path:
    kind: option
    type: string
    required: false
    description: Base path / URL for data used in the modules
  igenomes_base:
    kind: option
    type: string
    required: false
    description: The base path to the igenomes reference files
  bcftools_annotations:
    kind: option
    type: string
    required: false
    description: A vcf file containing custom annotations to be used with bcftools annotate. Needs to
      be bgzipped.
  bcftools_annotations_tbi:
    kind: option
    type: string
    required: false
    description: Index file for `bcftools_annotations`
  bcftools_header_lines:
    kind: option
    type: string
    required: false
    description: Text file with the header lines of `bcftools_annotations`
  sentieon_dnascope_model:
    kind: option
    type: string
    required: false
    description: Machine learning model for Sentieon Dnascope.
  tools:
    kind: option
    type: string
    required: false
    description: Tools to use for contamination removal, duplicate marking, variant calling and/or for
      annotation.
outputs:
  results:
    type: directory
    path: ${outdir}
    primary: true
