# Agent-facing wrapper adapter for the vendored nf-core/methylseq pipeline at ../.
# Follows docs/contracts/wrapper.md. Params are a starter subset of
# nextflow_schema.json; REVIEW and curate before publishing.
id: nf-core/workflows/methylseq
name: nf-core/methylseq
summary: Methylation (Bisulfite-Sequencing) Best Practice analysis pipeline, part of the nf-core community.
params:
  input:
    kind: input
    type: csv
    required: true
    description: Path to comma-separated file containing information about the samples in the experiment.
  fasta:
    kind: input
    type: fasta
    required: false
    description: Path to FASTA genome file
  genome:
    kind: input
    type: string
    required: false
    description: Name of iGenomes reference.
  aligner:
    kind: option
    type: string
    required: true
    description: Alignment tool to use.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for all pipeline results.
  config_profile_name:
    kind: option
    type: string
    required: false
    description: Institutional config name.
  config_profile_description:
    kind: option
    type: string
    required: false
    description: Institutional config description.
outputs:
  results:
    type: directory
    path: ${outdir}
    primary: true
