# Agent-facing wrapper adapter for the vendored nf-core/rnaseq pipeline at ../.
# Follows docs/contracts/wrapper.md. Params are a starter subset of
# nextflow_schema.json; REVIEW and curate before publishing.
id: nf-core/workflows/rna-seq
name: nf-core/rnaseq
summary: RNA sequencing analysis pipeline for gene/isoform quantification and extensive quality control.
params:
  input:
    kind: input
    type: csv
    required: true
    description: Path to the sample sheet (CSV) containing metadata about the experimental samples.
  fasta:
    kind: input
    type: fasta
    required: false
    description: Path to FASTA genome file.
  gtf:
    kind: input
    type: gtf
    required: false
    description: Path to GTF annotation file.
  gff:
    kind: input
    type: gff
    required: false
    description: Path to GFF3 annotation file.
  genome:
    kind: input
    type: string
    required: false
    description: Name of a `params.genomes` catalogue entry (iGenomes or a user-defined catalogue).
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for all pipeline results.
  ribo_database_manifest:
    kind: option
    type: string
    required: false
    description: Text file containing paths to fasta files (one per line) that will be used to create
      the database for SortMeRNA.
  config_profile_name:
    kind: option
    type: string
    required: false
    description: Institutional config name.
  config_profile_description:
    kind: option
    type: string
    required: false
    description: Institutional config description.
  transcript_fasta:
    kind: option
    type: string
    required: false
    description: Path to FASTA transcriptome file.
  additional_fasta:
    kind: option
    type: string
    required: false
    description: FASTA file to concatenate to genome FASTA file e.g. containing spike-in sequences.
  bbsplit_fasta_list:
    kind: option
    type: string
    required: false
    description: Path to comma-separated file containing a list of reference genomes to filter reads against
      with BBSplit. You have to also explicitly set `--skip_bbsplit false` if you want to use BBSplit.
  hisat2_index:
    kind: option
    type: string
    required: false
    description: Path to directory or tar.gz archive for pre-built HISAT2 index.
  salmon_index:
    kind: option
    type: string
    required: false
    description: Path to directory or tar.gz archive for pre-built Salmon index.
  kraken_db:
    kind: option
    type: string
    required: false
    description: Database when using Kraken2/Bracken for contaminant screening.
  pseudo_aligner:
    kind: option
    type: string
    required: false
    description: Specifies the pseudo aligner to use - available options are 'salmon'. Runs in addition
      to '--aligner'.
  umitools_bc_pattern:
    kind: option
    type: string
    required: false
    description: The UMI barcode pattern to use e.g. 'NNNNNN' indicates that the first 6 nucleotides of
      the read are from the UMI.
outputs:
  results:
    type: directory
    path: ${outdir}
    primary: true
