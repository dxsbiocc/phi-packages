# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics; val input 'contrast_variable' exposed as required option; confirm whether a safe default exists; val input 'reference' exposed as required option; confirm whether a safe default exists; val input 'target' exposed as required option; confirm whether a safe default exists; val input 'formula' exposed as required option; confirm whether a safe default exists; val input 'comparison' exposed as required option; confirm whether a safe default exists; val-only tuple wired as a single sample; verify multi-sample semantics; companion input 'counts' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/deseq2-differential
name: deseq2 differential
summary: runs a differential expression analysis with DESeq2
params:
  contrast_variable:
    kind: option
    type: string
    required: true
    description: The column in the sample sheet that should be used to define groups for comparison
  reference:
    kind: option
    type: string
    required: true
    description: The value within the contrast_variable column of the sample sheet that should be used
      to derive the reference samples
  target:
    kind: option
    type: string
    required: true
    description: The value within the contrast_variable column of the sample sheet that should be used
      to derive the target samples
  formula:
    kind: option
    type: string
    required: true
    description: (Optional) R formula string used for modeling, e.g.
  comparison:
    kind: option
    type: string
    required: true
    description: (Optional, mandatory if formula is provided) Literal string for contrasts, e.g.
  samplesheet:
    kind: input
    type: path
    required: true
    description: CSV or TSV format sample sheet with sample metadata
  counts:
    kind: input
    type: path
    required: false
    description: Raw TSV or CSV format expression matrix as output from the nf-core RNA-seq workflow
  control_genes_file:
    kind: input
    type: path
    required: true
    description: Text file listing control genes, one per line
  transcript_lengths_file:
    kind: input
    type: path
    required: true
    description: Optional file of transcript lengths, with the same sample columns as counts.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  results:
    type: directory
    path: ${outdir}/deseq2_differential
    primary: true
