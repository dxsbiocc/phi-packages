id: nf-core/modules/td2-longorfs
name: td2 longorfs
summary: TD2 identifies candidate coding regions within transcript sequences, such as those generated
  by de novo RNA-Seq transcript assembly
params:
  fasta:
    kind: input
    type: path
    required: true
    description: Fasta file containing the target transcript sequences
  min_len:
    kind: option
    type: integer
    required: false
    description: minimum protein length for proteins in long transcripts, default=90
  abs_min_len:
    kind: option
    type: integer
    required: false
    description: minimum protein length for proteins in short transcripts, default=90
  gene_transmap:
    kind: input
    type: path
    required: true
    description: Gene to transcript mapping file, default=none
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to td2.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  orfs:
    type: directory
    path: ${outdir}/td2_longorfs
    primary: true
