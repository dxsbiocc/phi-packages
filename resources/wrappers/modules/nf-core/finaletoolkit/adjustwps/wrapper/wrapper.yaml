id: nf-core/modules/finaletoolkit-adjustwps
name: finaletoolkit adjustwps
summary: Adjusts raw Windowed Protection Score (WPS) by applying a median filter and Savitsky-Golay filter.
params:
  wps_bigwig:
    kind: input
    type: path
    required: true
    description: BigWig file containing WPS scores for the observed sites
  site_bed:
    kind: input
    type: path
    required: true
    description: BED file containing transcription start sites (TSS)
  chromosome_sizes:
    kind: input
    type: path
    required: true
    description: Two-column file containing the size for each chromosome
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to finaletoolkit.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bigwig:
    type: directory
    path: ${outdir}/finaletoolkit_adjustwps
    primary: true
