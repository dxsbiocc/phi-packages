# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'bai' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/finaletoolkit-delfi
name: finaletoolkit delfi
summary: Calculate the DELFI scores (Cristiano et al., 2019) from a BAM file.
params:
  bam:
    kind: input
    type: path
    required: true
    description: Sorted BAM file
  bai:
    kind: input
    type: path
    required: false
    description: BAM file index
  genome_2bit:
    kind: input
    type: path
    required: true
    description: 2bit compressed genome file (must be the same as the one used for the BAM file)
  chromosome_sizes:
    kind: input
    type: path
    required: true
    description: Two-column file containing the size for each chromosome
  bins:
    kind: input
    type: path
    required: true
    description: BED containing binned genomic coordinates
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to finaletoolkit.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bed:
    type: directory
    path: ${outdir}/finaletoolkit_delfi
    primary: true
