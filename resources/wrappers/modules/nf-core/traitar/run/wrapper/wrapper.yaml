# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) genuinely required (no safe default); caller must supply.
id: nf-core/modules/traitar-run
name: traitar run
summary: Traitar3 - predict microbial phenotypes from genomic sequences using protein families
params:
  fasta:
    kind: input
    type: path
    required: true
    description: Input sequences in FASTA format (nucleotides, genes, or annotation summary), can be gzipped
  input_type:
    kind: option
    type: string
    required: true
    description: Input type specifying the format of input sequences (from_nucleotides, from_genes, or
      from_annotation_summary)
  pfam_db:
    kind: input
    type: path
    required: false
    description: PFAM database directory created by traitar/pfamget module or downloaded from https://ftp.ebi.ac.uk/pub/databases/Pfam/
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to traitar.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  predictions_combined:
    type: directory
    path: ${outdir}/traitar
    primary: true
