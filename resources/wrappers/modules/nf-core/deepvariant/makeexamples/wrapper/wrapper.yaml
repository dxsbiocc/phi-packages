id: nf-core/modules/deepvariant-makeexamples
name: deepvariant makeexamples
summary: Transforms the input alignments to a format suitable for the deep neural network variant caller
params:
  input:
    kind: input
    type: path
    required: true
    description: BAM/CRAM file
  index:
    kind: input
    type: path
    required: false
    description: Index of BAM/CRAM file
  intervals:
    kind: input
    type: path
    required: false
    description: Interval file for targeted regions
  fasta:
    kind: input
    type: path
    required: true
    description: The reference fasta file
  fai:
    kind: input
    type: path
    required: true
    description: Index of reference fasta file
  gzi:
    kind: input
    type: path
    required: true
    description: GZI index of reference fasta file
  par_bed:
    kind: input
    type: path
    required: true
    description: BED file containing PAR regions
  with_phasing:
    kind: option
    type: boolean
    required: false
    description: Whether to generate and capture the phased read inputs for use downstream
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to deepvariant.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  examples:
    type: directory
    path: ${outdir}/deepvariant_makeexamples
    primary: true
