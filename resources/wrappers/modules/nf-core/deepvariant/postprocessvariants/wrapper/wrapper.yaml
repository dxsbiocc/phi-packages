# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/deepvariant-postprocessvariants
name: deepvariant postprocessvariants
summary: DeepVariant is an analysis pipeline that uses a deep neural network to call genetic variants
  from next-generation DNA sequencing data
params:
  variant_calls_tfrecord_files:
    kind: input
    type: path
    required: true
    description: One or more data files containing variant calls from DEEPVARIANT_CALLVARIANTS
  gvcf_tfrecords:
    kind: input
    type: path
    required: false
    description: Sharded tfrecord file from DEEPVARIANT_MAKEEXAMPLES with the coverage information used
      for GVCF output
  small_model_calls:
    kind: input
    type: path
    required: false
    description: Sharded tfrecord file from DEEPVARIANT_MAKEEXAMPLES with variant calls from the small
      model
  phase_inputs:
    kind: input
    type: path
    required: false
    description: Sharded phased read inputs tsv file from DEEPVARIANT_MAKEEXAMPLES
  intervals:
    kind: input
    type: path
    required: false
    description: Interval file for targeted regions
  fasta:
    kind: input
    type: path
    required: true
    description: The reference fasta file
  fai:
    kind: input
    type: path
    required: true
    description: Index of reference fasta file
  gzi:
    kind: input
    type: path
    required: true
    description: GZI index of reference fasta file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to deepvariant.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/deepvariant_postprocessvariants
    primary: true
