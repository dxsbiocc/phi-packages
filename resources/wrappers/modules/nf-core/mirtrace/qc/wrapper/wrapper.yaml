id: nf-core/modules/mirtrace-qc
name: mirtrace qc
summary: A tool for quality control and tracing taxonomic origins of microRNA sequencing data
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: microRNA sequencing data
  mirtrace_config:
    kind: input
    type: path
    required: false
    description: (Optional) CSV with list of FASTQ files to process with one entry per row.
  mirtrace_species:
    kind: option
    type: string
    required: true
    description: Target species in microRNA sequencing data (miRbase encoding, e.g.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  html:
    type: directory
    path: ${outdir}/mirtrace_qc
    primary: true
