# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'bai' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/eklipse
name: eklipse
summary: tool for detection and quantification of large mtDNA rearrangements.
params:
  bam:
    kind: input
    type: path
    required: true
    description: MT BAM/SAM file
  bai:
    kind: input
    type: path
    required: false
    description: MT BAM/SAM index file
  ref_gb:
    kind: input
    type: path
    required: true
    description: mtDNA reference genome in Genbank format, optional if empty NC_012920.1.gb will be used
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to eklipse.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  deletions:
    type: directory
    path: ${outdir}/eklipse
    primary: true
