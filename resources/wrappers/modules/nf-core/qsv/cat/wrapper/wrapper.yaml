# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) genuinely required (no safe default); caller must supply.
id: nf-core/modules/qsv-cat
name: qsv cat
summary: Concatenate two or more CSV (or TSV) tables into a single table
params:
  csv:
    kind: input
    type: path
    required: true
    description: CSV/TSV formatted files
  mode:
    kind: option
    type: string
    required: true
    description: Concatenation mode (rows, columns or rowskey)
  out_format:
    kind: option
    type: string
    required: true
    description: Output format (.csv for comma delimiter, .ssv for semicolon, and .tsv or .tab for tab)
  skip_input_format_check:
    kind: option
    type: boolean
    required: false
    description: Skip input format check (by default QSV checks input format based on file extension)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to qsv.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  csv:
    type: directory
    path: ${outdir}/qsv_cat
    primary: true
