# Agent-facing wrapper adapter for the vendored ashlar module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
# Manually wired: exotic staging pattern.
id: nf-core/modules/ashlar
name: ashlar
summary: Stitch and register multi-cycle microscopy images with ASHLAR.
params:
  images:
    kind: input
    type: path
    required: true
    description: Directory of per-cycle OME-TIFF images.
  opt_dfp:
    kind: input
    type: file
    required: false
    description: Optional dark-field profile image (dfp).
  opt_ffp:
    kind: input
    type: file
    required: false
    description: Optional flat-field profile image (ffp).
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ashlar.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/ashlar
    primary: true
