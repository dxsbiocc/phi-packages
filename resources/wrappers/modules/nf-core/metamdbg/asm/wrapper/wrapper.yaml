id: nf-core/modules/metamdbg-asm
name: metamdbg asm
summary: Metagenome assembler for long-read sequences (HiFi and ONT).
params:
  reads:
    kind: input
    type: path
    required: true
    description: Long read sequence data from ONT or HiFi in fasta format (can be gzipped)
  input_type:
    kind: option
    type: string
    required: true
    description: Sequencing technology for reads - either "hifi" for PacBio HiFi reads or "ont" for Oxford
      Nanopore reads.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to metamdbg.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  contigs:
    type: directory
    path: ${outdir}/metamdbg_asm
    primary: true
