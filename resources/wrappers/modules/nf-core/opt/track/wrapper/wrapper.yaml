id: nf-core/modules/opt-track
name: opt track
summary: track aligns query probe sequences to any target transcriptome
params:
  fwd_oriented_fa:
    kind: input
    type: path
    required: true
    description: Forward oriented fasta file generated by the opt flip command
  ref_annot_gff:
    kind: input
    type: path
    required: true
    description: Reference annotation in gff format
  ref_annot_fa:
    kind: input
    type: path
    required: false
    description: Reference annotation in fasta format
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to opt.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  probes2target:
    type: directory
    path: ${outdir}/opt_track
    primary: true
