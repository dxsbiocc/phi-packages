# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'control_bam' combined cartesian-style; verify if per-sample pairing is required; standalone path 'blacklist_bed' treated as single reference (.first()); verify if a list/collection is expected
id: nf-core/modules/genrich
name: genrich
summary: Peak-calling for ChIP-seq and ATAC-seq enrichment experiments
params:
  treatment_bam:
    kind: input
    type: path
    required: true
    description: Coordinate sorted BAM/SAM file from treatment sample or list of BAM/SAM files from biological
      replicates
  control_bam:
    kind: input
    type: path
    required: false
    description: Coordinate sorted BAM/SAM file from control sample or list of BAM/SAM files from control
      samples
  blacklist_bed:
    kind: input
    type: path
    required: false
    description: Bed file containing genomic intervals to exclude from the analysis
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to genrich.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  peak:
    type: directory
    path: ${outdir}/genrich
    primary: true
