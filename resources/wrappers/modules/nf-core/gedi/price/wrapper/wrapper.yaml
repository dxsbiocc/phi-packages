# Agent-facing wrapper adapter for the vendored gedi/price module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
# Manually wired: exotic staging pattern.
id: nf-core/modules/gedi-price
name: gedi price
summary: Identify translated ORFs from Ribo-seq BAMs with GEDI PRICE.
params:
  bams:
    kind: input
    type: path
    required: true
    description: Directory of Ribo-seq BAMs (*.bam) with their .bam.bai indexes alongside.
  index:
    kind: input
    type: path
    required: true
    description: GEDI genome index directory (from gedi indexgenome).
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gedi.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/gedi_price
    primary: true
