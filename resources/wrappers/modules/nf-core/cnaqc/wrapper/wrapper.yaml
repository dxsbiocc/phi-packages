# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'cna_rds' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/cnaqc
name: cnaqc
summary: Quality control of copy number data from bulk WGS assays
params:
  snv_rds:
    kind: input
    type: path
    required: true
    description: R object with mutation data
  cna_rds:
    kind: input
    type: path
    required: false
    description: R object with copy number data
  tumour_sample:
    kind: option
    type: string
    required: true
    description: string containing sample name
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to cnaqc.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  qc_rds:
    type: directory
    path: ${outdir}/cnaqc
    primary: true
