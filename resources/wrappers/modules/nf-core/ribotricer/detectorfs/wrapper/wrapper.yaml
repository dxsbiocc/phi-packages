# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'bai' combined cartesian-style; verify if per-sample pairing is required; val input 'strandedness' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/ribotricer-detectorfs
name: ribotricer detectorfs
summary: Accurate detection of short and long active ORFs using Ribo-seq data
params:
  bam:
    kind: input
    type: path
    required: true
    description: BAM/CRAM/SAM file
  bai:
    kind: input
    type: path
    required: false
    description: Index for sorted BAM/CRAM/SAM file
  strandedness:
    kind: option
    type: string
    required: true
    description: Strandedness of the data
  candidate_orfs:
    kind: input
    type: path
    required: true
    description: TSV file with candidate ORFs from 'ribotricer prepareorfs'
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ribotricer.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  protocol:
    type: directory
    path: ${outdir}/ribotricer_detectorfs
    primary: true
