# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/duphold
name: duphold
summary: SV callers like lumpy look at split-reads and pair distances to find structural variants.
params:
  alignment_file:
    kind: input
    type: path
    required: true
    description: file containing alignments
  alignment_index:
    kind: input
    type: path
    required: false
    description: index of alignment file
  sv_variants:
    kind: input
    type: path
    required: false
    description: A variants file containing structural variants
  snp_variants:
    kind: input
    type: path
    required: false
    description: A variants file containing SNPs
  snp_variants_index:
    kind: input
    type: path
    required: false
    description: index of snp variants file
  fasta:
    kind: input
    type: path
    required: false
    description: fasta file
  fasta_fai:
    kind: input
    type: path
    required: false
    description: Index of fasta file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to duphold.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/duphold
    primary: true
