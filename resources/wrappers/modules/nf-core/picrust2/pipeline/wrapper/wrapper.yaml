# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/picrust2-pipeline
name: picrust2 pipeline
summary: Predict metagenome functional content from marker gene sequences and OTU/ASV abundance data
params:
  sequences:
    kind: input
    type: path
    required: true
    description: FASTA file containing study sequences (e.g., 16S rRNA sequences)
  otu_table:
    kind: input
    type: path
    required: false
    description: OTU/ASV abundance table in BIOM or TSV format
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to picrust2.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  output_dir:
    type: directory
    path: ${outdir}/picrust2_pipeline
    primary: true
