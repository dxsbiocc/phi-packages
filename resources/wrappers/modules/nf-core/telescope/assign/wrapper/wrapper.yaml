# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: verified single-invocation wiring (single-valued reference params; call arity matches module inputs).
id: nf-core/modules/telescope-assign
name: telescope assign
summary: The telescope assign program finds overlapping reads between an alignment (SAM/BAM) and an annotation
  (GTF) then reassigns reads using a statistical model.
params:
  bam:
    kind: input
    type: path
    required: true
    description: Sorted BAM/CRAM/SAM file, File must be collated so that all alignments for a read pair
      appear sequentially in the file
  gtf:
    kind: input
    type: path
    required: true
    description: Annotation file which includes TE loci.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to telescope.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bam:
    type: directory
    path: ${outdir}/telescope_assign
    primary: true
