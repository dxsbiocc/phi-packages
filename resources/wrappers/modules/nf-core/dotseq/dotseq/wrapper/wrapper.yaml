# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/dotseq-dotseq
name: dotseq dotseq
summary: Detect differential ORF usage (DOU) and ORF-level differential translation efficiency (DTE) from
  Ribo-seq with matched RNA-seq using DOTSeq.
params:
  contrast_variable:
    kind: option
    type: string
    required: true
    description: Sample-sheet column that holds the experimental condition (mapped to DOTSeq's `condition`
      internally).
  reference:
    kind: option
    type: string
    required: true
    description: Value of the contrast_variable to use as reference (baseline).
  target:
    kind: option
    type: string
    required: true
    description: Value of the contrast_variable to use as target (non-reference).
  samplesheet:
    kind: input
    type: path
    required: true
    description: CSV or TSV sample sheet with `run`, `strategy`, `replicate`, and `condition` columns
      (defaults; can be overridden via task.ext.args).
  counts:
    kind: input
    type: path
    required: false
    description: Per-ORF count matrix.
  annotation:
    kind: input
    type: path
    required: false
    description: Per-ORF annotation table (one row per ORF).
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  translation:
    type: directory
    path: ${outdir}/dotseq_dotseq
    primary: true
