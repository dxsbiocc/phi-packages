# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/glimpse2-chunk
name: glimpse2 chunk
summary: Defines chunks where to run imputation
params:
  input:
    kind: input
    type: path
    required: true
    description: Target dataset in VCF/BCF format defined at all variable positions.
  input_index:
    kind: input
    type: path
    required: false
    description: Index file of the input VCF/BCF file containing genotype likelihoods.
  map:
    kind: input
    type: path
    required: false
    description: File containing the genetic map.
  region:
    kind: option
    type: string
    required: true
    description: Target region, usually a full chromosome (e.g.
  model:
    kind: option
    type: string
    required: true
    description: 'Algorithm model to use: "recursive": Recursive algorithm "sequential": Sequential algorithm
      (Recommended) "uniform-number-variants": Experimental.'
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to glimpse2.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  chunk_chr:
    type: directory
    path: ${outdir}/glimpse2_chunk
    primary: true
