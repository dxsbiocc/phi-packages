# Agent-facing wrapper adapter for the vendored merqury/hapmers module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
# Manually wired: exotic staging pattern.
id: nf-core/modules/merqury-hapmers
name: merqury hapmers
summary: Find parent-specific hap-mers from child/maternal/paternal meryl databases.
params:
  child_meryl:
    kind: input
    type: path
    required: true
    description: Child meryl database directory.
  maternal_meryl:
    kind: input
    type: path
    required: true
    description: Maternal meryl database directory.
  paternal_meryl:
    kind: input
    type: path
    required: true
    description: Paternal meryl database directory.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to merqury.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/merqury_hapmers
    primary: true
