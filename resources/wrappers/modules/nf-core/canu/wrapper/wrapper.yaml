    kind: input
    type: fastq_glob
    required: true
    description: fasta/fastq file
  mode:
    kind: option
    type: string
    required: true
    description: Canu mode depending on the input data (source and error rate)
  genomesize:
    kind: option
    type: string
    required: true
    description: An estimate of the size of the genome.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to canu.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  report:
    type: directory
    path: ${outdir}/canu
    primary: true
