# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'medium' combined cartesian-style; verify if per-sample pairing is required; standalone path 'db' treated as single reference (.first()); verify if a list/collection is expected
id: nf-core/modules/gapseq-doall
name: gapseq doall
summary: Complete gapseq workflow from genome to gap-filled model
params:
  fasta:
    kind: input
    type: path
    required: true
    description: Protein or genomic FASTA file
  medium:
    kind: input
    type: path
    required: false
    description: Optional medium definition file (CSV format)
  db:
    kind: input
    type: path
    required: false
    description: Optional gapseq reference sequence database directory (from GAPSEQ_REQUESTDB).
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gapseq.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  model:
    type: directory
    path: ${outdir}/gapseq_doall
    primary: true
