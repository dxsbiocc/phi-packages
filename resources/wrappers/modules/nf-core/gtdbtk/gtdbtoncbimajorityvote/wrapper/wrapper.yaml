    kind: input
    type: path
    required: true
    description: All the output files from GTDB-Tk
  gtdbtk_prefix:
    kind: option
    type: string
    required: false
    description: The prefix used when running gtdbtk/classifywf.
  ar53_metadata:
    kind: input
    type: path
    required: true
    description: GTDB ar53 metadata file (from https://data.ace.uq.edu.au/public/gtdb/data/releases/latest/)
  bac120_metadata:
    kind: input
    type: path
    required: true
    description: GTDB bac120 metadata file (from https://data.ace.uq.edu.au/public/gtdb/data/releases/latest/)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gtdbtk.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
