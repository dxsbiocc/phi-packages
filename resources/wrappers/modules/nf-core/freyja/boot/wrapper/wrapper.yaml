# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/freyja-boot
name: freyja boot
summary: Bootstrap sample demixing by resampling each site based on a multinomial distribution of read
  depth across all sites, where the event probabilities were determined by the fraction of the total sample
  reads found at each site, followed by a secondary resampling at each site according to a multinomial
params:
  variants:
    kind: input
    type: path
    required: true
    description: File containing identified variants in a gff-like format
  depths:
    kind: input
    type: path
    required: false
    description: File containing depth of the variants
  repeats:
    kind: option
    type: integer
    required: true
    description: Number of bootstrap repeats to perform
  barcodes:
    kind: input
    type: path
    required: true
    description: File containing lineage defining barcodes
  lineages_meta:
    kind: input
    type: path
    required: true
    description: Optional file containing lineage metadata that correspond to barcodes
  lineages_topology:
    kind: input
    type: path
    required: true
    description: Optional file containing lineage topology information that correspond to barcodes
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to freyja.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  lineages:
    type: directory
    path: ${outdir}/freyja_boot
    primary: true
