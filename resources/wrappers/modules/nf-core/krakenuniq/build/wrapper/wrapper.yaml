# Agent-facing wrapper adapter for the vendored krakenuniq/build module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
# Manually wired: exotic staging pattern.
id: nf-core/modules/krakenuniq-build
name: krakenuniq build
summary: Build a KrakenUniq database from custom library/taxonomy directories and a seqid2taxid map.
params:
  library:
    kind: input
    type: path
    required: true
    description: Directory of library FASTA files (contents staged under library/).
  taxonomy:
    kind: input
    type: path
    required: true
    description: Directory of taxonomy dump files (contents staged under taxonomy/).
  seqid2taxid:
    kind: input
    type: file
    required: true
    description: seqid2taxid.map file.
  keep_intermediate:
    kind: option
    type: boolean
    required: false
    description: Keep intermediate database files.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to krakenuniq.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/krakenuniq_build
    primary: true
