id: nf-core/modules/concoct-concoctcoveragetable
name: concoct concoctcoveragetable
summary: Generate the input coverage table for CONCOCT using a BEDFile
params:
  bed:
    kind: input
    type: path
    required: true
    description: BED file describing where each contig was cut up (typically output from CONCOCT's cut_up_fasta.py)
  bamfiles:
    kind: input
    type: path
    required: false
    description: A single or list of BAM files of reads mapped back to original contigs (prior cutting
      up)
  baifiles:
    kind: input
    type: path
    required: false
    description: A single or list of BAM index files (.bai) corresponding to BAM
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to concoct.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  tsv:
    type: directory
    path: ${outdir}/concoct_concoctcoveragetable
    primary: true
