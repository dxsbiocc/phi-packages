# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/regenie-step2
name: regenie step2
summary: Run REGENIE step 2 association testing from precomputed step 1 predictions
params:
  plink_genotype_file:
    kind: input
    type: path
    required: true
    description: PLINK primary genotype file in BED or PGEN format
  plink_variant_file:
    kind: input
    type: path
    required: false
    description: PLINK variant metadata file in BIM or PVAR format
  plink_sample_file:
    kind: input
    type: path
    required: false
    description: PLINK sample metadata file in FAM or PSAM format
  predictions:
    kind: input
    type: path
    required: true
    description: REGENIE step 1 prediction list file passed to `--pred`
  loco_files:
    kind: input
    type: path
    required: false
    description: REGENIE step 1 LOCO prediction files staged alongside the prediction list
  pheno:
    kind: input
    type: path
    required: true
    description: Phenotype file passed to `--phenoFile`
  covar:
    kind: input
    type: path
    required: true
    description: Optional covariate file passed to `--covarFile`; provide `[]` when absent
  bsize:
    kind: option
    type: integer
    required: true
    description: Required genotype block size passed to `--bsize`
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to regenie.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  results:
    type: directory
    path: ${outdir}/regenie_step2
    primary: true
