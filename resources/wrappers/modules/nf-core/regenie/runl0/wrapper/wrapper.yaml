# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'plink_variant_file' combined cartesian-style; verify if per-sample pairing is required; companion input 'plink_sample_file' combined cartesian-style; verify if per-sample pairing is required; companion input 'snplist' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/regenie-runl0
name: regenie runl0
summary: Run one REGENIE step 1 level-0 job from a split master file
params:
  plink_genotype_file:
    kind: input
    type: path
    required: true
    description: PLINK primary genotype file in BED or PGEN format
  plink_variant_file:
    kind: input
    type: path
    required: false
    description: PLINK variant metadata file in BIM or PVAR format
  plink_sample_file:
    kind: input
    type: path
    required: false
    description: PLINK sample metadata file in FAM or PSAM format
  master:
    kind: input
    type: path
    required: true
    description: REGENIE split level-0 master file from `regenie/splitl0`
  snplist:
    kind: input
    type: path
    required: false
    description: Per-job variant list staged because the master file references it; the path is not passed
      explicitly to REGENIE
  job_number:
    kind: option
    type: integer
    required: true
    description: Level-0 job number passed as the second value to `--run-l0`
  pheno:
    kind: input
    type: path
    required: true
    description: Phenotype file passed to `--phenoFile`
  covar:
    kind: input
    type: path
    required: true
    description: Optional covariate file passed to `--covarFile`; provide `[]` when absent
  bsize:
    kind: option
    type: integer
    required: false
    description: Optional block size passed to `--bsize`; pass `[]` to use the module default of `1000`
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to regenie.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  l0_predictions:
    type: directory
    path: ${outdir}/regenie_runl0
    primary: true
