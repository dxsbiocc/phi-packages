# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics; companion input 'plink_variant_file' combined cartesian-style; verify if per-sample pairing is required; companion input 'plink_sample_file' combined cartesian-style; verify if per-sample pairing is required; val input 'bsize' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/regenie-step1
name: regenie step1
summary: Run REGENIE step 1 to fit whole-genome regression models and emit LOCO predictions
params:
  plink_genotype_file:
    kind: input
    type: path
    required: true
    description: PLINK primary genotype file in BED or PGEN format
  plink_variant_file:
    kind: input
    type: path
    required: false
    description: PLINK variant metadata file in BIM or PVAR format
  plink_sample_file:
    kind: input
    type: path
    required: false
    description: PLINK sample metadata file in FAM or PSAM format
  pheno:
    kind: input
    type: path
    required: true
    description: Phenotype file passed to `--phenoFile`
  covar:
    kind: input
    type: path
    required: true
    description: Optional covariate file passed to `--covarFile`; provide `[]` when absent
  bsize:
    kind: option
    type: integer
    required: true
    description: Optional block size passed to `--bsize`; pass `[]` to use the module default of `1000`
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to regenie.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  predictions:
    type: directory
    path: ${outdir}/regenie_step1
    primary: true
