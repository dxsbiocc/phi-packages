# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'barcodes' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/souporcell
name: souporcell
summary: souporcell is a method for clustering mixed-genotype scRNAseq experiments by individual.
params:
  bam:
    kind: input
    type: path
    required: true
    description: A BAM file from cellranger containing single-cell RNA-seq alignments.
  barcodes:
    kind: input
    type: path
    required: false
    description: A barcode or whitelist TSV file from cellranger identifying individual cell barcodes.
  clusters:
    kind: option
    type: integer
    required: true
    description: Number of clusters.
  fasta:
    kind: input
    type: path
    required: true
    description: A reference fasta file.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to souporcell.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  clusters:
    type: directory
    path: ${outdir}/souporcell
    primary: true
