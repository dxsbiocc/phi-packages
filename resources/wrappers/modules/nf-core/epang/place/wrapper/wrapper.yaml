# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'referencealn' combined cartesian-style; verify if per-sample pairing is required; companion input 'referencetree' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/epang-place
name: epang place
summary: phylogenetic placement of query sequences in a reference tree
params:
  queryaln:
    kind: input
    type: path
    required: true
    description: aligned query sequences in any supported format including phylip and fasta, may be gzipped
  referencealn:
    kind: input
    type: path
    required: false
    description: reference alignment in any supported format including phylip and fasta, may be gzipped
  referencetree:
    kind: input
    type: path
    required: false
    description: newick file containing the reference tree in which query sequences will be placed
  bfastfile:
    kind: input
    type: path
    required: true
    description: file argument to the --bfast parameter
  binaryfile:
    kind: input
    type: path
    required: true
    description: file argument to the --binary parameter
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to epang.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  epang:
    type: directory
    path: ${outdir}/epang_place
    primary: true
