# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics
id: nf-core/modules/chromograph
name: chromograph
summary: Chromograph is a python package to create PNG images from genetics data such as BED and WIG files.
params:
  autozyg:
    kind: input
    type: path
    required: true
    description: Bed file containing the regions of autozygosity
  coverage:
    kind: input
    type: path
    required: true
    description: Wig file containing the coverage information
  exome:
    kind: input
    type: path
    required: true
    description: Bed file containing the coverage for exome.
  fracsnp:
    kind: input
    type: path
    required: true
    description: Wig file containing the fraction of homozygous SNPs
  ideogram:
    kind: input
    type: path
    required: true
    description: Bed file containing information necessary for ideogram plots.
  regions:
    kind: input
    type: path
    required: true
    description: Bed file containing UPD regions
  sites:
    kind: input
    type: path
    required: true
    description: Bed file containing UPD sites
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to chromograph.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  plots:
    type: directory
    path: ${outdir}/chromograph
    primary: true
