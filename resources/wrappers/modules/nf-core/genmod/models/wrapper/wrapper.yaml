id: nf-core/modules/genmod-models
name: genmod models
summary: annotate models of inheritance
params:
  input_vcf:
    kind: input
    type: path
    required: true
    description: vcf file
  fam:
    kind: input
    type: path
    required: false
    description: PED file with family information
  reduced_penetrance:
    kind: input
    type: path
    required: true
    description: file with gene ids that have reduced penetrance
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to genmod.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/genmod_models
    primary: true
