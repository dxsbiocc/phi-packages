# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'reads' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/deacon-filter
name: deacon filter
summary: Filter DNA sequences using index of reference genome
params:
  index:
    kind: input
    type: path
    required: true
    description: Deacon minimizer index file
  reads:
    kind: input
    type: path
    required: false
    description: List of input FastQ files of size 1 and 2 for single-end and paired-end data, respectively.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to deacon.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  fastq_filtered:
    type: directory
    path: ${outdir}/deacon_filter
    primary: true
