# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'seqdb' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/infernal-cmsearch
name: infernal cmsearch
summary: Search covariance models against a sequence database
params:
  cmfile:
    kind: input
    type: path
    required: true
    description: A calibrated Infernal covariance model file
  seqdb:
    kind: input
    type: path
    required: false
    description: A FASTA file of sequences to search the covariance models against.
  write_align:
    kind: option
    type: boolean
    required: false
    description: Flag to save optional alignment output in Stockholm format.
  write_target:
    kind: option
    type: boolean
    required: false
    description: Flag to save optional per target summary in a tabular format.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to infernal.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  output:
    type: directory
    path: ${outdir}/infernal_cmsearch
    primary: true
