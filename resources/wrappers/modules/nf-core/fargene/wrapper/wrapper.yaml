# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: val input 'hmm_model' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/fargene
name: fargene
summary: tool that takes either fragmented metagenomic data or longer sequences as input and predicts
  and delivers full-length antiobiotic resistance genes as output.
params:
  input:
    kind: input
    type: path
    required: true
    description: uncompressed fasta file or paired-end fastq files containing either genomes or longer
      contigs as nucleotide or protein sequences (fasta) or fragmented metagenomic reads (fastq)
  hmm_model:
    kind: option
    type: string
    required: true
    description: name of custom hidden markov model to be used [pre-defined class_a, class_b_1_2, class_b_3,
      class_c, class_d_1, class_d_2, qnr, tet_efflux, tet_rpg, tet_enzyme]
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fargene.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  log:
    type: directory
    path: ${outdir}/fargene
    primary: true
