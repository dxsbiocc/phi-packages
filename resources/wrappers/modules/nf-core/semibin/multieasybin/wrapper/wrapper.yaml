# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'bam' combined cartesian-style; verify if per-sample pairing is required; companion input 'depths' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/semibin-multieasybin
name: semibin multieasybin
summary: metagenomic binning with self-supervised learning
params:
  fasta:
    kind: input
    type: path
    required: true
    description: Fasta file of concatenated contigs from all samples to be binned.
  bam:
    kind: input
    type: path
    required: false
    description: A list of BAM/CRAM files - one per sample, mapped to the concatenated reference.
  depths:
    kind: input
    type: path
    required: false
    description: Optionally, instead of BAM files, a list of text files in Strobealign --aemb format.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to semibin.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bins:
    type: directory
    path: ${outdir}/semibin_multieasybin
    primary: true
