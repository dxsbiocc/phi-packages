    kind: input
    type: path
    required: true
    description: File with taxon ids to look up, each on their own line (provide either this or name,
      not both; the file can contain other information, see the tool's docs)
  taxid:
    kind: option
    type: string
    required: false
    description: Taxon id to look up (provide either this or taxidfile, not both)
  taxdb:
    kind: input
    type: path
    required: false
    description: Taxonomy database unpacked from ftp://ftp.ncbi.nih.gov/pub/taxonomy/taxdump.tar.gz
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to taxonkit.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  tsv:
    type: directory
    path: ${outdir}/taxonkit_lineage
    primary: true
