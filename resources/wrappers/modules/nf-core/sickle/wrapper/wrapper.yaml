# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) genuinely required (no safe default); caller must supply.
id: nf-core/modules/sickle
name: sickle
summary: A windowed adaptive trimming tool for FASTQ files using quality
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: List of input FastQ files of size 1 and 2 for single-end and paired-end data, respectively.
  qual_type:
    kind: option
    type: string
    required: true
    description: sickle needs a base quality values, which could be either illumina, solexa or sanger
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to sickle.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  single_trimmed:
    type: directory
    path: ${outdir}/sickle
    primary: true
