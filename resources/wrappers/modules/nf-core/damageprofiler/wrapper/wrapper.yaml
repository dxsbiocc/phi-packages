# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: standalone path 'fasta' treated as single reference (.first()); verify if a list/collection is expected; standalone path 'fai' treated as single reference (.first()); verify if a list/collection is expected
id: nf-core/modules/damageprofiler
name: damageprofiler
summary: A Java based tool to determine damage patterns on ancient DNA as a replacement for mapDamage
params:
  bam:
    kind: input
    type: path
    required: true
    description: BAM/CRAM/SAM file
  fasta:
    kind: input
    type: path
    required: false
    description: OPTIONAL FASTA reference file
  fai:
    kind: input
    type: path
    required: false
    description: OPTIONAL FASTA index file from samtools faidx
  specieslist:
    kind: input
    type: path
    required: true
    description: OPTIONAL text file with list of target reference headers
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to damageprofiler.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  results:
    type: directory
    path: ${outdir}/damageprofiler
    primary: true
