# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'reads' combined cartesian-style; verify if per-sample pairing is required; standalone path 'fasta' treated as single reference (.first()); verify if a list/collection is expected; standalone path 'vdj_reference' treated as single reference (.first()); verify if a list/collection is expected; val input 'cell_barcode_read' exposed as required option; confirm whether a safe default exists; val input 'umi_read' exposed as required option; confirm whether a safe default exists; val input 'read_format' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/trust4
name: trust4
summary: Run TRUST4 on RNA-seq data
params:
  bam:
    kind: input
    type: path
    required: true
    description: BAM file from bulk or single-cell RNA-seq data
  reads:
    kind: input
    type: path
    required: false
    description: List of input FastQ files of size 1 and 2 for single-end and paired-end data, respectively
  fasta:
    kind: input
    type: path
    required: false
    description: Path to the fasta file coordinate and sequence of V/D/J/C genes
  vdj_reference:
    kind: input
    type: path
    required: false
    description: reference file of V/D/J genes
  barcode_whitelist:
    kind: input
    type: path
    required: true
    description: BarocdeWhitelist file
  cell_barcode_read:
    kind: option
    type: string
    required: true
    description: Read containing cell barcode (either R1 or R2)
  umi_read:
    kind: option
    type: string
    required: true
    description: Read containing umi barcode (either R1 or R2)
  read_format:
    kind: option
    type: string
    required: true
    description: Specifies where in the read the barcodes and UMIs can be found.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to trust4.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  tsv:
    type: directory
    path: ${outdir}/trust4
    primary: true
