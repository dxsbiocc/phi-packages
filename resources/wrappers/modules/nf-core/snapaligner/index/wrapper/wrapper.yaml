# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/snapaligner-index
name: snapaligner index
summary: Create a SNAP index for reference genome
params:
  fasta:
    kind: input
    type: path
    required: true
    description: Input genome fasta file
  altcontigfile:
    kind: input
    type: path
    required: false
    description: Optional file with a list of alt contig names, one per line.
  nonaltcontigfile:
    kind: input
    type: path
    required: false
    description: Optional file that contains a list of contigs (one per line) that will not be marked
      ALT regardless of size.
  altliftoverfile:
    kind: input
    type: path
    required: false
    description: Optional file containing ALT-to-REF mappings (SAM format).
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to snapaligner.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  index:
    type: directory
    path: ${outdir}/snapaligner_index
    primary: true
