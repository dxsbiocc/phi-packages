# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics
id: nf-core/modules/strobealign
name: strobealign
summary: Align short reads using dynamic seed size with strobemers
params:
  reads:
    kind: input
    type: path
    required: true
    description: List of input FastQ files of size 1 and 2 for single-end and paired-end data, respectively.
  fasta:
    kind: input
    type: path
    required: true
    description: Reference genome in FASTA format
  index:
    kind: input
    type: path
    required: true
    description: Strobealign genome index file
  sort_bam:
    kind: option
    type: boolean
    required: false
    description: use samtools sort (true) or samtools view (false)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to strobealign.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bam:
    type: directory
    path: ${outdir}/strobealign
    primary: true
