id: nf-core/modules/macsyfinder-search
name: macsyfinder search
summary: Search for macromolecular systems in protein datasets using MacSyFinder
params:
  proteins:
    kind: input
    type: path
    required: true
    description: Protein sequence file in FASTA format
  models:
    kind: input
    type: path
    required: true
    description: Directory containing MacSyFinder model(s)
  model_names:
    kind: option
    type: string
    required: true
    description: Space-separated list of model names to search for.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to macsyfinder.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  results:
    type: directory
    path: ${outdir}/macsyfinder_search
    primary: true
