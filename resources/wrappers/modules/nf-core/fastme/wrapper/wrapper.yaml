# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/fastme
name: fastme
summary: Distance-based phylogeny with FastME
params:
  infile:
    kind: input
    type: path
    required: true
    description: MSA or distance matrix in Phylip format
  initial_tree:
    kind: input
    type: path
    required: false
    description: Initial tree
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fastme.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  nwk:
    type: directory
    path: ${outdir}/fastme
    primary: true
