# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: verified single-invocation wiring (single-valued reference params; call arity matches module inputs).
id: nf-core/modules/viralconsensus
name: viralconsensus
summary: Fast and memory-efficient viral consensus genome sequence generation from read alignments
params:
  bam:
    kind: input
    type: path
    required: true
    description: BAM/SAM/CRAM file containing aligned reads
  fasta:
    kind: input
    type: path
    required: true
    description: Reference genome sequence in FASTA format
  primer_bed:
    kind: input
    type: path
    required: false
    description: Optional BED file with primer coordinates for trimming
  save_pos_counts:
    kind: option
    type: boolean
    required: false
    description: Save per-position counts to a TSV file
  save_ins_counts:
    kind: option
    type: boolean
    required: false
    description: Save insertion counts to a JSON file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to viralconsensus.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  fasta:
    type: directory
    path: ${outdir}/viralconsensus
    primary: true
