  extensions:
    kind: input
    type: path
    required: true
    description: A quarto `_extensions` directory with custom template(s) to be available for rendering.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to quarto.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
