# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/apbs
name: apbs
summary: Compute biomolecular electrostatics by solving the Poisson-Boltzmann equation using APBS (Adaptive
  Poisson-Boltzmann Solver).
params:
  apbs_input:
    kind: input
    type: path
    required: true
    description: APBS input configuration file specifying the electrostatics calculation, including paths
      to molecular structure files (PQR/PDB) and calculation parameters.
  pqr:
    kind: input
    type: path
    required: false
    description: One or more PQR molecular structure files referenced by the input configuration file.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to apbs.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  dx:
    type: directory
    path: ${outdir}/apbs
    primary: true
