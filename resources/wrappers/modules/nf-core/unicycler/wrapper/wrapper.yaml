# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/unicycler
name: unicycler
summary: Assembles bacterial genomes
params:
  shortreads:
    kind: input
    type: fastq_glob
    required: true
    description: List of input Illumina FastQ files of size 1 and 2 for single-end and paired-end data,
      respectively.
  longreads:
    kind: input
    type: path
    required: false
    description: List of input FastQ files of size 1, PacBio or Nanopore long reads.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to unicycler.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  scaffolds:
    type: directory
    path: ${outdir}/unicycler
    primary: true
