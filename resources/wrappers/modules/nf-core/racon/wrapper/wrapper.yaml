# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: one sample per invocation (guarded); reads, assembly and paf are that sample's set, paired 1:1.
id: nf-core/modules/racon
name: racon
summary: Consensus module for raw de novo DNA assembly of long uncorrected reads
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: List of input FastQ files for one sample (a multi-sample glob is rejected).
  assembly:
    kind: input
    type: path
    required: false
    description: Genome assembly to be improved
  paf:
    kind: input
    type: path
    required: false
    description: Alignment in PAF format
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to racon.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  improved_assembly:
    type: directory
    path: ${outdir}/racon
    primary: true
