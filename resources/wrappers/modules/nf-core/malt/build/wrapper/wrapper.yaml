# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: glob input 'fastas' collected into one staged list; verify staging layout; standalone path 'gff' treated as single reference (.first()); verify if a list/collection is expected; standalone path 'mapping_db' treated as single reference (.first()); verify if a list/collection is expected; val input 'map_type' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/malt-build
name: malt build
summary: MALT, an acronym for MEGAN alignment tool, is a sequence alignment and analysis tool designed
  for processing high-throughput sequencing data, especially in the context of metagenomics.
params:
  fastas:
    kind: input
    type: path
    required: true
    description: Directory of, or list of FASTA reference files for indexing
  gff:
    kind: input
    type: path
    required: false
    description: Directory of, or GFF3 files of input FASTA files
  mapping_db:
    kind: input
    type: path
    required: false
    description: An uncompressed MEGAN mapping file from https://software-ab.cs.uni-tuebingen.de/download/megan6/welcome.html
      (either mapping db, or acc2* .abin file)
  map_type:
    kind: option
    type: string
    required: true
    description: The type of map file provided to the pipeline.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to malt.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  index:
    type: directory
    path: ${outdir}/malt_build
    primary: true
