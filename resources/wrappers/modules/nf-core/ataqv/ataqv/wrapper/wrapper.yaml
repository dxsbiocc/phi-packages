# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/ataqv-ataqv
name: ataqv ataqv
summary: ataqv function of a corresponding ataqv tool
params:
  bam:
    kind: input
    type: path
    required: true
    description: BAM file
  bai:
    kind: input
    type: path
    required: false
    description: BAM index file with the same prefix as bam file.
  peak_file:
    kind: input
    type: path
    required: false
    description: A BED file of peaks called for alignments in the BAM file
  organism:
    kind: option
    type: string
    required: true
    description: The subject of the experiment, which determines the list of autosomes (see "Reference
      Genome Configuration" section at https://github.com/ParkerLab/ataqv).
  mito_name:
    kind: option
    type: string
    required: false
    description: Name of the mitochondrial sequence.
  tss_file:
    kind: input
    type: path
    required: true
    description: A BED file of transcription start sites for the experiment organism.
  excl_regs_file:
    kind: input
    type: path
    required: true
    description: A BED file containing excluded regions.
  autosom_ref_file:
    kind: input
    type: path
    required: true
    description: A file containing autosomal reference names, one per line.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ataqv.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  json:
    type: directory
    path: ${outdir}/ataqv_ataqv
    primary: true
