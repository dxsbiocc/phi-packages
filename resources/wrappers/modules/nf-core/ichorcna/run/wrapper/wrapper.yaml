# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
id: nf-core/modules/ichorcna-run
name: ichorcna run
summary: ichorCNA is an R package for calculating copy number alteration from (low-pass) whole genome
  sequencing, particularly for use in cell-free DNA
params:
  wig:
    kind: input
    type: path
    required: true
    description: hmmcopy/readCounter processed .wig file giving the number of reads in the sample, in
      each genomic window
  gc_wig:
    kind: input
    type: path
    required: true
    description: hmmcopy/gcCounter processed .wig file giving the gc content in the reference fasta, in
      each genomic window
  map_wig:
    kind: input
    type: path
    required: true
    description: hmmcopy/mapCounter processed .wig file giving the mapability in the reference fasta,
      in each genomic window
  normal_wig:
    kind: input
    type: path
    required: true
    description: hmmcopy/readCounter processed .wig file giving the number of reads in the normal sample,
      in each genomic window
  normal_background:
    kind: input
    type: path
    required: true
    description: Panel of normals data, generated by calling ichorCNA on a set of normal samples with
      the same window size etc.
  centromere:
    kind: input
    type: path
    required: true
    description: Text file giving centromere locations of each genome, to exclude these windows
  rep_time_wig:
    kind: input
    type: path
    required: true
    description: Replication/timing .wig file.
  exons:
    kind: input
    type: path
    required: true
    description: BED file for exon regions to annotate CNA regions.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ichorcna.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  rdata:
    type: directory
    path: ${outdir}/ichorcna_run
    primary: true
