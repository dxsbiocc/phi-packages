# Agent-facing wrapper adapter for the vendored comebin/runcomebin module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
# Manually wired: exotic staging pattern.
id: nf-core/modules/comebin-runcomebin
name: comebin runcomebin
summary: Bin metagenomic contigs with COMEBIN using co-abundance across samples.
params:
  assembly:
    kind: input
    type: file
    required: true
    description: Assembly contigs FASTA (optionally gzipped).
  bams:
    kind: input
    type: path
    required: true
    description: Directory of per-sample sorted BAMs (*.bam).
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to comebin.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/comebin_runcomebin
    primary: true
