    kind: input
    type: path
    required: false
    description: Predicted proteins in prodigal fasta format (>scaffoldID_geneNo)
  db_directory:
    kind: input
    type: path
    required: true
    description: (optional) Directory of single copy gene database.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to dastool.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  log:
    type: directory
    path: ${outdir}/dastool_dastool
    primary: true
