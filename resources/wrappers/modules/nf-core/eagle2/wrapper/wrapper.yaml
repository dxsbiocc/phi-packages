# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/eagle2
name: eagle2
summary: Perform phasing of genotyped data with or without a reference panel
params:
  input:
    kind: input
    type: path
    required: true
    description: Vcf file containing genotyped cohort or target samples to phase
  index:
    kind: input
    type: path
    required: false
    description: Input file index
  ref_vcf:
    kind: input
    type: path
    required: false
    description: Reference panel to phase the genotyped cohort
  ref_index:
    kind: input
    type: path
    required: false
    description: Reference panel index
  map:
    kind: input
    type: path
    required: false
    description: Genetic map file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to eagle2.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  phased_variants:
    type: directory
    path: ${outdir}/eagle2
    primary: true
