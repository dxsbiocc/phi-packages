# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics
id: nf-core/modules/oatk
name: oatk
summary: An nf-core module for the OATK
params:
  reads:
    kind: input
    type: path
    required: true
    description: HiFi reads in FASTA format
  mito_hmm_files:
    kind: input
    type: path
    required: true
    description: HMM profile for mitochondrial gene annotation, with corresponding .h3i, h3f, .h3p, .h3m
      files from hmmpress
  pltd_hmm_files:
    kind: input
    type: path
    required: true
    description: HMM profile for plastid gene annotation, with corresponding .h3i, h3f, .h3p, .h3m files
      from hmmpress
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to oatk.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  mito_fasta:
    type: directory
    path: ${outdir}/oatk
    primary: true
