# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/easypqp-convert
name: easypqp convert
summary: Convert peptide identifications (pepXML or idXML) and the matching spectra (mzML, mzXML or MGF)
  into EasyPQP PSM and peak pickle files for spectral library generation.
params:
  id_file:
    kind: input
    type: path
    required: true
    description: Peptide identifications for one MS run.
  spectra:
    kind: input
    type: path
    required: false
    description: Spectra of the same MS run in mzML, mzXML or MGF (timsTOF) format.
  unimod:
    kind: input
    type: path
    required: true
    description: Optional UniMod XML file used to annotate modifications.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to easypqp.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  psmpkl:
    type: directory
    path: ${outdir}/easypqp_convert
    primary: true
