id: nf-core/modules/easypqp-library
name: easypqp library
summary: Generate a spectral library (TSV) from EasyPQP PSM and peak pickle files.
params:
  psmpkl:
    kind: input
    type: path
    required: true
    description: One or more PSM pickle files produced by easypqp convert
  peakpkl:
    kind: input
    type: path
    required: false
    description: One or more peak pickle files produced by easypqp convert, matching the PSM pickle files
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to easypqp.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  tsv:
    type: directory
    path: ${outdir}/easypqp_library
    primary: true
