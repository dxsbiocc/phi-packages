# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: mates paired per sample from a single fastq glob (fromFilePairs) and split into the module's path(fastq1)/path(fastq2).
id: nf-core/modules/spring-compress
name: spring compress
summary: Fast, efficient, lossless compression of FASTQ files.
params:
  fastq1:
    kind: input
    type: fastq_glob
    required: true
    description: Glob matching both mates. Mates are paired per sample by file name and split into
      the module's fastq1/fastq2 inputs; single files run single-end.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to spring.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  spring:
    type: directory
    path: ${outdir}/spring_compress
    primary: true
