# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'bai' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/debreak
name: debreak
summary: Structural variant calling from long-read sequencing data using DeBreak
params:
  bam:
    kind: input
    type: path
    required: true
    description: Sorted BAM file
  bai:
    kind: input
    type: path
    required: false
    description: BAM index file
  fasta:
    kind: input
    type: path
    required: true
    description: Reference genome FASTA file.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to debreak.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/debreak
    primary: true
