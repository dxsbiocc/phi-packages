# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: glob input 'xenium_bundle' collected into one staged list; verify staging layout
id: nf-core/modules/xeniumranger-importsegmentation
name: xeniumranger importsegmentation
summary: The xeniumranger importsegmentation module runs `xeniumranger import-segmentation` to recompute
  Xenium Onboard Analysis outputs using external segmentation results.
params:
  xenium_bundle:
    kind: input
    type: path
    required: true
    description: Path to the Xenium output bundle generated by the Xenium Onboard Analysis pipeline
  transcript_assignment:
    kind: input
    type: path
    required: false
    description: Transcript assignment CSV with cell assignment, such as from Baysor v0.6, (transcript-based
      mode).
  viz_polygons:
    kind: input
    type: path
    required: false
    description: Cell boundary polygons (GeoJSON) for visualization, such as from Baysor v0.6 (transcript-based
      mode).
  nuclei:
    kind: input
    type: path
    required: false
    description: Nucleus segmentation input as label mask (TIFF/NPY), polygons (GeoJSON), or Xenium Onboard
      Analysis cells.zarr.zip (image-based mode).
  cells:
    kind: input
    type: path
    required: false
    description: Cell segmentation input as label mask (TIFF/NPY), polygons (GeoJSON), or Xenium Onboard
      Analysis cells.zarr.zip (image-based mode).
  coordinate_transform:
    kind: input
    type: path
    required: false
    description: Image alignment file containing similarity transform matrix (e.g., `_imagealignment.csv`
      from Xenium Explorer).
  units:
    kind: option
    type: string
    required: false
    description: Units for segmentation results.
  expansion_distance:
    kind: option
    type: integer
    required: false
    description: Distance (in microns) to expand nuclei outward into cell boundaries.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to xeniumranger.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  outs:
    type: directory
    path: ${outdir}/xeniumranger_importsegmentation
    primary: true
