# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics; companion input 'bai' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/kled
name: kled
summary: An ultra-fast and sensitive structural variant detection tool for long-read sequencing data.
params:
  bam:
    kind: input
    type: path
    required: true
    description: Sorted BAM file
  bai:
    kind: input
    type: path
    required: false
    description: Sorted BAM index file
  fasta:
    kind: input
    type: path
    required: true
    description: Reference database in FASTA format
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to kled.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/kled
    primary: true
