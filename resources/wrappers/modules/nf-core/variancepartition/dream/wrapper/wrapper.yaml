# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/variancepartition-dream
name: variancepartition dream
summary: Runs a differential expression analysis with dream() from variancePartition R package
params:
  contrast_variable:
    kind: option
    type: string
    required: true
    description: The column in the sample sheet that should be used to define groups for comparison
  reference:
    kind: option
    type: string
    required: true
    description: The value within the contrast_variable column of the sample sheet that should be used
      to derive the reference samples
  target:
    kind: option
    type: string
    required: true
    description: The value within the contrast_variable column of the sample sheet that should be used
      to derive the target samples
  formula:
    kind: option
    type: string
    required: true
    description: (Optional) R formula string used for modeling, e.g.
  comparison:
    kind: option
    type: string
    required: true
    description: (Optional) Literal string passed to `limma::makeContrasts`, e.g.
  samplesheet:
    kind: input
    type: path
    required: true
    description: Sample sheet file containing sample metadata.
  counts:
    kind: input
    type: path
    required: false
    description: TSV or CSV format expression matrix with genes as rows and samples as columns.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  results:
    type: directory
    path: ${outdir}/variancepartition_dream
    primary: true
