# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: verified single-invocation wiring (single-valued reference params; call arity matches module inputs).
id: nf-core/modules/fastplong
name: fastplong
summary: Perform adapter/quality trimming and QC on long sequencing reads (ONT, PacBio, etc.)
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: Input FASTQ file.
  adapter_fasta:
    kind: input
    type: path
    required: false
    description: Optional FASTA file containing adapter sequences to trim.
  discard_trimmed_pass:
    kind: option
    type: boolean
    required: false
    description: If true, no reads that pass trimming thresholds will be written.
  save_trimmed_fail:
    kind: option
    type: boolean
    required: false
    description: If true, reads that fail filtering will be saved to a file ending in `*.fail.fastq.gz`.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fastplong.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  reads:
    type: directory
    path: ${outdir}/fastplong
    primary: true
