# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 's' combined cartesian-style; verify if per-sample pairing is required; standalone path 'db' treated as single reference (.first()); verify if a list/collection is expected
id: nf-core/modules/gunc-run
name: gunc run
summary: Detection of Chimerism and Contamination in Prokaryotic Genomes
params:
  fasta_files:
    kind: input
    type: path
    required: true
    description: A list of FASTA files containing contig (bins)
  s:
    kind: input
    type: path
    required: false
    description: Optional companion input s.
  db:
    kind: input
    type: path
    required: false
    description: GUNC database file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gunc.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  maxcss_level_tsv:
    type: directory
    path: ${outdir}/gunc_run
    primary: true
