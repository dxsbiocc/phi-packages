# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'tbi' combined cartesian-style; verify if per-sample pairing is required; companion input 'coverage' combined cartesian-style; verify if per-sample pairing is required; companion input 'control_stats' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/pypgx-runngspipeline
name: pypgx runngspipeline
summary: PyPGx pharmacogenomics genotyping pipeline for NGS data.
params:
  vcf:
    kind: input
    type: path
    required: true
    description: BGZIP compressed VCF file with SNVs/indels.
  tbi:
    kind: input
    type: path
    required: false
    description: VCF tabix index.
  coverage:
    kind: input
    type: path
    required: false
    description: ZIP compressed file with depth of coverage information.
  control_stats:
    kind: input
    type: path
    required: false
    description: ZIP compressed file with control statistics.
  pgx_gene:
    kind: option
    type: string
    required: true
    description: Pharmacogene to genotype/phenotype.
  resource_bundle:
    kind: input
    type: path
    required: true
    description: Path to the pypgx resource bundle (https://github.com/sbslee/pypgx-bundle).
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to pypgx.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  results:
    type: directory
    path: ${outdir}/pypgx_runngspipeline
    primary: true
