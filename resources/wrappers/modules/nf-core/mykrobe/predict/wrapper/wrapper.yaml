# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) genuinely required (no safe default); caller must supply.
id: nf-core/modules/mykrobe-predict
name: mykrobe predict
summary: AMR predictions for supported species
params:
  seqs:
    kind: input
    type: fastq_glob
    required: true
    description: BAM or FASTQ file
  species:
    kind: option
    type: string
    required: true
    description: Species to make AMR prediction against
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to mykrobe.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  csv:
    type: directory
    path: ${outdir}/mykrobe_predict
    primary: true
