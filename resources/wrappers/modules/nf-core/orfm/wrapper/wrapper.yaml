# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) are module-defaulted when unset (not required).
id: nf-core/modules/orfm
name: orfm
summary: A simple and not slow open reading frame (ORF) caller.
params:
  sequence:
    kind: input
    type: fastq_glob
    required: true
    description: nucleic_acid_sequence file
  min_len:
    kind: option
    type: string
    required: false
    description: The minimum length of the ORF to be reported (default - 96).
  codon_table_id:
    kind: option
    type: string
    required: false
    description: The codon table to use for translation (default - 1), Codon table should be a valid integer.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to orfm.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  fasta:
    type: directory
    path: ${outdir}/orfm
    primary: true
