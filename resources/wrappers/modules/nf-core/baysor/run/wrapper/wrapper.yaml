# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'prior_segmentation' combined cartesian-style; verify if per-sample pairing is required; companion input 'config' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/baysor-run
name: baysor run
summary: Bayesian segmentation of spatial transcriptomics data.
params:
  transcripts:
    kind: input
    type: path
    required: true
    description: CSV file
  prior_segmentation:
    kind: input
    type: path
    required: false
    description: CSV file with segmentation mask (optional)
  config:
    kind: input
    type: path
    required: false
    description: TOML file with config arguments
  scale:
    kind: option
    type: number
    required: false
    description: Scale factor for the segmentation
  prior_confidence:
    kind: option
    type: number
    required: false
    description: Confidence of the prior segmentation (optional)
  prior_column:
    kind: option
    type: string
    required: false
    description: Column name in the prior segmentation file that contains the segmentation mask (optional)
  polygon_format:
    kind: option
    type: string
    required: false
    description: 'Format for output segmentation polygons (default: FeatureCollection)'
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to baysor.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  segmentation:
    type: directory
    path: ${outdir}/baysor_run
    primary: true
