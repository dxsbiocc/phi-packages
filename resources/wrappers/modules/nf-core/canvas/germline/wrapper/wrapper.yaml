id: nf-core/modules/canvas-germline
name: canvas germline
summary: Calls germline copy number variants (CNVs) from whole genome sequencing data using Illumina Canvas
  in SmallPedigree-WGS mode.
params:
  bam:
    kind: input
    type: path
    required: true
    description: Sorted BAM file of aligned WGS reads.
  bai:
    kind: input
    type: path
    required: false
    description: BAM index file.
  germline_snv_vcf:
    kind: input
    type: path
    required: true
    description: VCF (or gzipped VCF) containing germline SNV b-allele sites (PASS filter only).
  male_ploidy_vcf:
    kind: input
    type: path
    required: true
    description: VCF defining expected ploidy for sex chromosomes in male samples.
  female_ploidy_vcf:
    kind: input
    type: path
    required: false
    description: VCF defining expected ploidy for sex chromosomes in female samples.
  sex:
    kind: option
    type: string
    required: true
    description: Sample sex.
  genomedir:
    kind: input
    type: path
    required: false
    description: Canvas genome reference directory containing genome.fa and GenomeSize.xml.
  reference:
    kind: input
    type: path
    required: false
    description: Canvas-ready kmer reference file (kmer.fa).
  filter13:
    kind: input
    type: path
    required: true
    description: BED file of regions to exclude from CNV calling (e.g.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
