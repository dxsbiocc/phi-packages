id: nf-core/modules/peddy
name: peddy
summary: Manipulation, validation and exploration of pedigrees
params:
  vcf:
    kind: input
    type: path
    required: true
    description: VCF file
  vcf_tbi:
    kind: input
    type: path
    required: false
    description: TBI file
  ped:
    kind: input
    type: path
    required: true
    description: PED/FAM file
  sites:
    kind: input
    type: path
    required: true
    description: sites file.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to peddy.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vs_html:
    type: directory
    path: ${outdir}/peddy
    primary: true
