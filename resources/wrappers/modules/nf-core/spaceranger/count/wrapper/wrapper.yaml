id: nf-core/modules/spaceranger-count
name: spaceranger count
summary: Module to use the 10x Space Ranger pipeline to process 10x spatial transcriptomics data
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: List of input FastQ files of size 1 and 2 for single-end and paired-end data, respectively.
  image:
    kind: input
    type: path
    required: false
    description: Brightfield tissue H&E image in JPEG or TIFF format.
  cytaimage:
    kind: input
    type: path
    required: false
    description: CytAssist instrument captured eosin stained Brightfield tissue image with fiducial frame
      in TIFF format.
  darkimage:
    kind: input
    type: path
    required: false
    description: Optional for dark background fluorescence microscope image input.
  colorizedimage:
    kind: input
    type: path
    required: false
    description: Required for color composite fluorescence microscope image input.
  alignment:
    kind: input
    type: path
    required: false
    description: OPTIONAL - Path to manual image alignment.
  slidefile:
    kind: input
    type: path
    required: false
    description: OPTIONAL - Path to slide specifications.
  slide:
    kind: option
    type: string
    required: true
    description: Visium slide ID used for the sample.
  area:
    kind: option
    type: string
    required: true
    description: Visium slide capture area used for the sample.
  reference:
    kind: input
    type: path
    required: false
    description: Folder containing all the reference indices needed by Space Ranger
  probeset:
    kind: input
    type: path
    required: true
    description: OPTIONAL - Probe set specification.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to spaceranger.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  outs:
    type: directory
    path: ${outdir}/spaceranger_count
    primary: true
