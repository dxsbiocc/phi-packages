# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/svtyper-svtypersso
name: svtyper svtypersso
summary: SVTyper-sso computes structural variant (SV) genotypes based on breakpoint depth on a SINGLE
  sample
params:
  bam:
    kind: input
    type: path
    required: true
    description: BAM or CRAM file with alignments
  bam_index:
    kind: input
    type: path
    required: false
    description: BAI file matching the BAM file
  vcf:
    kind: input
    type: path
    required: false
    description: Matching VCF of alignments
  fasta:
    kind: input
    type: path
    required: true
    description: indexed reference FASTA file (recommended for reading CRAM files)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to svtyper.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  gt_vcf:
    type: directory
    path: ${outdir}/svtyper_svtypersso
    primary: true
