# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/methylsieve
name: methylsieve
summary: Filter/tag unconverted reads in methylation sequencing with methylsieve; for maximum throughput
  it can also run inline in the alignment pipe (aligner | methylsieve | sort) rather than as a standalone
  step
params:
  bam:
    kind: input
    type: path
    required: true
    description: Aligned SAM/BAM from a methylation aligner, in aligner (query-grouped) order.
  fasta:
    kind: input
    type: path
    required: true
    description: Reference genome FASTA file
  fai:
    kind: input
    type: path
    required: false
    description: Reference genome FASTA index (.fai)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to methylsieve.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bam:
    type: directory
    path: ${outdir}/methylsieve
    primary: true
