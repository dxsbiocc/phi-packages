    kind: input
    type: path
    required: true
    description: Tumour BAM/CRAM file
  tumour_index:
    kind: input
    type: path
    required: false
    description: Tumour BAM/CRAM index
  normal:
    kind: input
    type: path
    required: false
    description: Normal BAM/CRAM file
  normal_index:
    kind: input
    type: path
    required: false
    description: Normal BAM/CRAM index
  ref:
    kind: input
    type: path
    required: true
    description: Reference genome FASTA file used to align tumor and normal BAM/CRAM files
  ref_index:
    kind: input
    type: path
    required: false
    description: Reference FASTA index
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to savana.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  sv_breakpoints_vcf:
    type: directory
    path: ${outdir}/savana_run
    primary: true
