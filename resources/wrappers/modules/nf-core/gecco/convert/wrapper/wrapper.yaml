id: nf-core/modules/gecco-convert
name: gecco convert
summary: This command helps transforming the output files created by GECCO into helpful format, should
  you want to use the results in combination with other tools.
params:
  clusters:
    kind: input
    type: path
    required: true
    description: TSV file containing coordinates of gecco predicted clusters and BGC types.
  gbk:
    kind: input
    type: path
    required: false
    description: Per cluster GenBank file containing sequence with annotations
  mode:
    kind: option
    type: string
    required: true
    description: Either clusters or gbk folder output, depending on what is reformatted
  format:
    kind: option
    type: string
    required: true
    description: Format for the output file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gecco.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  gff:
    type: directory
    path: ${outdir}/gecco_convert
    primary: true
