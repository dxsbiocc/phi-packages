# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics; companion input 'bams' combined cartesian-style; verify if per-sample pairing is required; companion input 'bais' combined cartesian-style; verify if per-sample pairing is required; companion input 'sample_dists' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/jasminesv
name: jasminesv
summary: Jointly Accurate Sv Merging with Intersample Network Edges
params:
  vcfs:
    kind: input
    type: path
    required: true
    description: The VCF files that need to be merged
  bams:
    kind: input
    type: path
    required: false
    description: Optional - The BAM files from which the VCFs were created
  bais:
    kind: input
    type: path
    required: false
    description: Optional - The BAM index files from which the VCFs were created
  sample_dists:
    kind: input
    type: path
    required: false
    description: Optional - A txt file containing the distance thresholds for each sample
  fasta:
    kind: input
    type: path
    required: true
    description: Optional - The reference FASTA file used to create the VCFs
  fasta_fai:
    kind: input
    type: path
    required: true
    description: Optional - The index of the reference FASTA file used to create the VCFs
  chr_norm:
    kind: input
    type: path
    required: true
    description: Optional - A txt file containing the chromosomes and their aliases for normalization
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to jasminesv.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/jasminesv
    primary: true
