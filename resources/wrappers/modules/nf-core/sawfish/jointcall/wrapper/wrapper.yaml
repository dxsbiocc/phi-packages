# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'bais' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/sawfish-jointcall
name: sawfish jointcall
summary: Joint calling of structural variants from multiple samples using Sawfish
params:
  sample_dirs:
    kind: input
    type: path
    required: true
    description: Sample directories from sawfish discover step
  fasta:
    kind: input
    type: path
    required: true
    description: Reference genome in FASTA format
  bams:
    kind: input
    type: path
    required: true
    description: Sorted BAM/CRAM file
  bais:
    kind: input
    type: path
    required: false
    description: Index of BAM/CAM file
  sample_csv:
    kind: input
    type: path
    required: true
    description: CSV file listing sample sawfish discover output and the sample bam file used with sawfish
      discover
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to sawfish.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/sawfish_jointcall
    primary: true
