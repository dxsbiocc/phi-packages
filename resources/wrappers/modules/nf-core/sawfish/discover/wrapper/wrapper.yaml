# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics; companion input 'bai' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/sawfish-discover
name: sawfish discover
summary: SV candidate discovery from PacBio HiFi data
params:
  bam:
    kind: input
    type: path
    required: true
    description: Sorted BAM/CRAM file
  bai:
    kind: input
    type: path
    required: false
    description: Index of BAM/CAM file
  fasta:
    kind: input
    type: path
    required: true
    description: Reference genome in FASTA format
  expected_cn_bed:
    kind: input
    type: path
    required: true
    description: Expected copy number BED file
  maf_vcf:
    kind: input
    type: path
    required: true
    description: Variant file used to generate minor allele frequency track for this sample, in VCF or
      BCF format.
  cnv_exclude_regions_bed:
    kind: input
    type: path
    required: true
    description: BED file containing regions to exclude from CNV calling
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to sawfish.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  assembly_regions:
    type: directory
    path: ${outdir}/sawfish_discover
    primary: true
