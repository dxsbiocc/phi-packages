    kind: input
    type: fastq_glob
    required: true
    description: List of input paired-end FastQ files (R1 and R2).
  merged:
    kind: input
    type: path
    required: false
    description: Optional merged/overlapping paired-end reads or supplementary single-end reads.
  kmersize:
    kind: option
    type: integer
    required: true
    description: K-mer size for assembly.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to abyss.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  contigs:
    type: directory
    path: ${outdir}/abyss_abysspe
    primary: true
