# Agent-facing wrapper adapter for the vendored fqtk module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
# Manually wired: exotic staging pattern.
id: nf-core/modules/fqtk
name: fqtk demux
summary: Demultiplex paired FASTQs with fqtk using a sample sheet and per-file read structures.
params:
  sample_sheet:
    kind: input
    type: file
    required: true
    description: Sample metadata TSV for fqtk.
  fastq_folder:
    kind: input
    type: path
    required: true
    description: Directory holding the FASTQ files named in fastq_names.
  fastq_names:
    kind: option
    type: string
    required: false
    description: Comma-separated FASTQ file names (basenames inside fastq_folder).
  read_structures:
    kind: option
    type: string
    required: false
    description: Comma-separated read structures matching fastq_names, e.g. 8B,8B,150T,150T.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fqtk.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/fqtk
    primary: true
