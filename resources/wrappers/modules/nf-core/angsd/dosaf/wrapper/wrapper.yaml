# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics; companion input 'bam_indices' combined cartesian-style; verify if per-sample pairing is required; tuple has no leading val(meta); sample meta synthesized from file name; companion input 'reference_fai' combined cartesian-style; verify if per-sample pairing is required; tuple has no leading val(meta); sample meta synthesized from file name; companion input 'ancestral_fai' combined cartesian-style; verify if per-sample pairing is required; val input 'gl_model' exposed as required option; confirm whether a safe default exists; val input 'dosaf_mode' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/angsd-dosaf
name: angsd dosaf
summary: Estimate site allele frequencies from BAM files.
params:
  bams:
    kind: input
    type: path
    required: true
    description: A list of BAM or CRAM files.
  bam_indices:
    kind: input
    type: path
    required: false
    description: A list of BAM or CRAM indices.
  reference_fasta:
    kind: input
    type: path
    required: true
    description: A reference genome in FASTA format.
  reference_fai:
    kind: input
    type: path
    required: false
    description: Index of the reference genome FASTA file.
  ancestral_fasta:
    kind: input
    type: path
    required: true
    description: An ancestral state genome in FASTA format.
  ancestral_fai:
    kind: input
    type: path
    required: false
    description: Index of the ancestral state genome FASTA file.
  error_file:
    kind: input
    type: path
    required: true
    description: A file containing per-base substitution error rates for use with the Sykes genotype likelihood
      model (-GL 4).
  inbreeding_coefficients:
    kind: input
    type: path
    required: true
    description: A file containing estimates of individual inbreeding coefficients.
  soapsnp_calibration:
    kind: input
    type: path
    required: true
    description: Directory of soapSNP calibration files.
  gl_model:
    kind: option
    type: integer
    required: true
    description: Genotype likelihood model to use (angsd -GL).
  dosaf_mode:
    kind: option
    type: integer
    required: true
    description: Site allele frequency likelihood estimation mode (angsd -doSAF).
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to angsd.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  saf:
    type: directory
    path: ${outdir}/angsd_dosaf
    primary: true
