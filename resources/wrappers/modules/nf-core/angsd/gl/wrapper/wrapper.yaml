# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/angsd-gl
name: angsd gl
summary: Calculated genotype likelihoods from BAM files.
params:
  bam:
    kind: input
    type: path
    required: true
    description: A list of BAM or CRAM files
  bai:
    kind: input
    type: path
    required: false
    description: A list of BAM or CRAM indices
  fasta:
    kind: input
    type: path
    required: true
    description: A reference genome in FASTA format
  fai:
    kind: input
    type: path
    required: false
    description: Index of the reference genome FASTA file
  error_file:
    kind: input
    type: path
    required: true
    description: A file containing information about type specific errors.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to angsd.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  genotype_likelihood:
    type: directory
    path: ${outdir}/angsd_gl
    primary: true
