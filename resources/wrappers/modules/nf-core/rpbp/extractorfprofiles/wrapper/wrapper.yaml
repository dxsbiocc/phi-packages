id: nf-core/modules/rpbp-extractorfprofiles
name: rpbp extractorfprofiles
summary: Build a per-ORF P-site count vector for every candidate open reading frame (ORF) in the catalogue.
params:
  bam:
    kind: input
    type: path
    required: true
    description: Sorted Ribo-seq BAM.
  bai:
    kind: input
    type: path
    required: false
    description: BAM index.
  lengths_offsets:
    kind: input
    type: path
    required: false
    description: Per-read-length offsets TSV from `rpbp/getperiodiclengthsoffsets`.
  orfs_genomic_bed:
    kind: input
    type: path
    required: true
    description: Per-ORF genomic BED from `rpbp/preparegenome`.
  exons_bed:
    kind: input
    type: path
    required: true
    description: Per-ORF exons BED from `rpbp/preparegenome`.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to rpbp.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  profiles:
    type: directory
    path: ${outdir}/rpbp_extractorfprofiles
    primary: true
