# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/hasheddrops
name: hasheddrops
summary: Generating cell hashing calls from a matrix of count data.
params:
  hto_matrix:
    kind: input
    type: path
    required: true
    description: Directory that contains the HTO matrix in a 10X format.
  rna_matrix:
    kind: input
    type: path
    required: false
    description: Path to RNA count matrix, which is only uses if runEmptyDrops == "TRUE".
  run_empty_drops:
    kind: option
    type: boolean
    required: false
    description: Run EmptyDrops() before hashedDrops() ("TRUE") or not ("FALSE").
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  empty_drops_plot:
    type: directory
    path: ${outdir}/hasheddrops
    primary: true
