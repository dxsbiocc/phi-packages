id: nf-core/modules/quantmsutils-dianncfg
name: quantmsutils dianncfg
summary: Generate DIA-NN configuration arguments from enzyme and Unimod modification parameters.
params:
  enzyme:
    kind: option
    type: string
    required: true
    description: Enzyme name for protein digestion (e.g., 'Trypsin', 'Trypsin/P')
  fixed_modifications:
    kind: option
    type: string
    required: true
    description: Fixed modifications in Unimod format (e.g., 'Carbamidomethyl (C)')
  variable_modifications:
    kind: option
    type: string
    required: true
    description: Variable modifications in Unimod format (e.g., 'Oxidation (M)')
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to quantmsutils.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  diann_cfg:
    type: directory
    path: ${outdir}/quantmsutils_dianncfg
    primary: true
