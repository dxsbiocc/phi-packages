# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) are module-defaulted when unset (not required).
id: nf-core/modules/svdb-query
name: svdb query
summary: Query a structural variant database, using a vcf file as query
params:
  vcf:
    kind: input
    type: path
    required: true
    description: query vcf file
  in_occs:
    kind: option
    type: string
    required: false
    description: A list of allele count tags
  in_frqs:
    kind: option
    type: string
    required: false
    description: A list of allele frequency tags
  out_occs:
    kind: option
    type: string
    required: false
    description: A list of allele count tags
  out_frqs:
    kind: option
    type: string
    required: false
    description: A list of allele frequency tags
  vcf_dbs:
    kind: input
    type: path
    required: true
    description: path to a database vcf, or a comma separated list of vcfs
  bedpe_dbs:
    kind: input
    type: path
    required: true
    description: path to a SV database of the following format chrA-posA-chrB-posB-type-count-frequency,
      or a comma separated list of files
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to svdb.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/svdb_query
    primary: true
