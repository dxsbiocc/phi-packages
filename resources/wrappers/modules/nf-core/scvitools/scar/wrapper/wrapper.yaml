# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'unfiltered' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/scvitools-scar
name: scvitools scar
summary: Module to use scAR to remove ambient RNA from single-cell RNA-seq data
params:
  filtered:
    kind: input
    type: path
    required: true
    description: AnnData file containing filtered data (without empty droplets)
  unfiltered:
    kind: input
    type: path
    required: false
    description: AnnData file containing unfiltered data (with empty droplets)
  input_layer:
    kind: option
    type: string
    required: false
    description: Layer to use as input.
  output_layer:
    kind: option
    type: string
    required: false
    description: Layer to save the denoised counts to.
  max_epochs:
    kind: option
    type: integer
    required: false
    description: Maximum number of epochs to train the model.
  n_batch:
    kind: option
    type: integer
    required: false
    description: Number of batches to use for generating the ambient profile.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  h5ad:
    type: directory
    path: ${outdir}/scvitools_scar
    primary: true
