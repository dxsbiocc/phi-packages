# Agent-facing wrapper adapter for the vendored samplesheetparser/merge module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
# Manually wired: exotic staging pattern.
id: nf-core/modules/samplesheetparser-merge
name: samplesheetparser merge
summary: Merge multiple Illumina sample sheets into one.
params:
  samplesheets:
    kind: input
    type: path
    required: true
    description: Directory of sample sheet CSVs (*.csv).
  target_version:
    kind: option
    type: string
    required: false
    description: Sample sheet format version to emit.
    enum:
    - v1
    - v2
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to samplesheetparser.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/samplesheetparser_merge
    primary: true
