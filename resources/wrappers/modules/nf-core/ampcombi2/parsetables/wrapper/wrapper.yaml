# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) genuinely required (no safe default); caller must supply.
id: nf-core/modules/ampcombi2-parsetables
name: ampcombi2 parsetables
summary: A submodule that parses and standardizes the results from various antimicrobial peptide identification
  tools.
params:
  amp_input:
    kind: input
    type: path
    required: true
    description: The path to the directory containing the results for the AMP tools for each processed
      sample or a list of files corresponding to each file generated by AMP tools.
  faa_input:
    kind: input
    type: path
    required: true
    description: The path to the file corresponding to the respective protein fasta files with '.faa'
      extension.
  gbk_input:
    kind: input
    type: path
    required: true
    description: The path to the file corresponding to the respective annotated files with either '.gbk'
      or '.gbff' extensions.
  opt_amp_db:
    kind: option
    type: string
    required: true
    description: The name of the database to download and set up.
  opt_amp_db_dir:
    kind: input
    type: path
    required: true
    description: The path to the folder containing the fasta and tsv database files.
  opt_interproscan:
    kind: input
    type: path
    required: true
    description: A path to a file corresponding to the respective tsv files containing protein classifications
      of the annotated CDSs.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ampcombi2.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  sample_dir:
    type: directory
    path: ${outdir}/ampcombi2_parsetables
    primary: true
