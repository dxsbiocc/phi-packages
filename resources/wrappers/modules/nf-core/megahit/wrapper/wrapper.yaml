# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: mates paired per sample from a single reads glob (fromFilePairs) and split into the module's path(reads1)/path(reads2).
id: nf-core/modules/megahit
name: megahit
summary: An ultra-fast metagenomic assembler for large and complex metagenomics
params:
  reads1:
    kind: input
    type: fastq_glob
    required: true
    description: Glob matching all input FASTQ/FASTA reads (both R1 and R2). Mates are paired per
      sample by file name and split into the module's reads1/reads2 inputs; single files run single-end.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to megahit.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  contigs:
    type: directory
    path: ${outdir}/megahit
    primary: true
