# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/bamcmp
name: bamcmp
summary: Bamcmp (Bam Compare) is a tool for assigning reads between a primary genome and a contamination
  genome.
params:
  primary_aligned_bam:
    kind: input
    type: path
    required: true
    description: BAM/CRAM/SAM file with the reads aligned to the primary genome (the one you want to keep)
  contaminant_aligned_bam:
    kind: input
    type: path
    required: false
    description: BAM/CRAM/SAM file with the reads aligned to the contaminant genome (the one you want
      to filter out)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to bamcmp.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  primary_filtered_bam:
    type: directory
    path: ${outdir}/bamcmp
    primary: true
