id: nf-core/modules/ngsbits-bedcoverage
name: ngsbits bedcoverage
summary: Annotates a BED file with the average coverage of the regions from one or several BAM/CRAM file(s).
params:
  reads:
    kind: input
    type: path
    required: true
    description: Input BAM/CRAM/SAM file(s), can be one file or a list of files
  reads_index:
    kind: input
    type: path
    required: false
    description: The index file(s) from the input BAM/CRAM/SAM file(s)
  bed:
    kind: input
    type: path
    required: false
    description: Input BED file containing regions to annotate
  fasta:
    kind: input
    type: path
    required: true
    description: The reference FASTA to use (mandatory when CRAM files are used, otherwise optional)
  fai:
    kind: input
    type: path
    required: true
    description: The index file from the reference FASTA
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ngsbits.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bed:
    type: directory
    path: ${outdir}/ngsbits_bedcoverage
    primary: true
