# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'aligned_fa' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/snippy-core
name: snippy core
summary: Core-SNP alignment from Snippy outputs
params:
  vcf:
    kind: input
    type: path
    required: true
    description: Annotated variants in VCF format
  aligned_fa:
    kind: input
    type: path
    required: false
    description: A version of the reference but with - at position with depth=0 and N for 0 < depth <
      --mincov (does not have variants)
  reference:
    kind: input
    type: path
    required: false
    description: Reference genome in GenBank (preferred) or FASTA format
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to snippy.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  aln:
    type: directory
    path: ${outdir}/snippy_core
    primary: true
