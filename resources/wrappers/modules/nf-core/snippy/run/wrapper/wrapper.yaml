# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: standalone path 'reference' treated as single reference (.first()); verify if a list/collection is expected
id: nf-core/modules/snippy-run
name: snippy run
summary: Rapid haploid variant calling
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: List of input FastQ files of size 1 and 2 for single-end and paired-end data, respectively.
  reference:
    kind: input
    type: path
    required: false
    description: Reference genome in FASTA format
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to snippy.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  tab:
    type: directory
    path: ${outdir}/snippy_run
    primary: true
