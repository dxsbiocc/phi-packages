# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/gsea-gsea
name: gsea gsea
summary: run the Broad Gene Set Enrichment tool in GSEA mode
params:
  gct:
    kind: input
    type: path
    required: true
    description: GCT file with expression values
  cls:
    kind: input
    type: path
    required: false
    description: CL file with the classes of the samples in the GCT file
  gene_sets:
    kind: input
    type: path
    required: false
    description: GMX or GMT file with gene sets
  reference:
    kind: option
    type: string
    required: true
    description: String indicating which of the classes in the cls file should be used as the reference
      level of the comparison.
  target:
    kind: option
    type: string
    required: true
    description: String indicating which of the classes in the cls file should be used as the target level
      of the comparison.
  chip:
    kind: input
    type: path
    required: true
    description: optional Broad-style chip file mapping identifiers in gct to those in gene_sets
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gsea.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  rpt:
    type: directory
    path: ${outdir}/gsea_gsea
    primary: true
