id: nf-core/modules/expansionhunterdenovo-merge
name: expansionhunterdenovo merge
summary: Merge STR profiles into a multi-sample STR profile
params:
  manifest:
    kind: input
    type: path
    required: true
    description: A tab-delimited file containing the sample name, whether it's case or control and the
      paths to the corresponding STR profiles.
  fasta:
    kind: input
    type: path
    required: true
    description: The reference FASTA file
  fasta_fai:
    kind: input
    type: path
    required: false
    description: The index of the reference FASTA file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to expansionhunterdenovo.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  merged_profiles:
    type: directory
    path: ${outdir}/expansionhunterdenovo_merge
    primary: true
