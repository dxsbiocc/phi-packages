id: nf-core/modules/propr-propd
name: propr propd
summary: Perform differential proportionality analysis
params:
  contrast_variable:
    kind: option
    type: string
    required: true
    description: The column in the sample sheet that should be used to define groups for comparison
  reference:
    kind: option
    type: string
    required: true
    description: The value within the contrast_variable column of the sample sheet that should be used
      to derive the reference samples
  target:
    kind: option
    type: string
    required: true
    description: The value within the contrast_variable column of the sample sheet that should be used
      to derive the target samples
  samplesheet:
    kind: input
    type: path
    required: true
    description: CSV or TSV format sample sheet with sample metadata
  counts:
    kind: input
    type: path
    required: false
    description: Raw TSV or CSV format expression matrix as output from the nf-core RNA-seq workflow
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  results_genewise:
    type: directory
    path: ${outdir}/propr_propd
    primary: true
