# Agent-facing wrapper adapter for the vendored krona/ktimporttaxonomy module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
# Manually wired: exotic staging pattern.
id: nf-core/modules/krona-ktimporttaxonomy
name: krona ktimporttaxonomy
summary: Convert a Kraken report to a Krona HTML plot using a Krona taxonomy table.
params:
  report:
    kind: input
    type: file
    required: true
    description: Kraken/Kraken2 report file.
  taxonomy:
    kind: input
    type: file
    required: true
    description: Krona taxonomy.tab table.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to krona.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/krona_ktimporttaxonomy
    primary: true
