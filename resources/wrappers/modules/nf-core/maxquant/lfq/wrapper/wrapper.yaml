# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'paramfile' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/maxquant-lfq
name: maxquant lfq
summary: Run standard proteomics data analysis with MaxQuant, mostly dedicated to label-free.
params:
  fasta:
    kind: input
    type: path
    required: true
    description: fasta file with protein sequences
  paramfile:
    kind: input
    type: path
    required: false
    description: MaxQuant parameter file
  raw:
    kind: input
    type: path
    required: true
    description: raw files with mass spectra
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to maxquant.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  maxquant_txt:
    type: directory
    path: ${outdir}/maxquant_lfq
    primary: true
