# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'seqdb' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/hmmer-hmmsearch
name: hmmer hmmsearch
summary: search profile(s) against a sequence database
params:
  hmmfile:
    kind: input
    type: path
    required: true
    description: One or more HMM profiles created with hmmbuild
  seqdb:
    kind: input
    type: path
    required: false
    description: Database of sequences in FASTA format
  write_align:
    kind: option
    type: boolean
    required: false
    description: Flag to save optional alignment output.
  write_target:
    kind: option
    type: boolean
    required: false
    description: Flag to save optional per target summary.
  write_domain:
    kind: option
    type: boolean
    required: false
    description: Flag to save optional per domain summary.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to hmmer.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  output:
    type: directory
    path: ${outdir}/hmmer_hmmsearch
    primary: true
