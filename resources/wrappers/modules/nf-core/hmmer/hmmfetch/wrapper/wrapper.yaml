  keyfile:
    kind: input
    type: path
    required: true
    description: File containing list of HMM models to extract.
  index:
    kind: input
    type: path
    required: false
    description: Index file from another run.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to hmmer.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
