# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/hmmer-jackhmmer
name: hmmer jackhmmer
summary: iterative searches to detect distant homologs by refining an HMM profile from hits
params:
  fasta:
    kind: input
    type: path
    required: true
    description: One or multiple amino acid sequences from which to start building a model iteratively
      (one model per input sequence)
  seqdb:
    kind: input
    type: path
    required: false
    description: Database of sequences in FASTA format
  write_align:
    kind: option
    type: boolean
    required: false
    description: Flag to save optional alignment output.
  write_target:
    kind: option
    type: boolean
    required: false
    description: Flag to save optional per target summary.
  write_domain:
    kind: option
    type: boolean
    required: false
    description: Flag to save optional per domain summary.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to hmmer.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  output:
    type: directory
    path: ${outdir}/hmmer_jackhmmer
    primary: true
