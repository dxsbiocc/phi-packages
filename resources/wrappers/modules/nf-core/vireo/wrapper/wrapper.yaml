# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/vireo
name: vireo
summary: Use vireo to perform donor deconvolution for multiplexed scRNA-seq data
params:
  cell_data:
    kind: input
    type: path
    required: true
    description: The cell genotype file in VCF format or cellSNP folder with sparse matrices.
  donor_file:
    kind: input
    type: path
    required: false
    description: The optional donor genotype file in VCF format.
  vartrix_data:
    kind: input
    type: path
    required: false
    description: The optional cell genotype files in vartrix outputs.
  n_donor:
    kind: option
    type: integer
    required: true
    description: Number of donors to demultiplex.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to vireo.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  summary:
    type: directory
    path: ${outdir}/vireo
    primary: true
