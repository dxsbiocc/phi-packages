# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'bindirs' combined cartesian-style; verify if per-sample pairing is required; companion input 'contigs' combined cartesian-style; verify if per-sample pairing is required; companion input 'proteins' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/binette
name: binette
summary: A fast and accurate binning refinement tool to construct high quality MAGs from the output of
  multiple binning tools.
params:
  contig2bin:
    kind: input
    type: path
    required: true
    description: List of contig2bin files (headerless TSV with format contigname\tbinname)
  bindirs:
    kind: input
    type: path
    required: false
    description: List of directories containing bin fasta files.
  contigs:
    kind: input
    type: path
    required: false
    description: Fasta file containing contigs
  proteins:
    kind: input
    type: path
    required: false
    description: optional AA Fasta file containing contigs
  checkm2_db:
    kind: input
    type: path
    required: true
    description: CheckM2 DIAMOND database file.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to binette.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  final_bins:
    type: directory
    path: ${outdir}/binette
    primary: true
