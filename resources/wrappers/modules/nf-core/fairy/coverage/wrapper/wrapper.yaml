# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'contigs' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/fairy-coverage
name: fairy coverage
summary: Computes coverage depth statistics for assembled contigs from one or more fairy sketch files,
  producing a MetaBAT2-compatible TSV with per-contig mean depth and variance columns.
params:
  sketches:
    kind: input
    type: path
    required: true
    description: One or more fairy sketch files (.bcsp) produced by `fairy sketch`
  contigs:
    kind: input
    type: path
    required: false
    description: Assembled contigs in FASTA format
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fairy.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  coverage:
    type: directory
    path: ${outdir}/fairy_coverage
    primary: true
