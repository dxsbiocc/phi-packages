    kind: input
    type: fastq_glob
    required: true
    description: Fastq file(s) to deduplicate
  umi_file:
    kind: input
    type: path
    required: true
    description: UMI file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to humid.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
