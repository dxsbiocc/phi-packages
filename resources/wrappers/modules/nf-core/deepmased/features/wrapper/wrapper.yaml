id: nf-core/modules/deepmased-features
name: deepmased features
summary: 'DeepMAsED features subcommand: extracts alignment-based features from BAM and assembly FASTA
  for each contig, producing feature tables used as input for DeepMAsED predict.'
params:
  bam:
    kind: input
    type: path
    required: true
    description: Sorted BAM file of reads mapped to the assembly
  bai:
    kind: input
    type: path
    required: false
    description: BAM index file
  fasta:
    kind: input
    type: path
    required: false
    description: Assembly in FASTA format
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to deepmased.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  feature_table:
    type: directory
    path: ${outdir}/deepmased_features
    primary: true
