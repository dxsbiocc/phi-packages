id: nf-core/modules/kmcp-index
name: kmcp index
summary: Construct KMCP database from k-mer files
params:
  compute_dir:
    kind: input
    type: path
    required: true
    description: Output directory generated by "kmcp compute"
  taxdmp:
    kind: input
    type: path
    required: true
    description: List or directory containing NCBI-like taxdmp files (nodes.dmp, names.dmp, and optionally,
      merged.dmp, delnodes.dmp)
  seq2taxidmap:
    kind: input
    type: path
    required: true
    description: 'Kraken2 style sequence to taxid mapping file, with two columns: sequence ID and taxid
      (e.g.'
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to kmcp.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  kmcp:
    type: directory
    path: ${outdir}/kmcp_index
    primary: true
