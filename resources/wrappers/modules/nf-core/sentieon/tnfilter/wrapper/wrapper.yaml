id: nf-core/modules/sentieon-tnfilter
name: sentieon tnfilter
summary: Filters the raw output of sentieon/tnhaplotyper2.
params:
  vcf:
    kind: input
    type: path
    required: true
    description: compressed vcf file from tnhaplotyper2
  vcf_tbi:
    kind: input
    type: path
    required: false
    description: Tabix index of vcf file
  stats:
    kind: input
    type: path
    required: false
    description: Stats file that pairs with output vcf file
  contamination:
    kind: input
    type: path
    required: false
    description: the location and file name of the file containing the contamination information produced
      by ContaminationModel.
  segments:
    kind: input
    type: path
    required: false
    description: the location and file name of the file containing the tumor segments information produced
      by ContaminationModel.
  orientation_priors:
    kind: input
    type: path
    required: false
    description: the location and file name of the file containing the orientation bias information produced
      by OrientationBias.
  fasta:
    kind: input
    type: path
    required: true
    description: The reference fasta file
  fai:
    kind: input
    type: path
    required: true
    description: Index of reference fasta file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to sentieon.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
