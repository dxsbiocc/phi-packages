    kind: input
    type: path
    required: true
    description: Sorted BAM/CRAM/SAM file
  bai:
    kind: input
    type: path
    required: false
    description: Index of th sorted BAM/CRAM/SAM file
  fasta:
    kind: input
    type: path
    required: true
    description: Genome fasta file
  fai:
    kind: input
    type: path
    required: true
    description: Index of the genome fasta file
  intervals_list:
    kind: input
    type: path
    required: true
    description: intervals
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to sentieon.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  wgs_metrics:
    type: directory
    path: ${outdir}/sentieon_wgsmetrics
    primary: true
