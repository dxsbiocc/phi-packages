    kind: input
    type: path
    required: true
    description: BED, narrowPeak or broadPeak files of replicates
  peak_type:
    kind: option
    type: string
    required: true
    description: Type of peak file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to idr.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  idr:
    type: directory
    path: ${outdir}/idr
    primary: true
