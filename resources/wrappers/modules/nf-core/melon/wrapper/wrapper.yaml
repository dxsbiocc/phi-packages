# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: standalone path 'database' treated as single reference (.first()); verify if a list/collection is expected; standalone path 'k2_db' treated as single reference (.first()); verify if a list/collection is expected
id: nf-core/modules/melon
name: melon
summary: Performs taxonomic profiling of long metagenomic reads against the melon database
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: Quality-controlled long reads.
  database:
    kind: input
    type: path
    required: false
    description: Melon database.
  k2_db:
    kind: input
    type: path
    required: false
    description: Kraken2 database for pre-filtering of non-prokaryotic reads (needs to include at least
      human and fungi).
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to melon.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  tsv_output:
    type: directory
    path: ${outdir}/melon
    primary: true
