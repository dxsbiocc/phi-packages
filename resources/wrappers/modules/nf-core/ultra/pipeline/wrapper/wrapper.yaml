id: nf-core/modules/ultra-pipeline
name: ultra pipeline
summary: uLTRA aligner - A wrapper around minimap2 to improve small exon detection
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: A fasta or fastq file of reads to align
  fasta:
    kind: input
    type: path
    required: true
    description: fasta file of reference genome
  gtf:
    kind: input
    type: path
    required: true
    description: Genome annotation file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ultra.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  sam:
    type: directory
    path: ${outdir}/ultra_pipeline
    primary: true
