# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/ultra-align
name: ultra align
summary: uLTRA aligner - A wrapper around minimap2 to improve small exon detection - Map reads on genome
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: A fasta or fastq file of reads to align
  genome:
    kind: input
    type: path
    required: true
    description: A fasta file of reference genome
  pickle:
    kind: input
    type: path
    required: true
    description: Pickle files generated by uLTRA index
  db:
    kind: input
    type: path
    required: false
    description: Database generated by uLTRA index
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ultra.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bam:
    type: directory
    path: ${outdir}/ultra_align
    primary: true
