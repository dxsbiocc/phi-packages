id: nf-core/modules/bedgovcf
name: bedgovcf
summary: Convert a BED file to a VCF file according to a YAML config
params:
  bed:
    kind: input
    type: path
    required: true
    description: The BED file to convert to VCF
  config:
    kind: input
    type: path
    required: false
    description: The config file to use for the conversion
  fai:
    kind: input
    type: path
    required: true
    description: The fasta index file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to bedgovcf.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/bedgovcf
    primary: true
