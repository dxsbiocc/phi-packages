# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/checkm-qa
name: checkm qa
summary: CheckM provides a set of tools for assessing the quality of genomes recovered from isolates,
  single cells, or metagenomes.
params:
  analysis_dir:
    kind: input
    type: path
    required: true
    description: Directory containing output of checkm/analyze or checkm/lineage_wf etc.
  marker_file:
    kind: input
    type: path
    required: false
    description: Marker file specified during checkm/analyze or produced by checkm/{lineage,taxonomy}_wf
  coverage_file:
    kind: input
    type: path
    required: false
    description: File containing coverage of each sequence (generated by checkm coverage)
  exclude_marker_file:
    kind: input
    type: path
    required: true
    description: File specifying markers to exclude from marker sets
  db:
    kind: input
    type: path
    required: false
    description: CheckM database directory
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to checkm.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  output:
    type: directory
    path: ${outdir}/checkm_qa
    primary: true
