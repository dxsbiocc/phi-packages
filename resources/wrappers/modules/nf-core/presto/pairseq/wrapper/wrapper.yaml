id: nf-core/modules/presto-pairseq
name: presto pairseq
summary: Sorts and matches sequence records with matching coordinates across files
params:
  r1_read:
    kind: input
    type: fastq_glob
    required: true
    description: Glob matching both R1 and R2 reads. Mates are paired per sample by file name and
      split into the module's R1_read/R2_read inputs.
  barcode_position:
    kind: option
    type: string
    required: true
    description: Barcode position.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to presto.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  reads:
    type: directory
    path: ${outdir}/presto_pairseq
    primary: true
