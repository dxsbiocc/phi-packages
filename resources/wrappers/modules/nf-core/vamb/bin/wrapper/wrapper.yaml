# Agent-facing wrapper adapter for the vendored vamb/bin module at
# ../main.nf. Follows the minimal contract in
# docs/design/phi-wrapper-agent-composition-design.md section 3.
# Manually wired: exotic staging pattern.
id: nf-core/modules/vamb-bin
name: vamb bin
summary: Bin metagenomic contigs with VAMB using co-abundance BAMs.
params:
  assembly:
    kind: input
    type: file
    required: true
    description: Assembly contigs FASTA (optionally gzipped).
  abundance_tsv:
    kind: input
    type: file
    required: false
    description: Optional precomputed abundance TSV (instead of BAMs).
  bams:
    kind: input
    type: path
    required: false
    description: Directory of per-sample sorted BAMs (*.bam).
  taxonomy:
    kind: input
    type: file
    required: false
    description: Optional taxonomy file for taxonomic binning.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to vamb.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/vamb_bin
    primary: true
