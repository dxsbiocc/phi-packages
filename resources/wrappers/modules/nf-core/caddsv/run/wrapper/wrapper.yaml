# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
id: nf-core/modules/caddsv-run
name: caddsv run
summary: Score structural variants with CADD-SV.
params:
  variants:
    kind: input
    type: path
    required: true
    description: BED file for coordinate-based CADD-SV scoring, or TSV file for sequence-only scoring
      with `--seqonly`.
  annotations_dir:
    kind: input
    type: path
    required: true
    description: Directory containing CADD-SV annotation resources.
  config:
    kind: input
    type: path
    required: true
    description: Optional YAML configuration file for CADD-SV scoring.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to caddsv.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  tsv:
    type: directory
    path: ${outdir}/caddsv_run
    primary: true
