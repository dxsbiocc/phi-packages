id: nf-core/modules/ltrretriever-lai
name: ltrretriever lai
summary: Estimates the mean LTR sequence identity in the genome.
params:
  fasta:
    kind: input
    type: path
    required: true
    description: The genome file that is used to generate everything
  pass_list:
    kind: input
    type: path
    required: true
    description: A list of intact LTR-RTs generated by LTR_retriever
  annotation_out:
    kind: input
    type: path
    required: true
    description: RepeatMasker annotation of all LTR sequences in the genome
  monoploid_seqs:
    kind: input
    type: path
    required: true
    description: This parameter is mainly for ployploid genomes.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ltrretriever.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  log:
    type: directory
    path: ${outdir}/ltrretriever_lai
    primary: true
