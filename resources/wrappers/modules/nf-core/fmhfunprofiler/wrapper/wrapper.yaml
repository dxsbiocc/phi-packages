# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) genuinely required (no safe default); caller must supply.
id: nf-core/modules/fmhfunprofiler
name: fmhfunprofiler
summary: Functionally profile metagenomic samples using FracMinHash sketches against KEGG database references.
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: Input metagenomic sequences in FASTA or FASTQ format (can be compressed)
  ko_sketch:
    kind: input
    type: path
    required: true
    description: Sourmash signature reference sketch or Sequence Bloom Tree (SBT) of KEGG KOs
  ksize:
    kind: option
    type: integer
    required: true
    description: The k-mer size to use for the sketch (typically 7, 11, or 15)
  scaled:
    kind: option
    type: integer
    required: true
    description: The FracMinHash scale factor (e.g., 1000)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fmhfunprofiler.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  csv:
    type: directory
    path: ${outdir}/fmhfunprofiler
    primary: true
