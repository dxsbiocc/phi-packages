# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: val input 'min_reads' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/fgumi-filter
name: fgumi filter
summary: Filters consensus reads generated by simplex or duplex consensus calling.
params:
  bam:
    kind: input
    type: path
    required: true
    description: Consensus BAM file to be filtered
  fasta:
    kind: input
    type: path
    required: true
    description: Reference genome FASTA file
  min_reads:
    kind: option
    type: integer
    required: true
    description: Minimum number of reads required to keep a consensus read
  keep_rejected:
    kind: option
    type: boolean
    required: false
    description: Whether to keep rejected reads in a separate BAM file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fgumi.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bam:
    type: directory
    path: ${outdir}/fgumi_filter
    primary: true
