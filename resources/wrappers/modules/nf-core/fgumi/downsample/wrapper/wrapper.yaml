# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: val input 'fraction' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/fgumi-downsample
name: fgumi downsample
summary: Downsample a BAM by UMI family using streaming with fgumi
params:
  bam:
    kind: input
    type: path
    required: true
    description: UMI-grouped BAM file (from fgumi group) in template-coordinate order with MI tags
  fraction:
    kind: option
    type: number
    required: true
    description: Fraction of UMI families to keep (0.0 exclusive to 1.0 inclusive)
  keep_rejected:
    kind: option
    type: boolean
    required: false
    description: If true, write reads from families that were not kept to a separate rejects BAM file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fgumi.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bam:
    type: directory
    path: ${outdir}/fgumi_downsample
    primary: true
