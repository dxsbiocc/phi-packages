# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) genuinely required (no safe default); caller must supply.
id: nf-core/modules/fgumi-duplex
name: fgumi duplex
summary: Calls duplex consensus sequences from reads generated from the same double-stranded source molecule.
params:
  grouped_bam:
    kind: input
    type: path
    required: true
    description: Grouped BAM file
  min_reads:
    kind: option
    type: string
    required: true
    description: Minimum number of raw/original reads to build each consensus read.
  keep_rejected:
    kind: option
    type: boolean
    required: false
    description: If true, output rejected reads to a separate BAM file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fgumi.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bam:
    type: directory
    path: ${outdir}/fgumi_duplex
    primary: true
