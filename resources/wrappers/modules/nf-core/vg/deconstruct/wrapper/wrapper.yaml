    kind: input
    type: path
    required: true
    description: Optional snarls file (from vg snarls) to avoid recomputing.
  gbwt:
    kind: input
    type: path
    required: false
    description: Optional GBWT file (from vg gbwt) so to only consider alt traversals that correspond
      to GBWT threads FILE.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to vg.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/vg_deconstruct
    primary: true
