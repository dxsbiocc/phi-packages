# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics; companion input 'transform_dir' combined cartesian-style; verify if per-sample pairing is required; val input 'mpp' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/rami2d-transform
name: rami2d transform
summary: Applies transformations to images using RAMI2D, designed to take the transformation maps produced
  by rami2d-register
params:
  image_file:
    kind: input
    type: path
    required: true
    description: Absolute path to the input image file
  transform_dir:
    kind: input
    type: path
    required: false
    description: Directory containing the transformation matrices/files generated by rami2d-register
  markers:
    kind: input
    type: path
    required: true
    description: Optional CSV file with a column named marker_name containing the names of the channels
  mpp:
    kind: option
    type: number
    required: true
    description: Pixel size of the image in microns (microns per pixel)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to rami2d.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  transformed_image:
    type: directory
    path: ${outdir}/rami2d_transform
    primary: true
