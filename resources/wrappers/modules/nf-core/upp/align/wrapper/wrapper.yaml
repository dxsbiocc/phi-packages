# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics; companion input 'fasta_aligned' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/upp-align
name: upp align
summary: Aligns protein structures using UPP
params:
  fasta_unaligned:
    kind: input
    type: path
    required: true
    description: Unaligned sequence file.
  fasta_aligned:
    kind: input
    type: path
    required: false
    description: Aligned sequence file.
  tree:
    kind: input
    type: path
    required: true
    description: Input guide tree, in Newick format.
  compress:
    kind: option
    type: boolean
    required: false
    description: Flag representing whether the output MSA should be compressed.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to upp.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  alignment:
    type: directory
    path: ${outdir}/upp_align
    primary: true
