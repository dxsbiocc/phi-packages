# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/purecn-run
name: purecn run
summary: Run PureCN workflow to normalize, segment and determine purity and ploidy
params:
  intervals:
    kind: input
    type: path
    required: true
    description: BED file of target intervals, generated from IntervalFile.R
  coverage:
    kind: input
    type: path
    required: false
    description: Coverage file generated from Coverage.R
  vcf:
    kind: input
    type: path
    required: false
    description: VCF containing variant calls
  normal_db:
    kind: input
    type: path
    required: false
    description: Normal panel database
  mapping_bias:
    kind: input
    type: path
    required: true
    description: Mapping bias file generated with normal panel
  genome:
    kind: option
    type: string
    required: true
    description: Genome build
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to purecn.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  pdf:
    type: directory
    path: ${outdir}/purecn_run
    primary: true
