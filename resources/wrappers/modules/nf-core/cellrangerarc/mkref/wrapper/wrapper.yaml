# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/cellrangerarc-mkref
name: cellrangerarc mkref
summary: Module to build the reference needed by the 10x Genomics Cell Ranger Arc tool.
params:
  fasta:
    kind: input
    type: path
    required: true
    description: Reference genome FASTA file
  gtf:
    kind: input
    type: path
    required: false
    description: Reference transcriptome GTF file
  motifs:
    kind: input
    type: path
    required: false
    description: Sequence motif file (e.g., from transcription factors)
  reference_config:
    kind: input
    type: path
    required: false
    description: JSON-like file holding organism, genome, reference fasta path, reference annotation gtf
      path, contigs that should be excluded and sequence format motif file path
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to cellrangerarc.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  reference:
    type: directory
    path: ${outdir}/cellrangerarc_mkref
    primary: true
