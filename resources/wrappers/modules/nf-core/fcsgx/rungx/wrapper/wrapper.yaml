id: nf-core/modules/fcsgx-rungx
name: fcsgx rungx
summary: Runs FCS-GX (Foreign Contamination Screen - Genome eXtractor) to screen and remove foreign contamination
  from genome assemblies
params:
  fasta:
    kind: input
    type: path
    required: true
    description: Input genome assembly file in FASTA format
  taxid:
    kind: option
    type: string
    required: true
    description: Taxonomy ID of the expected organism
  gxdb:
    kind: input
    type: path
    required: false
    description: Directory containing the FCS-GX database
  ramdisk_path:
    kind: option
    type: string
    required: true
    description: Path to RAM disk for improved performance (optional)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fcsgx.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  fcsgx_report:
    type: directory
    path: ${outdir}/fcsgx_rungx
    primary: true
