# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'profiles' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/instrain-compare
name: instrain compare
summary: Strain-level comparisons across multiple inStrain profiles
params:
  bams:
    kind: input
    type: path
    required: true
    description: Path to .bam files that were profiled
  profiles:
    kind: input
    type: path
    required: false
    description: InStrain profile folders
  stb_file:
    kind: input
    type: path
    required: true
    description: Path to .stb (scaffold to bin) file that was profiled
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to instrain.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  compare:
    type: directory
    path: ${outdir}/instrain_compare
    primary: true
