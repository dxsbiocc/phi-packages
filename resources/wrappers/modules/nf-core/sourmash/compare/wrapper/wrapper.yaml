# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
id: nf-core/modules/sourmash-compare
name: sourmash compare
summary: Compare many FracMinHash signatures generated by sourmash sketch.
params:
  signatures:
    kind: input
    type: path
    required: true
    description: Files containing signatures (hash sketches) of samples
  file_list:
    kind: input
    type: path
    required: true
    description: An optional file specifying a list of file paths that should be appended to the input
      signatures.
  save_numpy_matrix:
    kind: option
    type: boolean
    required: false
    description: If true, output will contain a (dis)similarity matrix numpy binary format.
  save_csv:
    kind: option
    type: boolean
    required: false
    description: If true, output will contain a (dis)similarity matrix in CSV format At least one of save_numpy_matrix
      or save_csv is required.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to sourmash.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  matrix:
    type: directory
    path: ${outdir}/sourmash_compare
    primary: true
