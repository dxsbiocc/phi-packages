    kind: input
    type: path
    required: true
    description: PLINK binary biallelic genotype file
  bim:
    kind: input
    type: path
    required: false
    description: PLINK extended variant information file
  fam:
    kind: input
    type: path
    required: false
    description: PLINK sample information file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to pcaone.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  eigvecs:
    type: directory
    path: ${outdir}/pcaone
    primary: true
