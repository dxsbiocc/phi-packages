    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to kaiju.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  results:
    type: directory
    path: ${outdir}/kaiju_kaiju
    primary: true
