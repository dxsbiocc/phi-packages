# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) genuinely required (no safe default); caller must supply.
id: nf-core/modules/rastair-call
name: rastair call
summary: Assess positive C->T conversion as a readout for methylation on a genome-wide basis
params:
  bam:
    kind: input
    type: path
    required: true
    description: BAM/CRAM file
  bai:
    kind: input
    type: path
    required: true
    description: BAM/CRAM index file
  fasta:
    kind: input
    type: path
    required: true
    description: Input genome fasta file
  fai:
    kind: input
    type: path
    required: true
    description: FASTA index file
  parsed_trim__o_t:
    kind: option
    type: string
    required: true
    description: Number of nucleotides to trim from Original Top (OT) reads.
  parsed_trim__o_b:
    kind: option
    type: string
    required: true
    description: Number of nucleotides to trim from Original Bottom (OB) reads.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to rastair.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  txt:
    type: directory
    path: ${outdir}/rastair_call
    primary: true
