    kind: input
    type: path
    required: true
    description: sgRNA raw counts
  library_file:
    kind: input
    type: path
    required: false
    description: sgRNA library
  min_reads:
    kind: option
    type: integer
    required: true
    description: Minimum number of reads
  min_targeted_genes:
    kind: option
    type: integer
    required: true
    description: Minimum number of targeted genes
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
