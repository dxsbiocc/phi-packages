# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'alignment_indices' combined cartesian-style; verify if per-sample pairing is required; companion input 'alignment_file_list' combined cartesian-style; verify if per-sample pairing is required; companion input 'fai' combined cartesian-style; verify if per-sample pairing is required; companion input 'ref_vcf_tbi' combined cartesian-style; verify if per-sample pairing is required; companion input 'snp_vcf_tbi' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/hipstr
name: hipstr
summary: Genotype and phase short tandem repeats using Illumina whole-genome sequencing data
params:
  alignment_files:
    kind: input
    type: path
    required: true
    description: List of BAM/CRAM files to analyze
  alignment_indices:
    kind: input
    type: path
    required: false
    description: Index file(s) for the input BAM/CRAM file(s)
  alignment_file_list:
    kind: input
    type: path
    required: false
    description: Optional file containing BAM/CRAM files to analyze, one per line.
  fasta:
    kind: input
    type: path
    required: true
    description: FASTA file containing all of the relevant sequences for your organism.
  fai:
    kind: input
    type: path
    required: false
    description: Optional FASTA index file
  ref_regions:
    kind: input
    type: path
    required: true
    description: BED file containing coordinates for each STR region
  ref_vcf:
    kind: input
    type: path
    required: true
    description: Optional bgzipped input VCF file of a reference panel of STR genotypes.
  ref_vcf_tbi:
    kind: input
    type: path
    required: false
    description: Optional tabix index for the STR reference panel VCF
  snp_vcf:
    kind: input
    type: path
    required: true
    description: Optional bgzipped input VCF file containing phased SNP genotypes for the samples to be
      genotyped.
  snp_vcf_tbi:
    kind: input
    type: path
    required: false
    description: Optional tabix index for the phased SNP VCF
  stutter_in:
    kind: input
    type: path
    required: true
    description: Optional input file containing stutter models.
  fam:
    kind: input
    type: path
    required: true
    description: Optional FAM file (PLINK sample information file) containing pedigree information for
      samples of interest.
  hap_chr_file:
    kind: input
    type: path
    required: true
    description: Optional file containing chromosomes to treat as haploid, one per line
  save_log:
    kind: option
    type: boolean
    required: false
    description: Whether to output the log information to the file (Default = Standard error)
  save_viz:
    kind: option
    type: boolean
    required: false
    description: Whether to output a file of each locus' alignments for visualization with VizAln or VizAlnPdf
  save_stutter:
    kind: option
    type: boolean
    required: false
    description: Whether to output stutter models learned by the EM algorithm to the file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to hipstr.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/hipstr
    primary: true
