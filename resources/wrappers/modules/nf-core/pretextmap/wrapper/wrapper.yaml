# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'fai' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/pretextmap
name: pretextmap
summary: converts sam/bam/cram/pairs into genome contact map
params:
  input:
    kind: input
    type: path
    required: true
    description: BAM/CRAM/SAM file or pairs formatted reads file
  fasta:
    kind: input
    type: path
    required: true
    description: Reference sequence file
  fai:
    kind: input
    type: path
    required: false
    description: Reference sequence index file
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to pretextmap.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  pretext:
    type: directory
    path: ${outdir}/pretextmap
    primary: true
