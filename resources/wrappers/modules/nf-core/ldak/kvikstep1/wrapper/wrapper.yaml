# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'bim' combined cartesian-style; verify if per-sample pairing is required; companion input 'fam' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/ldak-kvikstep1
name: ldak kvikstep1
summary: Run LDAK-KVIK step 1 to fit the genome-wide model and emit the minimal prediction artifact tuple
  consumed by ldak/kvikstep2
params:
  bed:
    kind: input
    type: path
    required: true
    description: PLINK BED genotype file passed to `--bfile`
  bim:
    kind: input
    type: path
    required: false
    description: PLINK BIM variant file paired with the BED input
  fam:
    kind: input
    type: path
    required: false
    description: PLINK FAM sample file paired with the BED input
  phenotype_file:
    kind: input
    type: path
    required: true
    description: Phenotype file passed to `--pheno`
  is_binary:
    kind: option
    type: boolean
    required: false
    description: Optional trait-type flag; pass `true` to add `--binary YES` for case-control traits
  quant_covariates_file:
    kind: input
    type: path
    required: true
    description: Optional quantitative covariates file passed to `--covar`; provide `[]` when absent
  cat_covariates_file:
    kind: input
    type: path
    required: true
    description: Optional categorical covariates file passed to `--factors`; provide `[]` when absent
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ldak.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  predictions:
    type: directory
    path: ${outdir}/ldak_kvikstep1
    primary: true
