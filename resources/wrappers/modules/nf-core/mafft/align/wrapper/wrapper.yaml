id: nf-core/modules/mafft-align
name: mafft align
summary: Multiple sequence alignment using MAFFT
params:
  fasta:
    kind: input
    type: path
    required: true
    description: FASTA file containing the sequences to align.
  add:
    kind: input
    type: path
    required: true
    description: FASTA file containing sequences to align to the sequences in `fasta` using `--add`.
  addfragments:
    kind: input
    type: path
    required: true
    description: FASTA file containing sequences to align to the sequences in `fasta` using `--addfragments`.
  addfull:
    kind: input
    type: path
    required: true
    description: FASTA file containing sequences to align to the sequences in `fasta` using `--addfull`.
  addprofile:
    kind: input
    type: path
    required: true
    description: FASTA file containing sequences to align to the sequences in `fasta` using `--addprofile`.
  addlong:
    kind: input
    type: path
    required: true
    description: FASTA file containing sequences to align to the sequences in `fasta` using `--addlong`.
  compress:
    kind: option
    type: boolean
    required: false
    description: Flag representing whether the output MSA should be compressed.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to mafft.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  fas:
    type: directory
    path: ${outdir}/mafft_align
    primary: true
