# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics
id: nf-core/modules/parabricks-rnafq2bam
name: parabricks rnafq2bam
summary: This tool is the equivalent of fq2bam for RNA-Seq samples, receiving inputs in FASTQ format,
  performing alignment with the splice-aware STAR algorithm, optionally marking of duplicate reads, and
  outputting an aligned BAM file ready for variant and fusion calling.
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: fastq.gz files
  fasta:
    kind: input
    type: path
    required: true
    description: reference fasta file - must be unzipped
  index:
    kind: input
    type: path
    required: true
    description: Path to a genome resource library directory.
  qc_metrics:
    kind: option
    type: boolean
    required: false
    description: Optionally report QC metrics
  mark_duplicates:
    kind: option
    type: boolean
    required: false
    description: Optionally mark duplicates
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to parabricks.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  log_final:
    type: directory
    path: ${outdir}/parabricks_rnafq2bam
    primary: true
