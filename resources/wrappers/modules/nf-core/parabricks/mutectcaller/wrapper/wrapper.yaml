# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/parabricks-mutectcaller
name: parabricks mutectcaller
summary: NVIDIA Clara Parabricks GPU-accelerated somatic variant calling, replicating GATK Mutect2.
params:
  tumor_bam:
    kind: input
    type: path
    required: true
    description: bam file for tumor sample.
  tumor_bam_index:
    kind: input
    type: path
    required: false
    description: (Optional) bai index corresponding to tumor bam file.
  normal_bam:
    kind: input
    type: path
    required: false
    description: (Optional) bam file for normal sample in tumor-vs-normal calling.
  normal_bam_index:
    kind: input
    type: path
    required: false
    description: (Optional) bai index corresponding to normal bam file.
  intervals:
    kind: input
    type: path
    required: false
    description: (Optional) file or files containing genomic intervals for use in base quality score recalibration.
  fasta:
    kind: input
    type: path
    required: true
    description: reference fasta - must be unzipped.
  fasta_fai:
    kind: input
    type: path
    required: false
    description: (Optional) reference fasta index.
  panel_of_normals:
    kind: input
    type: path
    required: true
    description: (Optional) panel of normals file.
  panel_of_normals_index:
    kind: input
    type: path
    required: false
    description: (Optional) tbi index corresponding to panel of normals file.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to parabricks.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/parabricks_mutectcaller
    primary: true
