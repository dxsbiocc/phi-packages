# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/parabricks-deepvariant
name: parabricks deepvariant
summary: NVIDIA Clara Parabricks GPU-accelerated germline variant calling, replicating deepvariant.
params:
  input:
    kind: input
    type: path
    required: true
    description: bam file for sample to be variant called.
  input_index:
    kind: input
    type: path
    required: false
    description: bai index corresponding to input bam file.
  intervals:
    kind: input
    type: path
    required: false
    description: file or files containing genomic intervals for use in base quality score recalibration.
  fasta:
    kind: input
    type: path
    required: true
    description: reference fasta - must be unzipped.
  ref_meta:
    kind: option
    type: string
    required: true
    description: Groovy Map containing reference information.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to parabricks.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/parabricks_deepvariant
    primary: true
