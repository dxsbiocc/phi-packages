# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics; val input 'output_fmt' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/parabricks-fq2bam
name: parabricks fq2bam
summary: NVIDIA Clara Parabricks GPU-accelerated alignment, sorting, BQSR calculation, and duplicate marking.
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: fastq.gz files
  fasta:
    kind: input
    type: path
    required: true
    description: reference fasta file - must be unzipped
  index:
    kind: input
    type: path
    required: true
    description: reference BWA index
  intervals:
    kind: input
    type: path
    required: true
    description: (optional) file(s) containing genomic intervals for use in base quality score recalibration
      (BQSR)
  known_sites:
    kind: input
    type: path
    required: true
    description: (optional) known sites file(s) for calculating BQSR.
  output_fmt:
    kind: option
    type: string
    required: true
    description: Output format for the alignment.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to parabricks.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bam:
    type: directory
    path: ${outdir}/parabricks_fq2bam
    primary: true
