# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/suppa-clusterevents
name: suppa clusterevents
summary: Cluster events based on PSI values and significantly differentially spliced events using SUPPA2.
params:
  dpsi:
    kind: input
    type: path
    required: true
    description: Differentially spliced events file
  psivec:
    kind: input
    type: path
    required: false
    description: PSI values for all events across all samples
  significance_threshold:
    kind: option
    type: number
    required: false
    description: P-value threshold to consider an event significant from the dpsi file
  dpsi_threshold:
    kind: option
    type: number
    required: false
    description: Lower-bound for the absolute delta PSI value to cluster
  maximum_distance:
    kind: option
    type: number
    required: false
    description: Maximum distance (between 0 and 1) to consider two events as members of the same cluster
  metric:
    kind: option
    type: string
    required: false
    description: Distance metric.
  separation:
    kind: option
    type: number
    required: false
    description: Maximum distance in PSI space of an event to a cluster (only for OPTICS)
  min_number_events:
    kind: option
    type: integer
    required: false
    description: Minimum number of events required per cluster
  groups:
    kind: option
    type: string
    required: true
    description: Ranges of column numbers specifying the replicates per condition.
  clustering_method:
    kind: option
    type: string
    required: false
    description: Clustering method to use (allowed values are DBSCAN, OPTICS)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to suppa.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  clustvec:
    type: directory
    path: ${outdir}/suppa_clusterevents
    primary: true
