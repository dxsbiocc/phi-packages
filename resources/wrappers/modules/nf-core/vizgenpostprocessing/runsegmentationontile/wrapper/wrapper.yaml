id: nf-core/modules/vizgenpostprocessing-runsegmentationontile
name: vizgenpostprocessing runsegmentationontile
summary: The module runs the segmentation algorithm on a specific tile using Vizgen's post-processing
  tool.
params:
  input_images:
    kind: input
    type: path
    required: true
    description: Path to the input images directory to be used for segmentation.
  segmentation_params:
    kind: input
    type: path
    required: false
    description: Path to the segmentation parameters (algorithm specification) JSON file generated by
      the preparesegmentation module.
  tile_index:
    kind: option
    type: integer
    required: true
    description: The index of the tile to run the segmentation algorithm on.
  algorithm_json:
    kind: input
    type: path
    required: true
    description: JSON file containing the algorithm parameters.
  custom_weights:
    kind: input
    type: path
    required: true
    description: Directory containing custom weights for the segmentation algorithm.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to vizgenpostprocessing.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  segmented_tile:
    type: directory
    path: ${outdir}/vizgenpostprocessing_runsegmentationontile
    primary: true
