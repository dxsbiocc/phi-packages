# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'um_to_mosaic_file' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/vizgenpostprocessing-preparesegmentation
name: vizgenpostprocessing preparesegmentation
summary: The module prepares the specification JSON file for Vizgen's post-processing tool cell segmentation
  workflow.
params:
  input_images:
    kind: input
    type: path
    required: true
    description: Path to the input images directory to be used for segmentation.
  um_to_mosaic_file:
    kind: input
    type: path
    required: false
    description: Path to the micron-to-mosaic pixel transform matrix file.
  algorithm_json:
    kind: input
    type: path
    required: true
    description: JSON file containing the algorithm specification
  images_regex:
    kind: option
    type: string
    required: true
    description: Can either be blank to match files by MERSCOPE convention, or a python formatting string
      specifying the file name (e.g., image_{stain}_z{z}.tif), or a regular expression matching the tiff
      files to be used (e.g., mosaic_(?P<stain>[\w|-]+)_z(?P<z>[0-9]+).tif)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to vizgenpostprocessing.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  segmentation_files:
    type: directory
    path: ${outdir}/vizgenpostprocessing_preparesegmentation
    primary: true
