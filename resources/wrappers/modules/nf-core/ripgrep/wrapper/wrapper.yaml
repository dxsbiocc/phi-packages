# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: val input 'pattern' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/ripgrep
name: ripgrep
summary: ripgrep recursively searches directories for a regex pattern
params:
  files:
    kind: input
    type: path
    required: true
    description: File(s) to be searched
  pattern:
    kind: option
    type: string
    required: true
    description: Regex pattern to search for
  pattern_file:
    kind: input
    type: path
    required: true
    description: File containing list of patterns to search for
  compress:
    kind: option
    type: boolean
    required: false
    description: Compress the output file using pigz
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to ripgrep.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  txt:
    type: directory
    path: ${outdir}/ripgrep
    primary: true
