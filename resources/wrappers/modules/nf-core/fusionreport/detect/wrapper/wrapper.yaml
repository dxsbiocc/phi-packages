# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'starfusion_fusions' combined cartesian-style; verify if per-sample pairing is required; companion input 'fusioncatcher_fusions' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/fusionreport-detect
name: fusionreport detect
summary: fusionreport_detect
params:
  arriba_fusions:
    kind: input
    type: path
    required: true
    description: File
  starfusion_fusions:
    kind: input
    type: path
    required: false
    description: File containing fusions from STARfusion
  fusioncatcher_fusions:
    kind: input
    type: path
    required: false
    description: File containing fusions from fusioncatcher
  fusionreport_ref:
    kind: input
    type: path
    required: true
    description: directory containing the genome resource files required for fusioncatcher
  tools_cutoff:
    kind: option
    type: integer
    required: true
    description: Discard fusions detected by less than $tools_cutoff tools both for display in fusionreport
      html index and to consider in fusioninspector.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to fusionreport.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  fusion_list:
    type: directory
    path: ${outdir}/fusionreport_detect
    primary: true
