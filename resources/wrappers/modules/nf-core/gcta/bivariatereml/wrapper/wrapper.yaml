# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: val input(s) module-defaulted where the tool allows, otherwise genuinely required.
id: nf-core/modules/gcta-bivariatereml
name: gcta bivariatereml
summary: Run bivariate REML analysis with a single dense GRM
params:
  grm_files:
    kind: input
    type: path
    required: true
    description: Dense GRM bundle containing sample identifier, binary matrix, and sample-count matrix
      files
  phenotype_file:
    kind: input
    type: path
    required: true
    description: Shared bivariate phenotype file passed to `--pheno`
  phenotype_col1:
    kind: option
    type: integer
    required: true
    description: First phenotype column passed to `--reml-bivar` (for example `1`).
  phenotype_col2:
    kind: option
    type: integer
    required: false
    description: Second phenotype column passed to `--reml-bivar` (for example `2`).
  quant_covariates_file:
    kind: input
    type: path
    required: true
    description: Quantitative covariates file, pass `[]` when absent
  cat_covariates_file:
    kind: input
    type: path
    required: true
    description: Categorical covariates file, pass `[]` when absent
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gcta.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  bivariate_results:
    type: directory
    path: ${outdir}/gcta_bivariatereml
    primary: true
