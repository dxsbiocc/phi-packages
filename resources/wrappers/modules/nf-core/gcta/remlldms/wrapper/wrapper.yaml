# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/gcta-remlldms
name: gcta remlldms
summary: Run REML-LDMS heritability estimation with an MGRM manifest
params:
  mgrm_file:
    kind: input
    type: path
    required: true
    description: MGRM manifest file
  grm_files:
    kind: input
    type: path
    required: false
    description: GRM bundles referenced by `mgrm_file`; each manifest entry should have matching `*.grm.{id,bin,N.bin}`
      files in this bundle
  phenotypes_file:
    kind: input
    type: path
    required: true
    description: Phenotype file passed to `--pheno`
  quant_covariates_file:
    kind: input
    type: path
    required: true
    description: Quantitative covariates file, pass `[]` when absent
  cat_covariates_file:
    kind: input
    type: path
    required: true
    description: Categorical covariates file, pass `[]` when absent
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gcta.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  reml_results:
    type: directory
    path: ${outdir}/gcta_remlldms
    primary: true
