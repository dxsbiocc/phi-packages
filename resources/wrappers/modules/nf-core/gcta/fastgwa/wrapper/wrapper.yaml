# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# Curated: companion input(s) are single-valued params broadcast onto each main-input item; .combine() is not cartesian here.
id: nf-core/modules/gcta-fastgwa
name: gcta fastgwa
summary: Run GCTA fastGWA mixed linear model association analysis with PLINK genotype inputs
params:
  bed_pgen:
    kind: input
    type: path
    required: true
    description: PLINK primary genotype file, either `.bed` or `.pgen`
  bim_pvar:
    kind: input
    type: path
    required: false
    description: PLINK variant sidecar file, either `.bim` or `.pvar`
  fam_psam:
    kind: input
    type: path
    required: false
    description: PLINK sample sidecar file, either `.fam` or `.psam`
  phenotype_file:
    kind: input
    type: path
    required: true
    description: Phenotype file
  quant_covariates_file:
    kind: input
    type: path
    required: true
    description: Quantitative covariates file, pass `[]` when absent
  cat_covariates_file:
    kind: input
    type: path
    required: true
    description: Categorical covariates file, pass `[]` when absent
  sparse_grm_files:
    kind: input
    type: path
    required: true
    description: Sparse GRM sidecar files
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gcta.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  results:
    type: directory
    path: ${outdir}/gcta_fastgwa
    primary: true
