# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics
id: nf-core/modules/gcta-reml
name: gcta reml
summary: Run univariate REML heritability estimation with a dense GRM
params:
  grm_files:
    kind: input
    type: path
    required: true
    description: Dense GRM bundle containing sample identifier, binary matrix, and sample-count matrix
      files
  phenotypes_file:
    kind: input
    type: path
    required: true
    description: Phenotype file passed to `--pheno`
  quant_covariates_file:
    kind: input
    type: path
    required: true
    description: Quantitative covariates file, pass `[]` when absent
  cat_covariates_file:
    kind: input
    type: path
    required: true
    description: Categorical covariates file, pass `[]` when absent
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gcta.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  reml_results:
    type: directory
    path: ${outdir}/gcta_reml
    primary: true
