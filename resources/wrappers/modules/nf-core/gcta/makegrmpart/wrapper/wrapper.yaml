    kind: option
    type: integer
    required: true
    description: One-based index of the GRM partition to compute via `--make-grm-part`; defaults to `1`
      when `null`
  snp_group_file:
    kind: input
    type: path
    required: true
    description: Optional SNP extraction file passed to `--extract`; provide `[]` when absent
  args:
    kind: option
