id: nf-core/modules/gcta-makegrmpart
name: gcta makegrmpart
summary: Compute one partition of a GCTA genetic relationship matrix
params:
  mfile:
    kind: input
    type: path
    required: true
    description: GCTA multi-input manifest consumed by `--mbfile` or `--mpfile`
  bed_pgen:
    kind: input
    type: path
    required: false
    description: Collection of PLINK primary genotype files referenced by the multi-input manifest
  bim_pvar:
    kind: input
    type: path
    required: false
    description: Collection of PLINK variant metadata files referenced by the multi-input manifest
  fam_psam:
    kind: input
    type: path
    required: false
    description: Collection of PLINK sample metadata files referenced by the multi-input manifest
  nparts_gcta:
    kind: option
    type: integer
    required: true
    description: Total number of GRM partitions requested via `--make-grm-part`; defaults to `1` when
      `null`
