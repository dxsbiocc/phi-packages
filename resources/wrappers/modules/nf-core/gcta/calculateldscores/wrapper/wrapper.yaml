# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'bim' combined cartesian-style; verify if per-sample pairing is required; companion input 'fam' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/gcta-calculateldscores
name: gcta calculateldscores
summary: Calculate LD scores with GCTA and derive GREML-LDMS SNP groups
params:
  bed:
    kind: input
    type: path
    required: true
    description: PLINK1 genotype primary file
  bim:
    kind: input
    type: path
    required: false
    description: PLINK1 variant metadata file
  fam:
    kind: input
    type: path
    required: false
    description: PLINK1 sample metadata file
  ld_score_region:
    kind: option
    type: integer
    required: true
    description: LD-score region width passed to `--ld-score-region`.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to gcta.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  ld_scores:
    type: directory
    path: ${outdir}/gcta_calculateldscores
    primary: true
