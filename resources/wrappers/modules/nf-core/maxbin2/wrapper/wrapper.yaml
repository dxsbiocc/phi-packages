id: nf-core/modules/maxbin2
name: maxbin2
summary: MaxBin is a software that is capable of clustering metagenomic contigs
params:
  contigs:
    kind: input
    type: path
    required: true
    description: Multi FASTA file containing assembled contigs of a given sample
  reads:
    kind: input
    type: path
    required: false
    description: Reads used to assemble contigs in FASTA or FASTQ format.
  abund:
    kind: input
    type: path
    required: false
    description: One or more contig abundance files, i.e.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to maxbin2.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  binned_fastas:
    type: directory
    path: ${outdir}/maxbin2
    primary: true
