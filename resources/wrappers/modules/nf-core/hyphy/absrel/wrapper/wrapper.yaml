id: nf-core/modules/hyphy-absrel
name: hyphy absrel
summary: aBSREL (adaptive Branch-Site Random Effects Likelihood) identifies instances where a proportion
  of sites along specific branches or lineages of a phylogeny have undergone positive selection.
params:
  alignment:
    kind: input
    type: path
    required: true
    description: Codon aligned sequences in FASTA format.
  tree:
    kind: input
    type: path
    required: false
    description: Phylogenetic gene tree in text or xml format
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to hyphy.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  json:
    type: directory
    path: ${outdir}/hyphy_absrel
    primary: true
