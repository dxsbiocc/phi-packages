id: nf-core/modules/hyphy-fade
name: hyphy fade
summary: FADE (FUBAR Aproach to Directional Evolution) is a method that uses a Bayesian framework, based
  on that introduced by FUBAR ), to test whether sites in a protein alignment are subject to directional
  selection.
params:
  alignment:
    kind: input
    type: path
    required: true
    description: Aligned protein sequences in FASTA format.
  tree:
    kind: input
    type: path
    required: false
    description: Phylogenetic gene tree in text or xml format
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to hyphy.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  json:
    type: directory
    path: ${outdir}/hyphy_fade
    primary: true
