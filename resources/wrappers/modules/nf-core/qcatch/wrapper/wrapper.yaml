# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: val input 'chemistry' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/qcatch
name: qcatch
summary: Cell-filtering and QC reporting tool for alevin-fry quantification results
params:
  quant_dir:
    kind: input
    type: path
    required: true
    description: Directory containing alevin-fry quantification results (af_quant output from simpleaf
      quant).
  chemistry:
    kind: option
    type: string
    required: true
    description: Chemistry type for the single-cell experiment, which determines the partition range for
      the empty_drops step.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to qcatch.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  report:
    type: directory
    path: ${outdir}/qcatch
    primary: true
