# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: glob input 'bins' collected into one staged list; verify staging layout; val input 'mode' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/catpack-reads
name: catpack reads
summary: Taxonomic classification plus read-based abundance estimation from long DNA sequences and metagenome
  assembled genomes (e.g.
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: One or a pair of nucleotide FASTQ files (R1, R2) containing reads for mapping.
  contigs:
    kind: input
    type: path
    required: true
    description: A nucleotide FASTA file containing long DNA sequences such as contigs.
  database:
    kind: input
    type: path
    required: true
    description: Directory containing CAT_pack database files (e.g.
  taxonomy:
    kind: input
    type: path
    required: true
    description: Directory containing CAT_pack taxonomy files (e.g.
  bins:
    kind: input
    type: path
    required: true
    description: One or more nucleotide FASTA file containing binned long DNA sequences.
  mode:
    kind: option
    type: string
    required: true
    description: 'Mode of operation of CAT_pack reads, "mcr": integrate annotations from MAGs (bins),
      contigs, and reads; "cr": integrate annotations from contigs and reads; "mr": integrate annotations
      from MAGs (bins) and reads.'
  bam_aligned:
    kind: input
    type: path
    required: true
    description: Optional pre-aligned and sorted reads mapped against contigs/bins.
  bam_unaligned:
    kind: input
    type: path
    required: true
    description: Optional sorted unaligned reads from mapping against contigs/bins.
  contig2classification:
    kind: input
    type: path
    required: true
    description: Optional TSV file with per-contig hit stats and assignment justification information
  bin2classification:
    kind: input
    type: path
    required: true
    description: Optional TSV file with per-bin hit stats and assignment justification information
  unclassified2classification:
    kind: input
    type: path
    required: true
    description: Optional TSV file with pre-made CAT_pack reads unmapped2classification.txt file information
  proteins:
    kind: input
    type: path
    required: true
    description: Optional pre predicted-made proteins FASTA
  diamond_alignment:
    kind: input
    type: path
    required: true
    description: Optional pre-made DIAMOND alignment table
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to catpack.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  rat_log:
    type: directory
    path: ${outdir}/catpack_reads
    primary: true
