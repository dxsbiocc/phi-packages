id: nf-core/modules/mgnifam-generatefamilies
name: mgnifam generatefamilies
summary: Iteratively builds protein family HMM profiles from MMseqs2 sequence clusters and expands them
  against a protein database
params:
  clustering:
    kind: input
    type: path
    required: true
    description: Headerless TSV file of MMseqs2 sequence clusters, one representative-member pair per
      line (representative<TAB>member)
  fasta_file:
    kind: input
    type: path
    required: false
    description: Uncompressed FASTA file of the protein sequence database, with unique sequence names,
      referenced by the cluster members
  fasta_index:
    kind: input
    type: path
    required: false
    description: Optional.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to mgnifam.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  seed_msa:
    type: directory
    path: ${outdir}/mgnifam_generatefamilies
    primary: true
