# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: val input 'mode' exposed as required option; confirm whether a safe default exists
id: nf-core/modules/flye
name: flye
summary: De novo assembler for single molecule sequencing reads
params:
  reads:
    kind: input
    type: fastq_glob
    required: true
    description: Input reads from Oxford Nanopore or PacBio data in FASTA/FASTQ format.
  mode:
    kind: option
    type: string
    required: true
    description: Flye mode depending on the input data (source and error rate)
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to flye.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  fasta:
    type: directory
    path: ${outdir}/flye
    primary: true
