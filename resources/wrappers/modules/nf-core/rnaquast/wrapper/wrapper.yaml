# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: multiple tuple channels: secondary channels wired as single references (.first()); verify pairing semantics
id: nf-core/modules/rnaquast
name: rnaquast
summary: Assess the quality of an RNAseq assembly with or without a reference genome
params:
  fasta:
    kind: input
    type: path
    required: true
    description: Specifies the transcriptome assembly FASTA file(s) to be evaluated.
  reference:
    kind: input
    type: path
    required: true
    description: Provides the reference genome FASTA file against which transcripts will be aligned.
  gtf:
    kind: input
    type: path
    required: true
    description: Supplies the reference gene annotation file in GTF format for evaluating transcript accuracy
      and completeness.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to rnaquast.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  results:
    type: directory
    path: ${outdir}/rnaquast
    primary: true
