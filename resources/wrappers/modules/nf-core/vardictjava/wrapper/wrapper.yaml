# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: companion input 'bais' combined cartesian-style; verify if per-sample pairing is required; companion input 'bed' combined cartesian-style; verify if per-sample pairing is required
id: nf-core/modules/vardictjava
name: vardictjava
summary: The Java port of the VarDict variant caller
params:
  bams:
    kind: input
    type: path
    required: true
    description: One or two BAM files.
  bais:
    kind: input
    type: path
    required: false
    description: Index/indices of the BAM file(s)
  bed:
    kind: input
    type: path
    required: false
    description: BED with the regions of interest
  fasta:
    kind: input
    type: path
    required: true
    description: FASTA of the reference genome
  fasta_fai:
    kind: input
    type: path
    required: true
    description: The index of the FASTA of the reference genome
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to vardictjava.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  vcf:
    type: directory
    path: ${outdir}/vardictjava
    primary: true
