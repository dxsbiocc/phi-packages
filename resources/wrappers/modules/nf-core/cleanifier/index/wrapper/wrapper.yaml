    kind: input
    type: fastq_glob
    required: true
    description: FASTA or FASTQ file(s) for the genomes that should be removed.
  n_objects:
    kind: option
    type: integer
    required: true
    description: The number of k-mers to be stored in hash table.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to cleanifier.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
