# Agent-facing wrapper adapter for the vendored module at ../main.nf.
# Follows docs/contracts/wrapper.md. Generated; review flagged semantics.
# REVIEW: glob input 'genome_files' collected into one staged list; verify staging layout; glob input 'taxonomy' collected into one staged list; verify staging layout
id: nf-core/modules/metacache-build
name: metacache build
summary: Taxonomic profiling database building with MetaCache
params:
  genome_files:
    kind: input
    type: path
    required: true
    description: (possibly gzipped) fasta or fastq files of full genomes, for example from an NCBI assembly
  taxonomy:
    kind: input
    type: path
    required: true
    description: NCBI taxonomy formatted files nodes.dmp and names.dmp
  seq2taxid:
    kind: input
    type: path
    required: true
    description: 'NCBI-style ''accession2taxid'' tab-separated file with 3 or 4 columns: accession, accession_version,
      taxid, and gid (optional)'
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to metacache.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the module's results.
outputs:
  db:
    type: directory
    path: ${outdir}/metacache_build
    primary: true
