# Agent-facing wrapper adapter for the local fpocket module at ../main.nf.
# Follows docs/contracts/wrapper.md.
id: local/modules/fpocket
name: fpocket Binding Pocket Detection
summary: Voronoi alpha-sphere binding pocket detection and druggability scoring with fpocket, emitting docking box coordinates for AutoDock Vina and GNINA.
params:
  id:
    kind: option
    type: string
    required: false
    description: Run identifier used as output filename prefix.
  receptor:
    kind: input
    type: file
    required: true
    description: Protein target structure in PDB format.
  min_alpha_spheres:
    kind: option
    type: integer
    required: false
    minimum: 10
    description: Minimum alpha spheres per pocket (-i).
  box_padding:
    kind: option
    type: number
    required: false
    minimum: 0
    description: Padding added around the pocket bounding box for docking grids (Angstrom).
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for ranked pockets TSV and docking box JSON.
outputs:
  results:
    type: directory
    path: ${outdir}
    primary: true
