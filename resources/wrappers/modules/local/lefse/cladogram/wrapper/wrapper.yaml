# Agent-facing wrapper for the local lefse/cladogram module at ../main.nf,
# ported from the Snakemake Workflow project (no nf-core equivalent).
# Follows docs/design/phi-wrapper-agent-composition-design.md section 3.
id: local/modules/lefse-cladogram
name: lefse cladogram
summary: Plot LEfSe results as a taxonomic cladogram.
params:
  res:
    kind: input
    type: file
    required: true
    description: LEfSe .res results file.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to the tool.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/lefse_plot_cladogram
    primary: true
