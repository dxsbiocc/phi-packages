# Agent-facing wrapper for the local lefse/format module at ../main.nf,
# ported from the Snakemake Workflow project (no nf-core equivalent).
# Follows docs/design/phi-wrapper-agent-composition-design.md section 3.
id: local/modules/lefse-format
name: lefse format
summary: Format a feature table into LEfSe input (header rows must already be prepared).
params:
  table:
    kind: input
    type: file
    required: true
    description: Feature table with LEfSe class/subclass header rows.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to the tool.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/lefse_format
    primary: true
