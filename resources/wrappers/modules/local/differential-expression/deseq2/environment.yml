# Process dependencies travel with this module.
# R/Bioconductor versions retain the cohort recorded by the original runtime.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::r-base=4.5.3
  - bioconda::bioconductor-deseq2=1.50.2
  - bioconda::bioconductor-limma=3.66.0
  - bioconda::bioconductor-biocparallel=1.44.0
  - conda-forge::r-ashr=2.2_63
