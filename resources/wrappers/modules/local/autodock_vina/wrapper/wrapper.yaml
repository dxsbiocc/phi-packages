# Agent-facing wrapper adapter for the local autodock_vina module at ../main.nf.
# Follows docs/contracts/wrapper.md.
id: local/modules/autodock-vina
name: AutoDock Vina Molecular Docking
summary: Structure-based rigid-receptor molecular docking with AutoDock Vina 1.2 outputting PDBQT poses and a normalized score_table.tsv for chem_docking_eval.
params:
  id:
    kind: option
    type: string
    required: false
    description: Run identifier used as output filename prefix.
  receptor:
    kind: input
    type: file
    required: true
    description: Prepared receptor structure in PDBQT format.
  ligands_dir:
    kind: input
    type: path
    required: true
    description: Directory containing ligand structures in PDBQT format.
  center_x:
    kind: option
    type: number
    required: true
    description: Docking box center X coordinate (Angstrom).
  center_y:
    kind: option
    type: number
    required: true
    description: Docking box center Y coordinate (Angstrom).
  center_z:
    kind: option
    type: number
    required: true
    description: Docking box center Z coordinate (Angstrom).
  size_x:
    kind: option
    type: number
    required: false
    minimum: 1
    description: Docking box size along X (Angstrom).
  size_y:
    kind: option
    type: number
    required: false
    minimum: 1
    description: Docking box size along Y (Angstrom).
  size_z:
    kind: option
    type: number
    required: false
    minimum: 1
    description: Docking box size along Z (Angstrom).
  exhaustiveness:
    kind: option
    type: integer
    required: false
    minimum: 1
    description: Vina Monte Carlo search exhaustiveness.
  num_modes:
    kind: option
    type: integer
    required: false
    minimum: 1
    description: Maximum docked binding modes saved per ligand.
  cpu_per_ligand:
    kind: option
    type: integer
    required: false
    minimum: 1
    description: Threads allocated per ligand docking call.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for docked poses and normalized score tables.
outputs:
  results:
    type: directory
    path: ${outdir}
    primary: true
