# Agent-facing wrapper for the local 3d-dna module at ../main.nf,
# ported from the Snakemake Workflow project (no nf-core equivalent).
# Follows docs/design/phi-wrapper-agent-composition-design.md section 3.
id: local/modules/three-d-dna
name: 3D-DNA
summary: Scaffold a draft genome with 3D-DNA using Hi-C merged_nodups contacts.
params:
  fasta:
    kind: input
    type: file
    required: true
    description: Draft assembly FASTA.
  mnd:
    kind: input
    type: file
    required: true
    description: merged_nodups.txt Hi-C contact file (from Juicer).
  mode:
    kind: option
    type: string
    required: false
    description: Assembly mode.
    enum:
    - haploid
    - diploid
  input_size:
    kind: option
    type: integer
    required: false
    description: Input contig size threshold (-i).
  rounds:
    kind: option
    type: integer
    required: false
    description: Number of misjoin-correction rounds (-r).
  stage:
    kind: option
    type: string
    required: false
    description: Stage to start from (-s), e.g. seal, finalize.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to the tool.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/threeddna
    primary: true
