# Agent-facing wrapper for the local isescan module at ../main.nf,
# ported from the Snakemake Workflow project (no nf-core equivalent).
# Follows docs/design/phi-wrapper-agent-composition-design.md section 3.
id: local/modules/isescan
name: ISEScan
summary: Detect insertion sequence (IS) elements in a genome FASTA with ISEScan.
params:
  contigs:
    kind: input
    type: file
    required: true
    description: Genome or contigs FASTA.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to the tool.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/isescan
    primary: true
