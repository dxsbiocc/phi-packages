# Agent-facing wrapper for the local pysradb module at ../main.nf,
# ported from the Snakemake Workflow project (no nf-core equivalent).
# Follows docs/design/phi-wrapper-agent-composition-design.md section 3.
id: local/modules/pysradb
name: pysradb
summary: Query SRA metadata (or search/download) with pysradb and save the result table.
params:
  command:
    kind: option
    type: string
    required: true
    description: pysradb subcommand, e.g. metadata, search.
  query:
    kind: option
    type: string
    required: true
    description: Accession or query string, e.g. SRP000001.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to the tool.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/pysradb
    primary: true
