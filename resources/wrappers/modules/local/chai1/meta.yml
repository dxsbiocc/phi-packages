name: chai1
description: Predict multi-modal biomolecular complex structures (proteins, nucleic acids, SMILES ligands) with Chai-1 from entity-tagged FASTA files or sequence-native TSV tables.
keywords:
  - protein-design
  - structure-prediction
  - chai1
  - folding
tools:
  - chai1:
      description: Chai-1 foundation model for biomolecular structure prediction.
      homepage: https://github.com/chaidiscovery/chai-lab
      licence:
        - Apache-2.0
input:
  - meta:
      type: map
      description: Sample or batch metadata map
  - inputs:
      type: file
      description: Optional Chai-1 entity-tagged FASTA file(s) or directory
  - sequences_tsv:
      type: file
      description: Optional sequence-native TSV/CSV table (e.g. from ligandmpnn)
  - cache_dir:
      type: directory
      description: Optional Chai-1 model weights cache directory (sets CHAI_DOWNLOADS_DIR)
  - target_sequence:
      type: string
      description: Optional target protein sequence appended when using sequences_tsv
  - ligand_smiles:
      type: string
      description: Optional ligand SMILES string appended when using sequences_tsv
  - use_msa_server:
      type: boolean
      description: Query ColabFold MSA server during prediction
  - use_templates_server:
      type: boolean
      description: Query template server during prediction
  - num_trunk_recycles:
      type: integer
      description: Number of trunk recycling iterations
  - num_diffn_samples:
      type: integer
      description: Number of diffusion samples per job
  - seed:
      type: integer
      description: Random seed for Chai-1 inference
output:
  - structures:
      type: file
      description: Top-ranked predicted mmCIF structure per design
  - metrics_tsv:
      type: file
      description: Standardized TSV table of Chai-1 aggregate_score, ptm, iptm, and clash flags
  - metrics_json:
      type: file
      description: JSON array of Chai-1 confidence metrics and lineage metadata
  - versions:
      type: file
      description: Software versions YAML
authors:
  - '@dengxsh'
maintainers:
  - '@dengxsh'
