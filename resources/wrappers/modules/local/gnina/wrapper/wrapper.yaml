# Agent-facing wrapper adapter for the local gnina module at ../main.nf.
# Follows docs/contracts/wrapper.md.
id: local/modules/gnina
name: GNINA Deep-Learning Molecular Docking
summary: CNN-rescored molecular docking with GNINA outputting SDF poses and a normalized score_table.tsv for chem_docking_eval.
params:
  id:
    kind: option
    type: string
    required: false
    description: Run identifier used as output filename prefix.
  receptor:
    kind: input
    type: file
    required: true
    description: Receptor structure file (.pdb or .pdbqt).
  ligands:
    kind: input
    type: file
    required: true
    description: Ligand library file (.sdf, .sdf.gz, .mol2, or .pdbqt).
  autobox_ligand:
    kind: input
    type: file
    required: false
    description: Optional reference co-crystal ligand for automatic pocket box sizing.
  center_x:
    kind: option
    type: number
    required: false
    description: Docking box center X coordinate (Angstrom).
  center_y:
    kind: option
    type: number
    required: false
    description: Docking box center Y coordinate (Angstrom).
  center_z:
    kind: option
    type: number
    required: false
    description: Docking box center Z coordinate (Angstrom).
  size_x:
    kind: option
    type: number
    required: false
    minimum: 1
    description: Docking box size along X (Angstrom).
  size_y:
    kind: option
    type: number
    required: false
    minimum: 1
    description: Docking box size along Y (Angstrom).
  size_z:
    kind: option
    type: number
    required: false
    minimum: 1
    description: Docking box size along Z (Angstrom).
  cnn_scoring:
    kind: option
    type: string
    required: false
    description: GNINA CNN scoring mode.
    enum:
      - rescore
      - all
      - none
      - refinement
  exhaustiveness:
    kind: option
    type: integer
    required: false
    minimum: 1
    description: Monte Carlo search exhaustiveness.
  num_modes:
    kind: option
    type: integer
    required: false
    minimum: 1
    description: Maximum binding modes saved per ligand.
  cpu_threads:
    kind: option
    type: integer
    required: false
    minimum: 1
    description: CPU thread count alongside GPU acceleration.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for docked SDF poses and score tables.
outputs:
  results:
    type: directory
    path: ${outdir}
    primary: true
