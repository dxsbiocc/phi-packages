# Agent-facing wrapper for the local dramv module at ../main.nf,
# ported from the Snakemake Workflow project (no nf-core equivalent).
# Follows docs/design/phi-wrapper-agent-composition-design.md section 3.
id: local/modules/dramv
name: DRAM-v
summary: Annotate viral contigs and AMGs with DRAM-v (annotate + distill) from VirSorter2 for-dramv inputs.
params:
  fasta:
    kind: input
    type: file
    required: true
    description: for-dramv viral FASTA (final-viral-combined-for-dramv.fa).
  affi:
    kind: input
    type: file
    required: true
    description: for-dramv affinity table (viral-affi-contigs-for-dramv.tab).
  config:
    kind: input
    type: file
    required: false
    description: DRAM export_config file with a configured AMG database.
  distill:
    kind: option
    type: boolean
    required: false
    description: Also run DRAM-v.py distill.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to the tool.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/dramv
    primary: true
