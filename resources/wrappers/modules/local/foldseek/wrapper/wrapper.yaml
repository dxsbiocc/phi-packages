# Agent-facing wrapper adapter for the local foldseek module at ../main.nf.
# Follows docs/contracts/wrapper.md.
id: local/modules/foldseek
name: Foldseek Structure Search and Clustering
summary: Run Foldseek easy-cluster to dereplicate designed structures into cluster_id groups (compatible with DESIGN_FILTER) or easy-search to measure structural novelty against a target database.
params:
  structures:
    kind: input
    type: path_glob
    required: true
    description: Input designed PDB/mmCIF structure file(s) or directory.
  target_db:
    kind: input
    type: path
    required: false
    description: Target Foldseek database path or directory of reference structures (required when mode is 'search').
  mode:
    kind: option
    type: string
    required: false
    description: Foldseek mode ('cluster' for structural clustering or 'search' for database novelty search).
    enum:
      - cluster
      - search
  evalue:
    kind: option
    type: number
    required: false
    minimum: 0
    description: E-value cutoff used by easy-search (default 0.01).
  coverage:
    kind: option
    type: number
    required: false
    minimum: 0
    maximum: 1
    description: Minimum alignment coverage fraction (-c) used by easy-cluster (default 0.8).
  tmscore_threshold:
    kind: option
    type: number
    required: false
    minimum: 0
    maximum: 1
    description: TM-score threshold (--tmscore-threshold) used by easy-cluster (default 0.6).
  novelty_tm_cutoff:
    kind: option
    type: number
    required: false
    minimum: 0
    maximum: 1
    description: Alignment TM-score below which a design is flagged is_novel=true in search mode (default 0.5).
  args:
    kind: option
    type: string
    required: false
    description: Extra CLI flags forwarded to foldseek.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for Foldseek search/cluster tables.
outputs:
  foldseek:
    type: directory
    path: ${outdir}/foldseek
    primary: true
