name: foldseek
description: Fast protein structure novelty search (easy-search) against PDB/AFDB or structural clustering and dereplication (easy-cluster) with Foldseek.
keywords:
  - protein-design
  - structural-biology
  - foldseek
  - clustering
  - novelty
tools:
  - foldseek:
      description: Foldseek fast and sensitive protein structure search and clustering.
      homepage: https://github.com/steineggerlab/foldseek
      licence:
        - GPL-3.0
input:
  - meta:
      type: map
      description: Sample or batch metadata map
  - structures:
      type: file
      description: Input designed PDB/mmCIF structure files or directory
  - target_db:
      type: path
      description: Target Foldseek database or reference structure directory (required for mode=search)
  - mode:
      type: string
      description: Execution mode ('cluster' for structural dereplication or 'search' for novelty search)
  - evalue:
      type: float
      description: E-value cutoff for easy-search
  - coverage:
      type: float
      description: Minimum alignment coverage (-c) for easy-cluster
  - tmscore_threshold:
      type: float
      description: TM-score clustering threshold (--tmscore-threshold) for easy-cluster
  - novelty_tm_cutoff:
      type: float
      description: TM-score threshold below which designs are marked is_novel=true in search mode
output:
  - metrics_tsv:
      type: file
      description: Standardized per-design Foldseek search or cluster_id table
  - metrics_json:
      type: file
      description: JSON array of compiled Foldseek metrics
  - raw_tsv:
      type: file
      description: Raw Foldseek easy-search hits or easy-cluster _clu.tsv
  - versions:
      type: file
      description: Software versions YAML
authors:
  - '@dengxsh'
maintainers:
  - '@dengxsh'
