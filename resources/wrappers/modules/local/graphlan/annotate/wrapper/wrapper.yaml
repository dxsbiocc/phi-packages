# Agent-facing wrapper for the local graphlan/annotate module at ../main.nf,
# ported from the Snakemake Workflow project (no nf-core equivalent).
# Follows docs/design/phi-wrapper-agent-composition-design.md section 3.
id: local/modules/graphlan-annotate
name: graphlan annotate
summary: Apply a GraPhlAn annotation file to a phylogenetic tree.
params:
  tree:
    kind: input
    type: file
    required: true
    description: Input tree (Newick or GraPhlAn XML).
  annotation:
    kind: input
    type: file
    required: true
    description: GraPhlAn annotation file.
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to the tool.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/graphlan_annotate
    primary: true
