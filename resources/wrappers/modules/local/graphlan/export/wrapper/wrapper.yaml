# Agent-facing wrapper for the local graphlan/export module at ../main.nf,
# ported from the Snakemake Workflow project (no nf-core equivalent).
# Follows docs/design/phi-wrapper-agent-composition-design.md section 3.
id: local/modules/graphlan-export
name: export2graphlan
summary: Convert a taxonomy abundance table into a GraPhlAn tree + annotation.
params:
  taxonomy:
    kind: input
    type: file
    required: true
    description: Taxonomy abundance table (e.g. MetaPhlAn profile).
  args:
    kind: option
    type: string
    required: false
    description: Extra command-line arguments passed to the tool.
  outdir:
    kind: output
    type: path
    required: true
    description: Output directory for the results.
outputs:
  output:
    type: directory
    path: ${outdir}/graphlan_export
    primary: true
