<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- Axes -->
  <path d="M12 14 V50 H52" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Low-risk Kaplan-Meier step curve -->
  <path d="M12 18 H24 V23 H36 V29 H50" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- High-risk Kaplan-Meier step curve -->
  <path d="M12 18 H19 V29 H27 V39 H38 V46 H50" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Restricted cubic spline / ROC accent -->
  <path d="M14 48 C22 34, 34 24, 50 18" stroke="#10B981" stroke-width="2.0" stroke-dasharray="3 3" stroke-linecap="round"/>
  <!-- Censoring tick marks -->
  <line x1="30" y1="20.5" x2="30" y2="25.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="26.5" x2="44" y2="31.5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="36.5" x2="33" y2="41.5" stroke="#F43F5E" stroke-width="2" stroke-linecap="round"/>
</svg>
