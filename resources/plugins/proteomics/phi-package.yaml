schemaVersion: 1
id: proteomics
type: plugin
version: 0.1.0
title: Proteomics
summary: >-
  Downstream quantitative MS-based proteomics and PTM/phosphoproteomics in
  Python (prot_): DIA-NN / MaxQuant / FragPipe matrix inspection (contaminant,
  reverse, scale, missingness, and design checks), median/quantile
  normalization and Perseus-style MinProb/kNN imputation with PCA/CV QC,
  empirical-Bayes moderated t-test differential abundance, PTM protein-abundance
  normalization and Kinase-Substrate Enrichment Analysis (KSEA), offline
  detected-proteome ORA/GSEA, and co-abundance hub network analysis. Raw
  spectrum search/quantification (quantms / DIA-NN / MaxQuant / FragPipe) runs
  upstream.
toolPrefix: prot
components:
  agents:
    - agents/Proteomics.md
  skills:
    - skills/proteomics-workflow
environments:
  proteomics:
    spec: environments/proteomics/environment.yml
