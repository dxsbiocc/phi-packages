schemaVersion: 1
id: literature-library
type: plugin
version: 0.7.0
title: Literature Library
summary: >-
  Project-level literature library: search PubMed, Europe PMC, OpenAlex and
  other open sources, import BibTeX/RIS/PDF, deduplicate, export citations,
  and compile saved papers into a wiki. No API keys, no embeddings.
toolPrefix: lit
components:
  agents:
    - agents/LiteratureLibrary.md
  skills:
    - skills/manage-library
    - skills/compile-wiki
# No environments: skills use phi:python@1.
