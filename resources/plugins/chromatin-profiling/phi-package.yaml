schemaVersion: 1
id: chromatin-profiling
type: plugin
version: 0.1.0
title: Chromatin Profiling (ChIP/CUT&Tag)
summary: >-
  Downstream bulk ChIP-seq/CUT&Tag/CUT&RUN analysis in R/Bioconductor (chip_),
  privately locked. From peaks, counts, BAMs or bigWigs: FRiP and replicate QC,
  consensus peaksets, read counting, DiffBind (DESeq2/edgeR) or csaw, ChIPseeker
  annotation, PCA/UpSet. No alignment or peak calling.
toolPrefix: chip
components:
  agents:
    - agents/ChromatinProfiling.md
  skills:
    - skills/chromatin-workflow
environments:
  chip:
    spec: environments/chip/environment.yml