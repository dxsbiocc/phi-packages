name: methylation
description: >-
  Private DNA methylation downstream environment: Python 3.13 +
  pandas/numpy/scipy/scikit-learn/matplotlib-base for WGBS/RRBS/EM-seq coverage
  merging, beta/M-value QC, empirical-Bayes DMC & Stouffer DMR calling, and
  GTF/CpG-island annotation.
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - matplotlib-base
