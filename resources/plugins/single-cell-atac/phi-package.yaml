schemaVersion: 1
id: single-cell-atac
type: plugin
version: 0.2.0
title: Single-cell ATAC
summary: >-
  scATAC analysis in Python/snapatac2 + scanpy (scatac_), privately locked.
  From 10x fragments or peak/tile matrices: QC (TSSe, doublets), clustering,
  MACS3 peaks, markers, gene activity, motif enrichment, chromVAR TF
  deviations and Peak-to-Gene links.
toolPrefix: scatac
components:
  agents:
    - agents/SingleCellAtac.md
  skills:
    - skills/scatac-workflow
environments:
  scatac:
    spec: environments/scatac/environment.yml