schemaVersion: 1
id: single-cell-atac
type: plugin
version: 0.1.3
title: Single-cell ATAC
summary: >-
  scATAC analysis in Python/snapatac2 + scanpy (scatac_), privately locked. From
  10x fragments or peak/tile matrices: QC (TSSe, fragments, doublets), scrublet,
  spectral embedding, Leiden/UMAP, per-cluster peak calling, markers, gene
  activity, label transfer, motif enrichment and integration.
toolPrefix: scatac
components:
  agents:
    - agents/SingleCellAtac.md
  skills:
    - skills/scatac-workflow
environments:
  scatac:
    spec: environments/scatac/environment.yml