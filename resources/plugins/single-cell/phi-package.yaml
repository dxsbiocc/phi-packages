schemaVersion: 1
id: single-cell
type: plugin
version: 0.6.0
title: Single-cell Analysis
summary: >-
  Two parallel single-cell toolchains: R/Seurat 6 (sc_) and Python/scanpy 1.13
  (sc_py_), each privately locked. A shared fragment library is the only input
  for scripts and notebooks; QC, clustering, integration, markers, annotation
  and pseudobulk mirror both routes, plus PAGA and pseudotime in Python.
toolPrefix: sc
components:
  agents:
    - agents/SingleCell.md
  skills:
    - skills/seurat-workflow
    - skills/scanpy-workflow
environments:
  seurat:
    spec: environments/seurat/environment.yml
  scanpy:
    spec: environments/scanpy/environment.yml
