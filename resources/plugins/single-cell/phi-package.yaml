schemaVersion: 1
id: single-cell
type: plugin
version: 0.8.0
title: Single-cell
summary: >-
  Two parallel single-cell toolchains: R/Seurat 6 (sc_) and Python/scanpy 1.13
  (sc_py_), privately locked. Both routes cover QC, clustering, markers,
  annotation, pseudobulk and L-R communication, plus PAGA trajectory and
  AUCell/ULM TF regulons in Python.
toolPrefix: sc
components:
  agents:
    - agents/SingleCell.md
  skills:
    - skills/seurat-workflow
    - skills/scanpy-workflow
environments:
  seurat:
    spec: environments/seurat/environment.yml
  scanpy:
    spec: environments/scanpy/environment.yml
