<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- Volcano / differential expression axes -->
  <line x1="12" y1="49" x2="52" y2="49" stroke="#475569" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="15" x2="32" y2="49" stroke="#334155" stroke-width="1.8" stroke-dasharray="3 3" stroke-linecap="round"/>
  <!-- Significance threshold line -->
  <line x1="14" y1="34" x2="50" y2="34" stroke="#64748B" stroke-width="1.5" stroke-dasharray="2.5 2.5" stroke-linecap="round"/>
  <!-- Non-significant background genes -->
  <circle cx="28" cy="43" r="2.2" fill="#64748B"/>
  <circle cx="32" cy="40" r="2.2" fill="#64748B"/>
  <circle cx="36" cy="44" r="2.2" fill="#64748B"/>
  <circle cx="25" cy="39" r="2.0" fill="#64748B"/>
  <circle cx="39" cy="39" r="2.0" fill="#64748B"/>
  <!-- Downregulated genes (sky/cyan left wing) -->
  <circle cx="19" cy="27" r="3.0" fill="#38BDF8"/>
  <circle cx="16" cy="20" r="3.4" fill="#22D3EE"/>
  <circle cx="23" cy="22" r="2.6" fill="#7DD3FC"/>
  <!-- Upregulated genes (rose/coral right wing) -->
  <circle cx="45" cy="26" r="3.0" fill="#FB7185"/>
  <circle cx="48" cy="18" r="3.6" fill="#F43F5E"/>
  <circle cx="41" cy="21" r="2.6" fill="#FDA4AF"/>
  <!-- GSEA enrichment running-sum wave accent at top -->
  <path d="M14 14C20 14 23 10 29 11C35 12 39 17 50 13" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
</svg>
