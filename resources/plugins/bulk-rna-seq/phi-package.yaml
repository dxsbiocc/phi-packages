schemaVersion: 1
id: bulk-rna-seq
type: plugin
version: 0.4.0
title: Bulk RNA-seq
summary: >-
  Downstream bulk RNA-seq workflow (rna_): GEO/ID bridging, matrix/DE QC & PCA,
  multi-contrast DEGs, ORA/GSEA/pathway scores, ULM/MLM TF/pathway regulons,
  rMATS/SUPPA2 alternative splicing, WGCNA co-expression modules, and
  ESTIMATE/NNLS TME deconvolution.
toolPrefix: rna
components:
  agents:
    - agents/BulkRnaSeq.md
  skills:
    - skills/rnaseq-workflow
environments:
  rnaseq:
    spec: environments/rnaseq/environment.yml
