schemaVersion: 1
id: bulk-rna-seq
type: plugin
version: 0.3.0
title: Bulk RNA-seq
summary: >-
  Downstream bulk RNA-seq workflow (rna_): GEO Series Matrix import, Ensembl/GTF
  ID mapping, matrix/DE inspection, sample QC/PCA, multi-contrast DEG
  comparison, ORA, pre-ranked GSEA, pathway scoring, WGCNA-style co-expression
  modules & hubs, and ESTIMATE/NNLS TME immune deconvolution.
toolPrefix: rna
components:
  agents:
    - agents/BulkRnaSeq.md
  skills:
    - skills/rnaseq-workflow
environments:
  rnaseq:
    spec: environments/rnaseq/environment.yml
