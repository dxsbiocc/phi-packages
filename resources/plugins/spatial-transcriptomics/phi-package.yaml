schemaVersion: 1
id: spatial-transcriptomics
type: plugin
version: 0.1.0
title: Spatial Transcriptomics Analysis
summary: >-
  Spatial transcriptomics (scanpy/squidpy/spatialdata, st_py_) in a private
  locked environment. Covers 10x Visium incl. HD and BGI Stereo-seq (GEM/GEF,
  bin/cellbin): QC, normalisation/PCA/clustering/UMAP, markers, SVGs, niche
  enrichment, deconvolution, cell communication and cross-sample differences.
toolPrefix: st
components:
  agents:
    - agents/SpatialTranscriptomics.md
  skills:
    - skills/spatial-workflow
environments:
  spatial:
    spec: environments/spatial/environment.yml