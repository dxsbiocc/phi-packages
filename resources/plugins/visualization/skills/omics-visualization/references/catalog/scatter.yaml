family: "scatter"
preview_background: "transparent"  # PNG alpha is empty; dark UIs look black. Do not treat as a black canvas.

templates:
  - id: "scatter-basic"
    title: "Basic scatter plot"
    aliases:
      - "散点图"
      - "xy scatter"
      - "基础散点"
      - "边际rug散点"
      - "axis rug scatter"
    source: "scripts/scatter/basic/plot.R"
    examples:
      - "scripts/scatter/basic/example.tsv"
      - "scripts/scatter/basic/example_rug.tsv"
    preview: "scripts/scatter/basic/preview.png"
    variants:
      - image: "scripts/scatter/basic/preview_rug.png"
        example: "scripts/scatter/basic/example_rug.tsv"
        config: "style = \"rug\", columns x/y = wt/mpg, rug$x = \"Qualitative.Bold:3\", rug$y = \"Qualitative.Bold:7\", rug$point = \"Qualitative.Safe:12\""
        shows: "Scatter with thick catalog-coloured marginal rugs on the bottom (x) and left (y) axes; rugs are a display of the supplied margins."
    use_when: >
      Plot two numeric variables against each other with no grouping,
      trend overlay, or extra encodings. With style = "rug", add
      coloured marginal rugs on the x and y axes.
    avoid_when: >
      Do not use when points need grouping, size encoding, density,
      a statistical overlay, or SVG glyphs (use scatter-group, bubble,
      hex, correlation, or scatter-svg). Grouped histogram rugs are
      scatter-hist-rug. Marginal boxplots are scatter-marginal.
    input_shape: "one row per observation; two numeric columns"
    language: "r"
    status: "stable"

  - id: "scatter-hist-rug"
    title: "Grouped density histogram with rugs"
    aliases:
      - "分组直方图rug"
      - "边际分布rug图"
      - "histogram with rugs"
      - "grouped hist rug"
    source: "scripts/scatter/hist_rug/plot.R"
    examples:
      - "scripts/scatter/hist_rug/example.tsv"
    preview: "scripts/scatter/hist_rug/preview.png"
    use_when: >
      Overlay density histograms for a numeric value across categories
      and draw one rug row per category under the x axis (continent
      life-expectancy style). Palette is CONFIG.
    avoid_when: >
      Do not use plain axis rugs on an x-y scatter (scatter-basic
      style = rug), a plain / stacked / freqpoly histogram
      (scatter-hist), marginal boxplots (scatter-marginal), or 2D
      density panels (scatter-density2d). Do not run density tests
      in the script.
    input_shape: "one row per observation; numeric value plus group"
    language: "r"
    status: "stable"

  - id: "scatter-hist"
    title: "1D histogram / frequency polygon"
    aliases:
      - "直方图"
      - "freqpoly"
      - "频率多边形"
      - "堆积直方图"
      - "镜像直方图"
      - "分面叠加直方图"
      - "histogram"
    source: "scripts/scatter/hist/plot.R"
    examples:
      - "scripts/scatter/hist/example.tsv"
      - "scripts/scatter/hist/example_mirror.tsv"
      - "scripts/scatter/hist/example_overlay.tsv"
      - "scripts/scatter/hist/example_facet_overlay.tsv"
    preview: "scripts/scatter/hist/preview.png"
    variants:
      - image: "scripts/scatter/hist/preview_stack.png"
        example: "scripts/scatter/hist/example.tsv"
        config: "columns x = \"price\", group = \"cut\", bins = 40, position = \"stack\", group_order = Fair..Ideal"
        shows: "Stacked histogram of price filled by diamond cut, thin white bar borders."
      - image: "scripts/scatter/hist/preview_freqpoly.png"
        example: "scripts/scatter/hist/example.tsv"
        config: "geom = \"freqpoly\", columns x = \"price\", group = \"cut\", y_stat = \"density\", bins = 40"
        shows: "Frequency polygons of price by cut on a density scale for shape comparison."
      - image: "scripts/scatter/hist/preview_facet.png"
        example: "scripts/scatter/hist/example.tsv"
        config: "columns x = \"price\", group = \"cut\", facet = TRUE, facet_scales = \"free_y\", bins = 40"
        shows: "One histogram panel per cut with free y so the small Fair group stays readable."
      - image: "scripts/scatter/hist/preview_overlay.png"
        example: "scripts/scatter/hist/example_overlay.tsv"
        config: "columns x = \"value\", group = \"type\", position = \"identity\", palette = \"Qualitative.Set1 / 9\""
        shows: "Overlapping identity histograms for two named series."
      - image: "scripts/scatter/hist/preview_facet_overlay.png"
        example: "scripts/scatter/hist/example_facet_overlay.tsv"
        config: "columns x/group/facet = photons/series/prepared, position = \"identity\", facet = TRUE, facet_title = \"inset\", tick_direction = \"in\", facet_nrow/ncol = 2"
        shows: "2×2 panels of overlapping identity histograms with coloured inset titles and inward ticks."
      - image: "scripts/scatter/hist/preview_mirror.png"
        example: "scripts/scatter/hist/example_mirror.tsv"
        config: "layout = \"mirror\", columns a/b = var1/var2"
        shows: "Mirrored histograms: one series up, one down, catalog teal / indigo fills."
    use_when: >
      Show a 1D histogram or frequency polygon of a numeric value,
      optionally by group (stack / identity), faceted, horizontal, or
      as a mirrored pair. A separate facet column with identity
      overlays and inset coloured titles is CONFIG.
    avoid_when: >
      Do not use when rugs under grouped density histograms are
      required (scatter-hist-rug), when the claim is a 1D kernel
      density (scatter-density1d), or ridgelines (line-ridge).
      Do not add an id for facet-plus-overlay alone.
    input_shape: "one row per observation; numeric value, optional group and facet; mirror uses two numeric columns"
    language: "r"
    status: "stable"

  - id: "scatter-density1d"
    title: "1D kernel density"
    aliases:
      - "一维密度图"
      - "密度曲线"
      - "堆积密度图"
      - "镜像密度图"
      - "效应量密度对比"
      - "geom_density"
      - "1D density"
    source: "scripts/scatter/density1d/plot.R"
    examples:
      - "scripts/scatter/density1d/example.tsv"
      - "scripts/scatter/density1d/example_mirror.tsv"
      - "scripts/scatter/density1d/example_effect.tsv"
    preview: "scripts/scatter/density1d/preview.png"
    variants:
      - image: "scripts/scatter/density1d/preview_group.png"
        example: "scripts/scatter/density1d/example.tsv"
        config: "columns x = \"depth\", group = \"cut\", alpha = 0.15, xlim = c(55, 70)"
        shows: "Overlapping filled densities of depth by cut."
      - image: "scripts/scatter/density1d/preview_stack.png"
        example: "scripts/scatter/density1d/example.tsv"
        config: "columns x = \"carat\", group = \"cut\", position = \"stack\", y_stat = \"count\""
        shows: "Stacked density scaled to count by cut."
      - image: "scripts/scatter/density1d/preview_fill.png"
        example: "scripts/scatter/density1d/example.tsv"
        config: "columns x = \"carat\", group = \"cut\", position = \"fill\", y_stat = \"count\", xlim = c(0.2, 2.5)"
        shows: "Percent (conditional) density: share of each cut across carat, clipped to the well-sampled range."
      - image: "scripts/scatter/density1d/preview_facet.png"
        example: "scripts/scatter/density1d/example.tsv"
        config: "columns x = \"price\", group = \"cut\", facet = TRUE, alpha = 0.6"
        shows: "One filled density panel per cut on a shared y scale."
      - image: "scripts/scatter/density1d/preview_effect.png"
        example: "scripts/scatter/density1d/example_effect.tsv"
        config: "layout = \"effect\", series/facet columns, palettes reference = Pastel grey + case = Bold blue/gold/pink, annotations_effect.tsv"
        shows: "Stacked panels of shared grey reference vs panel-coloured case densities, mode lines, and supplied n / d / P notes."
      - image: "scripts/scatter/density1d/preview_mirror.png"
        example: "scripts/scatter/density1d/example_mirror.tsv"
        config: "layout = \"mirror\", columns a/b = var1/var2"
        shows: "Mirrored densities for two series."
    use_when: >
      Show a 1D kernel density of a numeric value, optionally by group
      with identity / stack / fill position, faceted, mirrored, or as
      effect panels (shared reference vs coloured case). Bandwidth
      adjust and supplied annotations are CONFIG.
    avoid_when: >
      Do not use histograms / freqpoly (scatter-hist), ridgelines
      (line-ridge), or 2D densities (scatter-density2d). The density
      is a display smooth, not a test. Do not compute Cohen's d or P
      in the script; annotation text is supplied.
    input_shape: "one row per observation; numeric value, optional group; effect uses series+facet; mirror uses two numeric columns; optional annotations.tsv"
    language: "r"
    status: "stable"

  - id: "scatter-group"
    title: "Grouped scatter plot"
    aliases:
      - "分组散点图"
      - "分类散点"
    source: "scripts/scatter/group/plot.R"
    examples:
      - "scripts/scatter/group/example.tsv"
    preview: "scripts/scatter/group/preview.png"
    use_when: >
      Color points by a categorical group in the same x-y plane.
    avoid_when: >
      Do not use for a single series, when marks must be a supplied SVG
      glyph (use scatter-svg),       when group structure is a linear fit
      plus margins (use scatter-marginal), when overall and per-group
      fits with equation labels are needed (use scatter-fit-group),
      when groups should fill Voronoi tiles (use scatter-voronoi),
      when component scores are split by block and status with a
      supplied class background (use scatter-variate-panel),
      when a supplied UMAP sits in a circos composition ring
      (use scatter-umap-circos), when an embedding needs an aligned
      radial cluster hierarchy and four corner annotation views
      (use scatter-umap-atlas), when a supplied UMAP needs dashed
      density outlines, numbered badges, and a matching marker-gene
      dot plot (use scatter-umap-dot), when position is a
      three-part composition (use scatter-ternary), or when many
      groups overlap and each needs its own panel against grey
      context (use scatter-highlight).
    input_shape: "one row per observation; two numeric columns plus a group label"
    language: "r"
    status: "stable"

  - id: "scatter-highlight"
    title: "Small-multiple highlight scatter"
    aliases:
      - "分面高亮散点"
      - "高亮分面图"
      - "灰色背景分面"
      - "gghighlight"
      - "highlight facet"
    source: "scripts/scatter/highlight/plot.R"
    examples:
      - "scripts/scatter/highlight/example.tsv"
    preview: "scripts/scatter/highlight/preview.png"
    use_when: >
      Show each group in its own panel, coloured on top of all other
      observations in grey, so each group is read against the whole
      distribution. Use when many groups would overlap in one panel.
      Strip colour matching the group, background colour, ncol, and
      free scales are CONFIG.
    avoid_when: >
      Do not use for a few well-separated groups in one plane
      (scatter-group), group outlines (scatter-contour), or a zoom
      window (scatter-zoom). Do not cluster in the script.
    input_shape: "one row per observation; two numeric columns plus a group label"
    language: "r"
    status: "stable"

  - id: "scatter-ternary"
    title: "Ternary composition scatter"
    aliases:
      - "三元图"
      - "三元相图"
      - "ternary plot"
      - "simplex scatter"
    source: "scripts/scatter/ternary/plot.R"
    examples:
      - "scripts/scatter/ternary/example.tsv"
    preview: "scripts/scatter/ternary/preview.png"
    use_when: >
      Place each observation in a three-component simplex: position is
      the relative contribution of three supplied non-negative scores
      (lineage, helper-state, compartment, treatment). Discrete or
      continuous colour, and optional size, stay in CONFIG.
      Discrete groups that name a vertex (or sit on one) inherit that
      vertex colour; pairwise and interior groups use the matching mix.
    avoid_when: >
      Do not use Cartesian x-y scatter (scatter-group), a pie or doughnut
      of one composition (pie-*), or ternary density / percentile bands.
      Do not compute lineage scores, NMF, relative abundance, enrichment,
      or absorption probabilities in the script. Closing a + b + c to 1
      is a display transform. Colour mode and size are not a second id.
    input_shape: "one row per observation; three non-negative numeric components; optional colour and size"
    language: "r"
    status: "stable"

  - id: "scatter-umap-circos"
    title: "UMAP in a circos composition ring"
    aliases:
      - "环形UMAP"
      - "UMAP circos"
      - "UMAP环图"
      - "circos UMAP"
      - "plot1cell"
      - "plot1cell composition"
      - "UMAP Group orig.ident"
    source: "scripts/scatter/umap_circos/plot.R"
    examples:
      - "scripts/scatter/umap_circos/example.tsv"
    preview: "scripts/scatter/umap_circos/preview.png"
    use_when: >
      Show a supplied UMAP embedding in the hole of a circos whose
      sectors are cell types, with a cell-count axis, a celltype colour
      strip, and stacked-proportion rings for extra categorical columns.
      Extra metadata rings and log10 vs linear polar scale are CONFIG.
      A plot1cell-style embedding with Group / orig.ident composition
      rings, without a supplied radial hierarchy and corner views,
      belongs here.
    avoid_when: >
      Do not use a plain grouped scatter (scatter-group) or a circos
      doughnut without an embedding (pie-doughnut-bar). Do not run
      UMAP, PCA, or clustering in the script. Do not read a Seurat
      object or wrap plot1cell. Do not add an id per extra track.
      A few hundred cells with no composition rings stay on
      scatter-group. A numbered UMAP with density outlines and a
      marker-gene dot plot is scatter-umap-dot.
      A supplied radial cluster hierarchy aligned to annotation rings,
      cell-count bars, a centre embedding, and four corner recolourings
      is scatter-umap-atlas. A tree without an embedding is tree-cell-ring.
    input_shape: "one row per cell; umap_1, umap_2, Celltype, plus optional categorical track columns"
    language: "r"
    status: "stable"

  - id: "scatter-umap-atlas"
    title: "Single-cell atlas with radial cluster hierarchy"
    aliases:
      - "单细胞图谱圈中圈"
      - "UMAP环形聚类树"
      - "single cell atlas"
      - "radial cluster hierarchy"
      - "plot1cell atlas"
      - "UMAP大类亚群双环"
      - "UMAP Class/Subtype 双环"
      - "Class/Subtype double-ring UMAP"
    source: "scripts/scatter/umap_atlas/plot.R"
    examples:
      - "scripts/scatter/umap_atlas/example.tsv"
      - "scripts/scatter/umap_atlas/clusters.tsv"
      - "scripts/scatter/umap_atlas/hierarchy.tsv"
      - "scripts/scatter/umap_atlas/class_subtype/example.tsv"
      - "scripts/scatter/umap_atlas/class_subtype/clusters.tsv"
      - "scripts/scatter/umap_atlas/class_subtype/hierarchy.tsv"
    preview: "scripts/scatter/umap_atlas/preview.png"
    variants:
      - image: "scripts/scatter/umap_atlas/preview_celltype.png"
        example: "scripts/scatter/umap_atlas/example.tsv"
        config: "contour$scope = \"celltype\", contour$grid = 100, contour$peak_fraction = 0.18"
        shows: "Separate density outlines by Celltype, with the same embedding points and atlas rings."
      - image: "scripts/scatter/umap_atlas/preview_class_subtype.png"
        example: "scripts/scatter/umap_atlas/class_subtype/example.tsv"
        config: "Rscript plot.R --class-subtype class_subtype/example.tsv output.png"
        shows: "Class-coloured embedding with individual Class outlines, a supplied radial tree, and labelled inner Class and outer Subtype rings."
    use_when: >
      Show a supplied embedding at the centre of a radial cluster
      hierarchy whose leaves align with cluster annotation rings,
      Group / orig.ident proportions, and outer cell-count bars.
      A shared kernel density estimate uses all embedding coordinates,
      so neighbouring clouds can share an outline while points retain
      their Celltype colours. Per-Celltype contours are a CONFIG variant.
      Four corner views recolour the same supplied coordinates by
      Region, Marker category, CycleScore, and Pseudoage. The cluster
      order, tree topology, node heights, annotations, and counts are
      supplied. Counts are checked against the input cells. The
      Class/Subtype double-ring variant uses the same tree geometry.
      Each Subtype corresponds to one leaf and belongs to one Class.
    avoid_when: >
      A simple plot1cell-style UMAP with categorical composition rings
      uses scatter-umap-circos; plot1cell alone does not imply this atlas.
      A circular annotation tree without an embedding is tree-cell-ring.
      A numbered embedding paired with marker-gene dots is scatter-umap-dot.
      Do not compute UMAP, PCA, clustering, cluster distances, nearest-
      neighbour pseudoage, marker expression, or biological annotations
      in the script, or fetch a Seurat object or external atlas data.
    input_shape: >
      Default cell rows use cell_id, umap_1, umap_2, cluster, Celltype,
      Region, Group, orig.ident, Marker, CycleScore, and Pseudoage.
      Default clusters.tsv uses cluster, Celltype, order, Region, Age,
      CycleScore, and count. The --class-subtype variant uses cell_id,
      umap_1, umap_2, Subtype, and Class in the cell table, with Subtype,
      Class, order, and count in clusters.tsv. Both use hierarchy.tsv
      (node, parent, height) with one root, exact leaf IDs, monotone
      heights, and contiguous subtrees in the supplied leaf order.
    language: "r"
    status: "stable"

  - id: "scatter-umap-dot"
    title: "UMAP with marker-gene dot plot"
    aliases:
      - "UMAP气泡图"
      - "UMAP标记基因"
      - "细胞类型点图"
      - "marker dot plot"
    source: "scripts/scatter/umap_dot/plot.R"
    examples:
      - "scripts/scatter/umap_dot/umap.tsv"
      - "scripts/scatter/umap_dot/dots.tsv"
    preview: "scripts/scatter/umap_dot/preview.png"
    use_when: >
      Show a supplied embedding above a marker-gene dot plot that
      shares the same cluster numbers and colours. Each cluster has a
      dashed density outline and a numbered badge. Dot size is percent
      expressing and fill is within-gene scaled average expression.
      Each gene group is a facet, with a bracket over its genes.
    avoid_when: >
      Do not use a plain grouped scatter (scatter-group) or an
      enrichment term dotplot (bar-enrichment-dot). Do not use a UMAP
      inside a composition ring (scatter-umap-circos), or an embedding
      with a radial cluster hierarchy and corner annotation views
      (scatter-umap-atlas). Do not run UMAP, PCA,
      clustering, or Seurat in the script. Do not compute percent
      expressing or mean expression here.
    input_shape: "embedding rows cell, umap_1, umap_2, celltype; dot rows celltype, gene, group, pct, avg"
    language: "r"
    status: "stable"

  - id: "scatter-voronoi"
    title: "Voronoi scatter"
    aliases:
      - "泰森多边形"
      - "Voronoi"
      - "地盘散点"
    source: "scripts/scatter/voronoi/plot.R"
    examples:
      - "scripts/scatter/voronoi/example.tsv"
      - "scripts/scatter/voronoi/boundary.tsv"
    preview: "scripts/scatter/voronoi/preview.png"
    variants:
      - image: "scripts/scatter/voronoi/preview_radius.png"
        example: "scripts/scatter/voronoi/example.tsv"
        config: "max_radius = 1.1"
        shows: "Each cell clipped to a radius around its point: sparse points become rounded islands, dense clusters stay tiled."
      - image: "scripts/scatter/voronoi/preview_bound.png"
        example: "scripts/scatter/voronoi/boundary.tsv"
        config: "bound = \"boundary.tsv\" (supplied x, y polygon beside the input; \"hull\" = convex hull of the points), dashed outline drawn"
        shows: "Tiles clipped to a supplied outline (e.g. tissue boundary) instead of the bounding rectangle."
      - image: "scripts/scatter/voronoi/preview_delaunay.png"
        example: "scripts/scatter/voronoi/example.tsv"
        config: "overlay = \"delaunay\" (or \"delaunay_only\" for no tiles), delaunay_max_edge = 2.2"
        shows: "Delaunay triangulation (neighbour graph) over the tiles, long hull edges dropped by a length cut-off."
    use_when: >
      Fill the plane around supplied x-y points with nearest-site
      Voronoi tiles coloured by a supplied group. Overlay the points.
      Radius clip, hull / supplied-outline bound, unit-scaled
      tessellation (normalize), cell edges and a Delaunay neighbour
      overlay are CONFIG variants, not new ids.
    avoid_when: >
      Do not use a plain grouped scatter (scatter-group), a convex-hull
      outline (scatter-contour), or hex bins (scatter-hex). Do not run
      PCA, UMAP, or clustering in the script. An sPLS-DA max.dist
      class background behind faceted component scores is
      scatter-variate-panel, not tiles computed from the points.
      max.radius, expand, and corner radius stay in CONFIG. Tile area
      is not density.
    input_shape: "one row per observation; two numeric columns plus a group label"
    language: "r"
    status: "stable"

  - id: "scatter-variate-panel"
    title: "Faceted X-variate scatter with class background"
    aliases:
      - "X-variate图"
      - "潜变量分面散点"
      - "PLS个体图"
      - "plotIndiv"
      - "多组学背景散点"
      - "时间轨迹潜变量"
    source: "scripts/scatter/variate_panel/plot.R"
    examples:
      - "scripts/scatter/variate_panel/example.tsv"
      - "scripts/scatter/variate_panel/background.tsv"
      - "scripts/scatter/variate_panel/example_X.tsv"
      - "scripts/scatter/variate_panel/example_samples.tsv"
    preview: "scripts/scatter/variate_panel/preview.png"
    use_when: >
      Show component scores from one (s)PLS-DA per block and status.
      Time is colour and shape together, each panel states that model's
      explained-variance percent, and the background is the max.dist
      class polygons (the class with the largest linear score).
      prepare.R fits the model and writes both tables. Optional
      label_x and label_y place sample names.
    avoid_when: >
      Do not use a plain grouped scatter (scatter-group) or nearest-site
      tiles computed from the points (scatter-voronoi). Do not use
      Zi–Pi role rectangles (scatter-zipi) or a pathway enrichment
      facet (scatter-pathway-facet). plot.R does not fit PLS-DA;
      prepare.R does, from a feature matrix and a sample table.
    input_shape: >
      scores: one row per sample with label, x, y, time, block, status,
      expl_x, expl_y; optional label_x, label_y. background: one row per
      polygon vertex with block, status, class, region, ord, x, y.
      class is the predicted time. Source matrices are example_X.tsv
      and example_samples.tsv.
    language: "r"
    status: "stable"

  - id: "scatter-bubble"
    title: "Bubble scatter plot"
    aliases:
      - "气泡图"
      - "bubble chart"
      - "GNI coverage bubble"
      - "income group bubble"
      - "fractions per year bubble"
      - "methane invention bubble"
      - "emission share bubble"
      - "ISO country bubble"
    source: "scripts/scatter/bubble/plot.R"
    examples:
      - "scripts/scatter/bubble/example.tsv"
      - "scripts/scatter/bubble/example_methane.tsv"
    preview: "scripts/scatter/bubble/preview.png"
    variants:
      - image: "scripts/scatter/bubble/preview_methane.png"
        example: "scripts/scatter/bubble/example_methane.tsv"
        config: >
          columns x/y/size/group/id = diff_share/invent_share/emission_share/country_group/code;
          x_log10 = FALSE; show_fit = FALSE; hollow = FALSE; size_guide = "right";
          size_breaks = 0.1/1/10; callouts_path = NULL;
          show_label only for large countries (USA/CHN/JPN/IND/BRA/DEU/FRA/RUS)
        shows: >
          Methane invention-vs-emission share bubble: linear axes, filled
          alpha bubbles by country group, size key stacked on the right
          (0.1/1/10%), few large-country ISO labels via ggrepel only.
    use_when: >
      Encode a third supplied numeric as point size on an x-y scatter,
      with colour by a discrete group, optional log10 x-axis, optional
      overall linear fit, selective id labels, optional nested size key,
      and optional cluster callouts (e.g. GNI vs coverage, or invention
      vs emission-share difference by country group).
    avoid_when: >
      Do not use when size is not a comparable magnitude, when
      overplotting needs hex/contour, for a dual-panel threshold bubble
      (scatter-bubble-panel), a category × category bubble grid
      (scatter-matrix), or bilateral x/y error bars with a supplied
      reference curve (scatter-xyerror). Do not compute GNI, coverage,
      fractions, invention shares, or emission shares in the script.
    input_shape: "one row per observation; x, y, size, group; optional id, show_label; optional callouts TSV"
    language: "r"
    status: "stable"

  - id: "scatter-xyerror"
    title: "Scatter with bilateral error bars and reference curve"
    aliases:
      - "双边误差散点"
      - "共振波长散点"
      - "xy error bubble"
      - "diameter resonance scatter"
      - "simulation overlay scatter"
