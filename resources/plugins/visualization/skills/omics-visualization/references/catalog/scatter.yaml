  - id: "scatter-dumbbell-groups"
    title: "Multi-group dumbbell plot"
    aliases:
      - "多组哑铃图"
    source: "scripts/scatter/dumbbell_groups/plot.R"
    examples:
      - "scripts/scatter/dumbbell_groups/example.tsv"
    preview: "scripts/scatter/dumbbell_groups/preview.png"
    use_when: >
      Connect more than two group values per category as a dumbbell.
    avoid_when: >
      Do not use for a strict two-point dumbbell (use scatter-dumbbell).
      Per-sample vertical dumbbells faceted by response are
      scatter-dumbbell-facet.
    input_shape: "one row per category-by-group; category, group, and numeric value"
    language: "r"
    status: "stable"

  - id: "scatter-dumbbell-facet"
    title: "Faceted sample dumbbell (response / maxMAF)"
    aliases:
      - "疗效分面哑铃图"
      - "maxMAF分面图"
      - "分面样本连线图"
      - "response dumbbell"
      - "ctDNA MAF dumbbell"
    source: "scripts/scatter/dumbbell_facet/plot.R"
    examples:
      - "scripts/scatter/dumbbell_facet/example.tsv"
    preview: "scripts/scatter/dumbbell_facet/preview.png"
    use_when: >
      Show per-sample vertical connectors faceted by clinical response:
      baseline maxMAF above zero, on-therapy maxMAF below zero, and an
      optional clearance mark (mR) at zero, with panel fills and a
      pseudo-log mirrored axis.
    avoid_when: >
      Do not use a two-point category dumbbell (scatter-dumbbell) or a
      horizontal multi-year dumbbell (scatter-dumbbell-groups). Do not
      compute MAF, clearance, or response in the script; signed values
      and facets are supplied. Extra samples/series stay CONFIG on this id.
    input_shape: "one row per sample-by-series; sample, response, series (Baseline/mR/C2D1/C3D1), signed value, line_class"
    language: "r"
    status: "stable"

  - id: "scatter-dumbbell-horizontal"
    title: "Horizontal dumbbell plot"
    aliases:
      - "水平哑铃图"
    source: "scripts/scatter/dumbbell_horizontal/plot.R"
    examples:
      - "scripts/scatter/dumbbell_horizontal/example.tsv"
    preview: "scripts/scatter/dumbbell_horizontal/preview.png"
    use_when: >
      Draw a two-group dumbbell with categories on the y-axis.
    avoid_when: >
      Do not use when a vertical or region-shaded dumbbell is requested.
    input_shape: "one row per category-by-group; category, group, and numeric value"
    language: "r"
    status: "stable"

  - id: "scatter-dumbbell-rect"
    title: "Rectangular dumbbell plot"
    aliases:
      - "矩形连接哑铃图"
    source: "scripts/scatter/dumbbell_rect/plot.R"
    examples:
      - "scripts/scatter/dumbbell_rect/example.tsv"
    preview: "scripts/scatter/dumbbell_rect/preview.png"
    use_when: >
      Connect two group values with a thick rectangular bar instead of a thin line.
    avoid_when: >
      Do not use for a thin-line dumbbell or a mean-plus-SD region overlay.
    input_shape: "one row per category-by-group; category, group, and numeric value"
    language: "r"
    status: "stable"

  - id: "scatter-dumbbell-region"
    title: "Dumbbell with mean-SD region"
    aliases:
      - "区间哑铃图"
      - "均值标准差哑铃"
    source: "scripts/scatter/dumbbell_region/plot.R"
    examples:
      - "scripts/scatter/dumbbell_region/example.tsv"
    preview: "scripts/scatter/dumbbell_region/preview.png"
    use_when: >
      Compare two groups on a shared category axis with a shaded
      mean +/- SD band behind the points.
    avoid_when: >
      Do not use when only two dots and a connector are needed.
    input_shape: "one row per category-by-group with a numeric summary value"
    language: "r"
    status: "stable"

  - id: "scatter-paired"
    title: "Paired before-after scatter"
    aliases:
      - "配对散点图"
      - "前后对比点图"
    source: "scripts/scatter/paired/plot.R"
    examples:
      - "scripts/scatter/paired/example.tsv"
    preview: "scripts/scatter/paired/preview.png"
    use_when: >
      Link two measurements of the same unit (before/after or two conditions).
    avoid_when: >
      Do not use for unpaired two-group dots or a paired boxplot
      (use boxplot-paired).
    input_shape: "one row per unit with two paired numeric values, or long format with pair id"
    language: "r"
    status: "stable"

  - id: "scatter-diagonal"
    title: "Diagonal comparison scatter"
    aliases:
      - "对角线比较散点"
      - "identity scatter"
    source: "scripts/scatter/diagonal/plot.R"
    examples:
      - "scripts/scatter/diagonal/example.tsv"
    preview: "scripts/scatter/diagonal/preview.png"
    use_when: >
      Compare two matched numeric measurements against the y = x line.
    avoid_when: >
      Do not use when there is no identity reference, or for a
      correlation fit without a diagonal (use scatter-correlation).
      log2FC of two differential contrasts with split discs filled by
      each contrast's -log10(padj) is scatter-fc-split.
    input_shape: "one row per item; two comparable numeric columns"
    language: "r"
    status: "stable"

  - id: "scatter-fc-split"
    title: "Dual-contrast fold-change scatter with split discs"
    aliases:
      - "双分组条件火山图"
      - "双条件火山图"
      - "双对比FC散点"
      - "split-disc FC scatter"
      - "dual-contrast volcano"
    source: "scripts/scatter/fc_split/plot.R"
    examples:
      - "scripts/scatter/fc_split/example.tsv"
    preview: "scripts/scatter/fc_split/preview.png"
    use_when: >
      Compare two supplied differential contrasts gene by gene: x =
      log2FC in contrast X, y = log2FC in contrast Y, each gene a disc
      split into equal halves filled by that contrast's -log10(padj),
      with zero and identity dashed lines, a glyph key, and repelled
      (optionally highlighted) labels. Which contrast is x / y, disc
      radius, palette and label mode are CONFIG.
    avoid_when: >
      Do not use for a single-contrast volcano (scatter-volcano),
      several contrasts side by side or in sectors
      (scatter-volcano-multi), raw expression vs expression
      (scatter-diagonal), or a quadrant split by thresholds
      (scatter-quadrant). Do not make sector angle proportional to
      p-values. Do not run FindAllMarkers or a DE test in the script.
    input_shape: >
      long table, one row per gene x contrast; gene, contrast, log2FC,
      padj, optional label and highlight
    language: "r"
    status: "stable"

  - id: "scatter-one2many"
    title: "One-to-many correlation scatter"
    aliases:
      - "一对多散点"
      - "中心关联图"
    source: "scripts/scatter/one2many/plot.R"
    examples:
      - "scripts/scatter/one2many/example.tsv"
    preview: "scripts/scatter/one2many/preview.png"
    use_when: >
      Show correlations from one central feature to many related items
      with Bezier links.
    avoid_when: >
      Do not use for a pairwise scatter matrix (use scatter-pairs) or a
      Mantel-style heatmap.
    input_shape: "one row per related item; label, category, and correlation or score"
    language: "r"
    status: "stable"

  - id: "scatter-bezier"
    title: "Bezier-linked scatter"
    aliases:
      - "贝塞尔连线散点"
    source: "scripts/scatter/bezier/plot.R"
    examples:
      - "scripts/scatter/bezier/example.tsv"
    preview: "scripts/scatter/bezier/preview.png"
    use_when: >
      Connect related points with curved Bezier paths in a scatter layout.
    avoid_when: >
      Do not use for a one-to-many hub layout (use scatter-one2many) or
      a paired boxplot with Bezier (use boxplot-bezier-point).
    input_shape: "one row per point or link in a labeled scatter"
    language: "r"
    status: "stable"

  - id: "scatter-svg"
    title: "Scatter with SVG glyphs"
    aliases:
      - "SVG散点"
      - "图标散点"
      - "ggsvg"
      - "自定义点"
    source: "scripts/scatter/svg/plot.R"
    examples:
      - "scripts/scatter/svg/example.tsv"
    preview: "scripts/scatter/svg/preview.png"
    use_when: >
      Plot two numeric variables with a supplied SVG as the mark instead
      of ggplot point shapes, and colour one SVG path by a group.
      Change the SVG file and css selector in CONFIG; that is not a
      second template.
    avoid_when: >
      Do not use ordinary pch scatter (scatter-group), a bubble whose
      size is the claim, or a horizontal bar whose category is an SVG
      (bar-svg-icon). Do not add an id that only swaps the glyph file.
    input_shape: "one row per observation; x, y, group, optional label; SVG file beside plot.R"
    language: "r"
    status: "stable"
