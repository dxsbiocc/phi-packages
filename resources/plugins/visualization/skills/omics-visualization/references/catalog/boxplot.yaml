family: "boxplot"
preview_background: "transparent"  # PNG alpha is empty; dark UIs look black. Do not treat as a black canvas.

templates:
  - id: "boxplot-basic"
    title: "Basic boxplot"
    aliases:
      - "箱线图"
      - "盒须图"
      - "蜂群箱线图"
      - "beeswarm boxplot"
      - "outline boxplot"
      - "缺口箱线图"
      - "notched boxplot"
      - "Cut&Run箱线图"
      - "cohort timepoint boxplot"
      - "H3K27me3 boxplot"
    source: "scripts/boxplot/basic/plot.R"
    examples:
      - "scripts/boxplot/basic/example.tsv"
      - "scripts/boxplot/basic/example_beeswarm.tsv"
      - "scripts/boxplot/basic/example_notch.tsv"
      - "scripts/boxplot/basic/example_cutrun.tsv"
      - "scripts/boxplot/basic/labels.tsv"
      - "scripts/boxplot/basic/brackets.tsv"
      - "scripts/boxplot/basic/brackets_cutrun.tsv"
    preview: "scripts/boxplot/basic/preview.png"
    variants:
      - image: "scripts/boxplot/basic/preview_beeswarm.png"
        example: "scripts/boxplot/basic/example_beeswarm.tsv"
        config: "style = \"beeswarm\", columns x/y = group/value, beeswarm$palette = \"Qualitative.Pastel\", beeswarm$y_trans = \"log10\", labels.tsv + brackets.tsv"
        shows: "White-panel outline boxes with a bold median, quasirandom points coloured by group from a catalog pastel palette, multi-line construct labels with N, log10 luminescence axis, and supplied fold / P brackets stacked above the groups."
      - image: "scripts/boxplot/basic/preview_notch.png"
        example: "scripts/boxplot/basic/example_notch.tsv"
        config: "style = \"notch\", notch$orientation = \"h\", notch$notch = TRUE, columns x/y = cell_type/ratio, group_order, palettes Qualitative.Bold"
        shows: "Horizontal notched boxes with white fill, category-coloured outlines and jittered points, white classic panel (e.g. immune-cell frequencies)."
      - image: "scripts/boxplot/basic/preview_cutrun.png"
        example: "scripts/boxplot/basic/example_cutrun.tsv"
        config: >
          style = "cohort"; columns treatment/day/y = treatment/day/reads;
          day_colours D0/D4/D28; y_trans = "log10"; brackets_cutrun.tsv
          with keys "treatment|day"
        shows: >
          Cut&Run H3K27me3-style cohort boxes: treatment blocks
          (PBT / PBT+IFNa2a / IFNa2a) each with D0/D4/D28, day-coloured
          translucent boxes and jitter, dotted cohort dividers,
          underlined treatment labels, log10 reads axis, and supplied
          significance brackets.
    use_when: >
      Summarize a numeric distribution across categories as boxes and
      whiskers. With style = "beeswarm", draw outline boxes, a
      quasirandom swarm, optional log10 y, multi-line x labels, and
      supplied comparison brackets on a white panel. With style =
      "notch", draw notched boxes (optional horizontal) with coloured
      outlines and jittered points. With style = "cohort", draw
      treatment × day boxes with day colours, cohort dividers, and
      underlined treatment labels (e.g. Cut&Run time-course).
    avoid_when: >
      Do not use when pairing, violins, or rainclouds are requested.
      A swarm without boxes, or mean±SEM ELISA-style, is
      scatter-beeswarm. 1D histograms and kernel densities are
      scatter-hist / scatter-density1d, not this family. Do not
      compute fold-change or p-values in the
      script; bracket labels are supplied. Do not add an id for notch
      or cohort alone, or per assay / treatment panel.
    input_shape: >
      one row per observation; category plus numeric value (basic /
      beeswarm / notch), or treatment + day + value (cohort); optional
      labels.tsv / brackets.tsv
    language: "r"
    status: "stable"

  - id: "boxplot-group"
    title: "Grouped boxplot"
    aliases:
      - "分组箱线图"
    source: "scripts/boxplot/group/plot.R"
    examples:
      - "scripts/boxplot/group/example.tsv"
    preview: "scripts/boxplot/group/preview.png"
    use_when: >
      Compare distributions across categories and a second grouping factor.
    avoid_when: >
      Do not use for a single grouping factor (use boxplot-basic).
    input_shape: "one row per observation; category, group, and numeric value"
    language: "r"
    status: "stable"

  - id: "boxplot-violin"
    title: "Violin plot"
    aliases:
      - "小提琴图"
    source: "scripts/boxplot/violin/plot.R"
    examples:
      - "scripts/boxplot/violin/example.tsv"
      - "scripts/boxplot/violin/example_jitter.tsv"
    preview: "scripts/boxplot/violin/preview.png"
    variants:
      - image: "scripts/boxplot/violin/preview_jitter.png"
        example: "scripts/boxplot/violin/example_jitter.tsv"
        config: "style = \"jitter\", columns x/y = group/value, group_order, palettes$group, jitter$annotation$label"
        shows: "Filled violins with nested thin boxes and jittered points coloured by category from a catalog palette, optional supplied n/P corner note, white classic panel, and rotated Year|Scenario x labels."
    use_when: >
      Show full distribution shape per category, not only quartiles.
      With style = "jitter", overlay a thin box and jittered points,
      colour by category, and place a supplied n / P annotation.
    avoid_when: >
      Do not use when only a box summary is needed, when a raincloud
      (half-violin plus points) is requested, or when stacked density
      ridges / RidgePlot are requested (line-ridge). Two scores per
      group mirrored around centre labels is boxplot-violin-butterfly.
      Do not compute n or P in the script; annotation text is supplied.
    input_shape: "one row per observation; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "boxplot-letter-value"
    title: "Letter-value (boxen) plot"
    aliases:
      - "增强箱线图"
      - "boxen图"
      - "letter-value plot"
      - "boxenplot"
      - "lvplot"
      - "层叠箱线图"
    source: "scripts/boxplot/letter_value/plot.R"
    examples:
      - "scripts/boxplot/letter_value/example.tsv"
    preview: "scripts/boxplot/letter_value/preview.png"
    use_when: >
      Show large-n distributions per category as nested quantile boxes
      (quartiles, octiles, sixteenths, ...) that narrow and lighten
      outward, with a median line and diamond outliers, so tails stay
      readable. Level rule (Tukey or fixed), palette, reversed y
      (e.g. cortical depth), order and outlier shape are CONFIG.
    avoid_when: >
      Do not use a single quartile box (boxplot-basic), a density
      outline (boxplot-violin), half-violin plus points
      (boxplot-raincloud), or ridgelines (line-ridge). Do not run a
      test in the script. Do not add an id for reversed y.
    input_shape: "one row per observation; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "boxplot-violin-butterfly"
    title: "Butterfly (mirrored) violin plot"
    aliases:
      - "蝴蝶小提琴图"
      - "镜像小提琴图"
      - "双侧小提琴图"
      - "M1 M2 评分"
      - "butterfly violin"
      - "mirrored violin"
    source: "scripts/boxplot/violin_butterfly/plot.R"
    examples:
      - "scripts/boxplot/violin_butterfly/example.tsv"
      - "scripts/boxplot/violin_butterfly/groups.tsv"
    preview: "scripts/boxplot/violin_butterfly/preview.png"
    use_when: >
      Compare two supplied scores per group (e.g. M1 vs M2 feature
      score per macrophage subset) as horizontal violins mirrored
      left / right of a shared centre column of group names coloured
      by a supplied class, with nested boxes (optional notch) and a
      dashed reference per side. Which side is left, side titles,
      reference values, shared x range, row order, box / notch and
      colours are CONFIG.
    avoid_when: >
      Do not use one score per category (boxplot-violin), two matched
      bar series (bar-butterfly), stacked density ridges (line-ridge),
      or rainclouds (boxplot-raincloud). Do not compute module /
      M1 / M2 scores in the script. Do not add an id per side pair
      or for notch alone.
    input_shape: "one row per observation (group, side, score) with exactly two side levels; optional groups.tsv (group, class) for label colour"
    language: "r"
    status: "stable"

  - id: "boxplot-point"
    title: "Boxplot with points"
    aliases:
      - "箱线加点图"
    source: "scripts/boxplot/point/plot.R"
    examples:
      - "scripts/boxplot/point/example.tsv"
    preview: "scripts/boxplot/point/preview.png"
    use_when: >
      Combine a box summary with the underlying observations.
    avoid_when: >
      Do not use a beeswarm or raincloud when a simple box-plus-points is enough.
    input_shape: "one row per observation; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "boxplot-round"
    title: "Rounded boxplot"
    aliases:
      - "圆角箱线图"
    source: "scripts/boxplot/round/plot.R"
    examples:
      - "scripts/boxplot/round/example.tsv"
    preview: "scripts/boxplot/round/preview.png"
    use_when: >
      Draw the same box summary with rounded box geometry.
    avoid_when: >
      Do not use when a standard rectangular boxplot is requested.
    input_shape: "one row per observation; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "boxplot-paired"
    title: "Paired boxplot"
    aliases:
      - "配对箱线图"
      - "前后箱线"
    source: "scripts/boxplot/paired/plot.R"
    examples:
      - "scripts/boxplot/paired/example.tsv"
    preview: "scripts/boxplot/paired/preview.png"
    use_when: >
      Compare two paired conditions and optionally draw pair connectors.
    avoid_when: >
      Do not use for unpaired groups (use boxplot-group) or a paired scatter.
    input_shape: "one row per unit-by-condition, with a pair identifier"
    language: "r"
    status: "stable"

  - id: "boxplot-bezier-point"
    title: "Boxplot with Bezier pair links"
    aliases:
      - "贝塞尔连线箱线图"
    source: "scripts/boxplot/bezier_point/plot.R"
    examples:
      - "scripts/boxplot/bezier_point/example.tsv"
    preview: "scripts/boxplot/bezier_point/preview.png"
    use_when: >
      Overlay paired observations on boxes and connect pairs with Bezier curves.
      Pairing uses a supplied pair_id within each facet, not row order.
    avoid_when: >
      Do not use straight paired connectors (boxplot-paired) or a
      Bezier scatter (scatter-bezier).
    input_shape: "one row per unit-by-condition, with an explicit pair_id"
    language: "r"
    status: "stable"

  - id: "boxplot-differential-expression"
    title: "Differential-expression boxplot"
    aliases:
      - "差异表达箱线图"
      - "基因箱线图"
    source: "scripts/boxplot/differential_expression/plot.R"
    examples:
      - "scripts/boxplot/differential_expression/example.tsv"
    preview: "scripts/boxplot/differential_expression/preview.png"
    use_when: >
      Compare expression of selected features across sample groups.
    avoid_when: >
      Do not use a volcano as a substitute, or a two-panel / faceted
      differential layout when a single gene panel is requested.
    input_shape: "long table of feature, sample group, and expression"
    language: "r"
    status: "stable"

  - id: "boxplot-differential-two"
    title: "Two-panel differential boxplot"
    aliases:
      - "双面板差异箱线"
    source: "scripts/boxplot/differential_two/plot.R"
    examples:
      - "scripts/boxplot/differential_two/example.tsv"
    preview: "scripts/boxplot/differential_two/preview.png"
    use_when: >
      Show two features or two contrasts as paired differential box panels.
    avoid_when: >
      Do not use a many-feature facet grid (boxplot-differential-facet).
    input_shape: "long table of feature, group, and expression for two features"
    language: "r"
    status: "stable"

  - id: "boxplot-differential-facet"
    title: "Faceted differential boxplot"
    aliases:
      - "分面差异箱线"
    source: "scripts/boxplot/differential_facet/plot.R"
    examples:
      - "scripts/boxplot/differential_facet/example.tsv"
    preview: "scripts/boxplot/differential_facet/preview.png"
    use_when: >
      Facet expression boxplots across many features.
    avoid_when: >
      Do not use for one or two features (use differential-expression or
      differential-two).
    input_shape: "long table of feature, group, and expression"
    language: "r"
    status: "stable"

  - id: "boxplot-differential-bg"
    title: "Banded two-level differential boxplot"
    aliases:
      - "背景色带箱线图"
      - "泛癌箱线图"
      - "分组差异箱线"
      - "pancancer boxplot"
    source: "scripts/boxplot/differential_bg/plot.R"
    examples:
      - "scripts/boxplot/differential_bg/example.tsv"
    preview: "scripts/boxplot/differential_bg/preview.png"
    use_when: >
      Compare two groups within many x-axis categories (for example
      Normal vs Tumor across cancer types): rounded boxes, jitter,
      alternating background bands, and per-category significance
      labels. show_ns is CONFIG.
    avoid_when: >
      Do not use a plain two-factor boxplot without bands or
      significance (boxplot-group), a single-category DE panel
      (boxplot-differential-expression), or faceted many-feature
      panels (boxplot-differential-facet). Do not filter matched
      patients or run DE in the script. Alternating vs solid bands
      is not a second id.
    input_shape: "one row per observation; category, group, and numeric value"
    language: "r"
    status: "stable"

  - id: "boxplot-raincloud"
    title: "Raincloud plot"
    aliases:
      - "雨云图"
      - "half-violin"
    source: "scripts/boxplot/raincloud/plot.R"
    examples:
      - "scripts/boxplot/raincloud/example.tsv"
    preview: "scripts/boxplot/raincloud/preview.png"
    use_when: >
      Combine a half-violin, box, and raw points in a horizontal raincloud.
    avoid_when: >
      Do not use the vertical or differential raincloud unless that layout
      is requested.
    input_shape: "one row per observation; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "boxplot-raincloud-vertical"
    title: "Vertical raincloud plot"
    aliases:
      - "竖直雨云图"
    source: "scripts/boxplot/raincloud_vertical/plot.R"
    examples:
      - "scripts/boxplot/raincloud_vertical/example.tsv"
    preview: "scripts/boxplot/raincloud_vertical/preview.png"
    use_when: >
      Same raincloud combination in a vertical orientation.
    avoid_when: >
      Do not use the horizontal raincloud (boxplot-raincloud).
    input_shape: "one row per observation; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "boxplot-raincloud-differential"
    title: "Differential raincloud plot"
    aliases:
      - "差异雨云图"
    source: "scripts/boxplot/raincloud_differential/plot.R"
    examples:
      - "scripts/boxplot/raincloud_differential/example.tsv"
    preview: "scripts/boxplot/raincloud_differential/preview.png"
    use_when: >
      Raincloud layout for differential-expression or contrast groups.
    avoid_when: >
      Do not use a generic raincloud when contrast annotations are required.
    input_shape: "one row per observation; feature or group plus numeric value"
    language: "r"
    status: "stable"

  - id: "boxplot-polar"
    title: "Polar boxplot"
    aliases:
      - "极坐标箱线图"
    source: "scripts/boxplot/polar/plot.R"
    examples:
      - "scripts/boxplot/polar/example.tsv"
    preview: "scripts/boxplot/polar/preview.png"
    use_when: >
      Place box summaries around a circle by category.
    avoid_when: >
      Do not use the inner-heatmap plus outer-violin fan
      (boxplot-polar-heatmap).
    input_shape: "one row per observation; angular category plus numeric value"
    language: "r"
    status: "stable"

  - id: "boxplot-polar-heatmap"
    title: "Polar heatmap with outer violins"
    aliases:
      - "径向热图小提琴"
      - "扇形分布图"
    source: "scripts/boxplot/polar_heatmap/plot.R"
    examples:
      - "scripts/boxplot/polar_heatmap/example.tsv"
    preview: "scripts/boxplot/polar_heatmap/preview.png"
    use_when: >
      Draw a radial fan with an inner heatmap of group means and outer
      violins of raw values.
    avoid_when: >
      Do not use a plain polar boxplot or a rectangular heatmap.
    input_shape: "one row per observation; angular category, group, and numeric value"
    language: "r"
    status: "stable"
