family: "ideogram"
preview_background: "transparent"  # PNG alpha is empty; dark UIs look black. Do not treat as a black canvas.

templates:
  - id: "ideogram-gene"
    title: "Transcript gene-structure tracks"
    aliases:
      - "基因结构"
      - "转录本结构"
      - "外显子图"
      - "gene model"
    source: "scripts/ideogram/gene/plot.R"
    examples:
      - "scripts/ideogram/gene/example.tsv"
    preview: "scripts/ideogram/gene/preview.png"
    use_when: >
      Draw one or more transcripts as rounded tracks of supplied
      exon / CDS / UTR intervals. Horizontal layout is config$flip.
    avoid_when: >
      Do not use chromosome G-banding (ideogram-karyotype), gene loci
      on chromosomes (ideogram-loci), a continuous density fill
      (ideogram-density), stacked locus coverage (ideogram-coverage),
      or a protein mutation lollipop (ideogram-lollipop), or dense
      clustered dandelions (ideogram-dandelion), a multi-track
      genomic Circos (ideogram-circos), or two-genome synteny
      ribbons (ideogram-synteny). Do not add
      an id per gene, GTF type filter, or corner radius.
    input_shape: "one row per feature; transcript, type, start, and end"
    language: "r"
    status: "stable"

  - id: "ideogram-karyotype"
    title: "Chromosome G-banding ideogram"
    aliases:
      - "核型图"
      - "染色体带型"
      - "ideogram"
      - "cytoband"
    source: "scripts/ideogram/karyotype/plot.R"
    examples:
      - "scripts/ideogram/karyotype/example.tsv"
    preview: "scripts/ideogram/karyotype/preview.png"
    use_when: >
      Show chromosomes with supplied G-band stains and p/q arms.
      coord_flip and which chromosomes to keep are CONFIG. hg19 vs
      mm10 is the input table, not a new id.
    avoid_when: >
      Do not use transcript exon models (ideogram-gene), a heatmap
      fill along the chromosome (ideogram-density), or a supplied
      gene-loci table (ideogram-loci), a multi-track genomic
      Circos (ideogram-circos), or two-genome synteny
      (ideogram-synteny).
    input_shape: "one row per cytoband; Chrom, Start, End, Stain, Arm"
    language: "r"
    status: "stable"

  - id: "ideogram-loci"
    title: "Gene loci on chromosome ideograms"
    aliases:
      - "感兴趣基因"
      - "基因定位"
      - "m6A调控因子"
      - "loci on ideogram"
    source: "scripts/ideogram/loci/plot.R"
    examples:
      - "scripts/ideogram/loci/example.tsv"
    preview: "scripts/ideogram/loci/preview.png"
    use_when: >
      Mark a supplied table of gene loci on chromosomes, coloured by
      category, with name labels. Catalog preview is circular circlize.
      Vertical ggplot is config$layout, not a second id.
    avoid_when: >
      Do not use transcript exon / CDS / UTR tracks (ideogram-gene) or
      G-banding with no loci (ideogram-karyotype). A multi-track
      Circos with rearrangement links is ideogram-circos. Loci with
      several traits each, drawn as per-organ marker rings, are
      ideogram-loci-traits. Do not add an id per gene set or per
      genome build.
    input_shape: "one row per locus (chr, start, end, gene, category) plus a cytoband sidecar"
    language: "r"
    status: "stable"

  - id: "ideogram-loci-traits"
    title: "Multi-trait loci circos with organ marker rings"
    aliases:
      - "多性状位点环图"
      - "多效性位点环图"
      - "GWAS位点性状环图"
      - "pleiotropic loci circos"
      - "multi-trait loci"
    source: "scripts/ideogram/loci_traits/plot.R"
    examples:
      - "scripts/ideogram/loci_traits/example.tsv"
      - "scripts/ideogram/loci_traits/cytoband.tsv"
    preview: "scripts/ideogram/loci_traits/preview.png"
    use_when: >
      Show supplied locus × trait associations on a circular
      ideogram: one band label per locus with its association count,
      branching leaders from the genomic midpoint to a column of
      markers, one concentric marker ring per organ (shape = organ,
      fill = trait) and an organ-grouped legend in the centre. Label
      and marker angles are spread with order preserved. Organ
      shapes / palettes / ring order, spacing and chromosome set are
      CONFIG.
    avoid_when: >
      Do not use single-category gene labels (ideogram-loci), a
      Manhattan plot of all SNPs (scatter-manhattan), quantitative
      genomic tracks or links (ideogram-circos), or a genomic interval
      heatmap (ideogram-circos-heatmap). Do not run GWAS, LD clumping,
      colocalisation or locus definition in the script.
    input_shape: >
      one row per locus-by-trait association (chr, start, end, locus,
      band, organ, trait) plus a cytoband sidecar
    language: "r"
    status: "stable"

  - id: "ideogram-density"
    title: "Ideogram with continuous density fill"
    aliases:
      - "染色体密度图"
      - "ideogram heatmap"
      - "基因密度核型"
    source: "scripts/ideogram/density/plot.R"
    examples:
      - "scripts/ideogram/density/example.tsv"
    preview: "scripts/ideogram/density/preview.png"
    use_when: >
      Fill chromosome tracks with a supplied window statistic (gene
      density, FST, Pi). A second density layer uses another
      geom_ideogram, not a second template.
    avoid_when: >
      Do not use G-banding (ideogram-karyotype), transcript structure
      (ideogram-gene), or a genomic-locus coverage browser
      (ideogram-coverage). Do not treat stacked put_togather
      chromosomes plus a side line as a new id. Dense site clusters
      with dandelion stems are ideogram-dandelion.
    input_shape: "one row per window; Chrom, Start, End, and Value"
    language: "r"
    status: "stable"

  - id: "ideogram-coverage"
    title: "Genomic locus coverage browser"
    aliases:
      - "基因组覆盖度"
      - "locus browser"
      - "coverage track"
      - "ATAC coverage"
      - "HiChIP loops"
      - "SCARlink"
      - "peak-to-gene"
      - "BCL2 accessibility"
      - "chromatin accessibility tracks"
      - "gene-linked tiles"
    source: "scripts/ideogram/coverage/plot.R"
    examples:
      - "scripts/ideogram/coverage/example.tsv"
      - "scripts/ideogram/coverage/linked/example.tsv"
      - "scripts/ideogram/coverage/linked/gene_models.tsv"
      - "scripts/ideogram/coverage/linked/tiles.tsv"
      - "scripts/ideogram/coverage/linked/markers.tsv"
      - "scripts/ideogram/coverage/linked/expression.tsv"
    preview: "scripts/ideogram/coverage/preview.png"
    variants:
      - image: "scripts/ideogram/coverage/preview_linked.png"
        example: "scripts/ideogram/coverage/linked/example.tsv"
        config: "layout = \"linked\"; sidecars in linked/: gene_models.tsv (gene, feature, start, end, lane), tiles.tsv (track, start, end, z, flag), markers.tsv (pos, label, shape, colour, lane), expression.tsv (track, value); linked$coef_track, focus_gene, z_limits, scale_bar, title_gene / title_rest, track_palette"
        shows: "Peak-to-gene locus panel: exon-level gene models with a highlighted focus gene, per-cell-type accessibility lines each with a gene-linked tile Z-score dot strip (flagged tile ringed), a black coefficient track, SNP triangles and tile tick with a 100 kb scale bar, and aligned per-cell-type expression violins on the right."
    use_when: >
      Stack supplied coverage tracks on one genomic window, with
      optional chromatin-loop arcs and gene intervals. Extra tracks,
      a highlight window, and loops on/off stay in CONFIG / sidecars.
      A peak-to-gene panel (gene models, line tracks with linked-tile
      strips, coefficient track, SNP markers, side expression
      violins) is layout = "linked", not a new id.
    avoid_when: >
      Do not use whole-chromosome density fill (ideogram-density)
      or transcript exon / CDS / UTR models (ideogram-gene). Do not
      use a protein mutation lollipop (ideogram-lollipop) or dense
      dandelions (ideogram-dandelion). Do not
      use line-* for genome-coordinate signal. Do not add an id per
      assay (ATAC / HiChIP) or for highlight on/off. Do not call
      peaks, loops, MACS, or Hi-C in the script.
    input_shape: "one row per coverage bin (chrom, start, end, score, track, group) plus optional loops.tsv and genes.tsv sidecars"
    language: "r"
    status: "stable"

  - id: "ideogram-lollipop"
    title: "Protein mutation lollipop"
    aliases:
      - "突变棒棒糖"
      - "蛋白棒棒糖"
      - "lollipop"
      - "MutationMapper"
      - "g3viz"
      - "线粒体突变环图"
      - "环形位点棒棒糖"
      - "mtDNA lollipop"
    source: "scripts/ideogram/lollipop/plot.R"
    examples:
      - "scripts/ideogram/lollipop/example.tsv"
      - "scripts/ideogram/lollipop/example_mito.tsv"
      - "scripts/ideogram/lollipop/domains_mito.tsv"
    preview: "scripts/ideogram/lollipop/preview.png"
    variants:
      - image: "scripts/ideogram/lollipop/preview_circular.png"
        example: "scripts/ideogram/lollipop/example_mito.tsv"
        config: "layout = \"circular\", protein_length = 16569, domains = \"domains_mito.tsv\", label_min = 0, label_prefix = \"\", label_big_mark = \",\""
        shows: "Circular sequence (mtDNA): feature ring coloured by group, radial stems with solid heads, position labels, dashed score rings."
    use_when: >
      Draw mutations on a protein amino-acid axis: stem height is a
      supplied count, heads are pie or solid circles by mutation
      class, and domains sit on a sidecar bar. Pie vs circle, hotspot
      labels, and legend stay in CONFIG. layout = "circular" bends a
      circular sequence (mtDNA, plasmid, viral genome) into a feature
      ring (domains sidecar with an optional group column) with radial
      stems outward or inward and position labels.
    avoid_when: >
      Do not use transcript exon / CDS / UTR tracks (ideogram-gene),
      a genomic-locus coverage browser (ideogram-coverage), a signed
      or ranked score lollipop (scatter-lollipop-*), site × amino-
      acid ΔΔG tiles (heatmap-mutation-energy), or a gene × sample
      oncoprint (heatmap-oncoprint). Do not parse MAF,
      fetch cBioPortal, look up Pfam, or map Variant_Classification in
      the script. Do not add an id per G3viz theme or chart.type.
      Dense clustered sites (dandelion) are ideogram-dandelion.
    input_shape: "one row per mutation or site × class (aa, class, optional count and label) plus optional domains.tsv sidecar"
    language: "r"
    status: "stable"

  - id: "ideogram-dandelion"
    title: "Dense-site dandelion plot"
    aliases:
      - "蒲公英图"
      - "dandelion"
      - "dandelionPlot"
      - "密位点棒棒糖"
    source: "scripts/ideogram/dandelion/plot.R"
    examples:
      - "scripts/ideogram/dandelion/example.tsv"
    preview: "scripts/ideogram/dandelion/preview.png"
    use_when: >
      Collapse dense sites (methylation, SNPs) into clustered
      dandelions: stem height is cluster size or mean score, heads
      are fan / pie / circle / pin, with a feature bar. type, maxgaps,
      and height method stay in CONFIG.
    avoid_when: >
      Do not use a one-stem-per-site protein lollipop
      (ideogram-lollipop), whole-chromosome window fill
      (ideogram-density), or a locus coverage browser
      (ideogram-coverage). Do not add an id per head type or maxgaps.
      Do not fetch TxDb, UCSC, or VCF, or compute methylation in the
      script.
    input_shape: "one row per site (pos, score) plus optional features.tsv sidecar"
    language: "r"
    status: "stable"

  - id: "ideogram-circos"
    title: "Multi-track genomic Circos"
    aliases:
      - "Circos"
      - "基因组环图"
      - "环状基因组"
      - "CNV circos"
      - "重排环图"
      - "色带Circos"
      - "ribbon circos"
    source: "scripts/ideogram/circos/plot.R"
    examples:
      - "scripts/ideogram/circos/example.tsv"
      - "scripts/ideogram/circos/cytoband.tsv"
      - "scripts/ideogram/circos/links.tsv"
      - "scripts/ideogram/circos/example_ribbons.tsv"
      - "scripts/ideogram/circos/cytoband_ribbons.tsv"
      - "scripts/ideogram/circos/links_ribbons.tsv"
    preview: "scripts/ideogram/circos/preview.png"
    variants:
      - image: "scripts/ideogram/circos/preview_ribbons.png"
        example: "scripts/ideogram/circos/example_ribbons.tsv"
        config: "sector_style = \"plain\", histogram_fill, link group colours, chromosomes order, background = \"white\""
        shows: "Publication-style Circos: plain sectors, solid density track, thick pastel ribbons coloured by link group."
    use_when: >
      Draw one genome as circular sectors with an ideogram, concentric
      quantitative tracks (histogram / scatter / line), and optional
      rearrangement links. Extra tracks are extra `track` levels.
      Links on/off, link group colouring, chromosome order, plain
      sectors, solid histogram fill and background are CONFIG. A
      microbial or mitochondrial circle is the cytoband table, not a
      new id.
    avoid_when: >
      Do not use labelled gene loci without tracks (ideogram-loci),
      linear window fill (ideogram-density), two-genome homology
      ribbons (ideogram-synteny), a group-split circular heatmap
      (heatmap-circos-split), a genomic Circos heatmap with
      connector lines, including mixed scatter / CNV tracks and
      inner gene labels (ideogram-circos-heatmap), or a nested
      overview-plus-zoom Circos (ideogram-nested). Do not add an id per track type or for links
      on/off. Do not call CNV, SV, or density in the script.
    input_shape: "one row per genomic window (chr, start, end, value, track, type) plus cytoband.tsv and optional links.tsv sidecars"
    language: "r"
    status: "stable"

  - id: "ideogram-synteny"
    title: "Two-genome synteny Circos"
    aliases:
      - "共线性"
      - "synteny"
      - "比较基因组环图"
      - "同源色带"
    source: "scripts/ideogram/synteny/plot.R"
    examples:
      - "scripts/ideogram/synteny/example.tsv"
      - "scripts/ideogram/synteny/karyotype.tsv"
    preview: "scripts/ideogram/synteny/preview.png"
    use_when: >
      Compare two assemblies as adjacent sector runs, with homology
      blocks as ribbons. Extra chromosomes are extra karyotype rows.
      A third genome is another genome level in the sidecar.
    avoid_when: >
      Do not use many species stacked per subgenome with inner
      heatmap tracks (ideogram-subgenome-circos), or a horizontal
      multi-genome riparian track (ideogram-synteny-linear).
      Do not use one genome with quantitative tracks and SV links
      (ideogram-circos), a weighted category chord (graph-chord),
      or equal-spacing circular nodes (graph-circular). Do not run
      BLAST, minimap, or MCScanX in the script. Do not add an id
      per species pair.
    input_shape: "one row per aligned block (chr1, start1, end1, chr2, start2, end2, group) plus karyotype.tsv (genome, chr, start, end). chr names must be unique across genomes (Q1/T1, not chr1 twice)."
    language: "r"
    status: "stable"

  - id: "ideogram-synteny-linear"
    title: "Horizontal multi-genome synteny"
    aliases:
      - "线性共线性"
      - "水平共线性"
      - "riparian"
      - "riparian plot"
      - "linear synteny"
      - "genome synteny"
      - "多基因组共线性"
      - "染色体共线性带"
    source: "scripts/ideogram/synteny_linear/plot.R"
    examples:
      - "scripts/ideogram/synteny_linear/example.tsv"
      - "scripts/ideogram/synteny_linear/karyotype.tsv"
    preview: "scripts/ideogram/synteny_linear/preview.png"
    use_when: >
      Compare three or more assemblies as horizontal chromosome-bar
      tracks with sigmoid ribbons between adjacent genomes. Optional
      class column colours large rearrangements (e.g. orange) versus
      conserved synteny (grey). Extra genomes are extra karyotype
      levels plus adjacent-pair blocks — not a new id.
    avoid_when: >
      Do not use a two-genome Circos (ideogram-synteny), a circular
      subgenome riparian with heatmap tracks (ideogram-subgenome-circos),
      or one-genome Circos tracks (ideogram-circos). Do not run BLAST,
      minimap, MCScanX, WGDI, or JCVI in the script; blocks and the
      rearrangement class are supplied.
    input_shape: >
      one row per aligned block (genome1, chr1, start1, end1, genome2,
      chr2, start2, end2; optional class) plus karyotype.tsv (genome,
      chr, start, end). start2 > end2 marks an inverted block.
    language: "r"
    status: "stable"

  - id: "ideogram-subgenome-circos"
    title: "Multi-species subgenome synteny Circos"
    aliases:
      - "亚基因组环图"
      - "多倍体共线性"
      - "多物种共线性环图"
      - "环形riparian"
      - "circular riparian"
      - "subgenome circos"
      - "polyploid synteny"
      - "竹子基因组环图"
    source: "scripts/ideogram/subgenome_circos/plot.R"
    examples:
      - "scripts/ideogram/subgenome_circos/example.tsv"
      - "scripts/ideogram/subgenome_circos/rows.tsv"
      - "scripts/ideogram/subgenome_circos/blocks.tsv"
      - "scripts/ideogram/subgenome_circos/tracks.tsv"
      - "scripts/ideogram/subgenome_circos/links.tsv"
    preview: "scripts/ideogram/subgenome_circos/preview.png"
    use_when: >
      Compare many species across subgenomes: reference subgenomes
      are sectors with an inner chromosome ring, stacked heatmap
      tracks (expression / methylation / gene / synteny windows) and
      central homeolog links; outside, each sector carries a radial
      stack of species rows joined by supplied synteny blocks between
      adjacent rows. Subgenomes absent from the reference are rows
      anchored on a reference sector. Extra species are extra rows;
      extra heatmap tracks, sector order, dashed missing level, and
      outer chr labels are CONFIG. Drop a sidecar by setting it NULL.
    avoid_when: >
      Do not use two assemblies with ribbons only (ideogram-synteny),
      a horizontal multi-genome riparian (ideogram-synteny-linear),
      one genome with histogram / scatter tracks (ideogram-circos), or
      interval heatmaps with connectors (ideogram-circos-heatmap). Do
      not run MCScanX, WGDI, JCVI, or BLAST, or compute window
      statistics in the script. Do not add an id per ploidy group.
    input_shape: "karyotype (species, subgenome, chr, length) plus rows.tsv (species, subgenome, anchor, level, group, ploidy), blocks.tsv (species1, chr1, start1, end1, species2, chr2, start2, end2; start2 > end2 = inverted), tracks.tsv (chr, start, end, track, value) and links.tsv (chr1, start1, end1, chr2, start2, end2) on reference chr"
    language: "r"
    status: "stable"

  - id: "ideogram-circos-heatmap"
    title: "Genomic Circos heatmap with connectors"
    aliases:
      - "基因组热图"
      - "circos heatmap"
      - "genomicHeatmap"
      - "环状基因组热图"
      - "多轨Circos热图"
      - "散点CNV热图环图"
      - "多组学基因组环图"
      - "multi-track circos heatmap"
    source: "scripts/ideogram/circos_heatmap/plot.R"
    examples:
      - "scripts/ideogram/circos_heatmap/example.tsv"
      - "scripts/ideogram/circos_heatmap/cytoband.tsv"
      - "scripts/ideogram/circos_heatmap/multitrack/example.tsv"
      - "scripts/ideogram/circos_heatmap/multitrack/cytoband.tsv"
      - "scripts/ideogram/circos_heatmap/multitrack/tracks.tsv"
      - "scripts/ideogram/circos_heatmap/multitrack/genes.tsv"
    preview: "scripts/ideogram/circos_heatmap/preview.png"
    variants:
      - image: "scripts/ideogram/circos_heatmap/preview_multitrack.png"
        example: "scripts/ideogram/circos_heatmap/multitrack/example.tsv"
        config: "Optional tracks.tsv and genes.tsv beside input; sector_style = \"auto\"; labels$center sets the sample name."
        shows: "Solid chromosome sectors and Mb ticks, scatter and signed CNV tracks, connected four-layer heatmap, and inner gene labels. Measurement values and labels are synthetic demonstration data."
    use_when: >
      Draw genomic intervals as a circular heatmap whose tiles are
      supplied numeric columns, with connector lines from each
      locus to its tile stack. Extra columns are extra layers.
      Optional tracks.tsv adds supplied scatter / histogram / line
      tracks outside the heatmap; genes.tsv adds inner locus labels.
      Use this template for a combined scatter + signed CNV +
      heatmap + gene-label Circos. side, sector style, track heights,
      and centre text are CONFIG; these are variants, not new ids.
    avoid_when: >
      Do not use a Group-split gene matrix (heatmap-circos-split),
      histogram / scatter tracks without tiles (ideogram-circos),
      or labelled loci without a heatmap (ideogram-loci). Do not
      add an id per side or per mark. Do not call CNV, infer variants,
      call peaks, z-score, or fetch a genome in the script.
    input_shape: "one row per interval (chr, start, end, plus numeric layer columns) plus cytoband.tsv; optional tracks.tsv (chr, start, end, value, track, type) and genes.tsv (chr, start, end, label) beside input"
    language: "r"
    status: "stable"

  - id: "ideogram-nested"
    title: "Nested Circos overview and zoom"
    aliases:
      - "嵌套缩放"
      - "circos nested"
      - "nested circos"
      - "DMR缩放环图"
    source: "scripts/ideogram/nested/plot.R"
    examples:
      - "scripts/ideogram/nested/example.tsv"
      - "scripts/ideogram/nested/cytoband.tsv"
      - "scripts/ideogram/nested/windows.tsv"
      - "scripts/ideogram/nested/points.tsv"
    preview: "scripts/ideogram/nested/preview.png"
    use_when: >
      Show an outer genome and an inner zoom of supplied windows,
      joined by correspondence connectors, with supplied scores as
      inner points. Extra windows are extra correspondence rows.
      Inner assay (DMR / methDiff / other) is the points table,
      not a new id.
    avoid_when: >
      Do not use a single Circos without a nested ring
      (ideogram-circos), a genomic heatmap with connectors
      (ideogram-circos-heatmap), or a rectangular locus browser
      (ideogram-coverage). Do not call DMR, windows, or fetch a
      genome in the script. Do not add an id per T-WGBS panel.
    input_shape: "one row per zoom window (chr, start, end, name, zstart, zend) plus cytoband.tsv, windows.tsv, and points.tsv sidecars"
    language: "r"
    status: "stable"


