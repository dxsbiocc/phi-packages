family: "bar"
preview_background: "transparent"  # PNG alpha is empty; dark UIs look black. Do not treat as a black canvas.

templates:
  - id: "bar-basic"
    title: "Basic bar chart"
    aliases:
      - "柱状图"
      - "条形图"
    source: "scripts/bar/basic/plot.R"
    examples:
      - "scripts/bar/basic/example.tsv"
    preview: "scripts/bar/basic/preview.png"
    use_when: >
      Compare a single numeric value across discrete categories.
    avoid_when: >
      Do not use for grouped, stacked, percent, or enrichment bars, a
      patient swimmer plot (bar-swimmer), or when a category SVG
      replaces y-axis text (bar-svg-icon).
    input_shape: "one row per category; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "bar-group"
    title: "Grouped bar chart"
    aliases:
      - "分组柱状图"
      - "簇状柱状图"
    source: "scripts/bar/group/plot.R"
    examples:
      - "scripts/bar/group/example.tsv"
    preview: "scripts/bar/group/preview.png"
    use_when: >
      Compare several groups side by side within each category.
    avoid_when: >
      Do not use when bars should stack to a total (use bar-stack) or
      show parts of 100% (use bar-percent).
    input_shape: "one row per category-by-group; category, group, and value"
    language: "r"
    status: "stable"

  - id: "bar-stack"
    title: "Stacked bar chart"
    aliases:
      - "堆叠柱状图"
      - "百分比堆叠柱"
      - "带连接带的堆叠柱"
      - "stacked bar with links"
      - "bar-stack-normalization"
    source: "scripts/bar/stack/plot.R"
    examples:
      - "scripts/bar/stack/example.tsv"
    preview: "scripts/bar/stack/preview.png"
    variants:
      - image: "scripts/bar/stack/preview_absolute.png"
        example: "scripts/bar/stack/example.tsv"
        config: "scale = \"absolute\", links = FALSE"
        shows: "Plain stacked magnitudes without link bands."
    use_when: >
      Show composition within each category as stacked bars, normalised
      to 100% (default) or as absolute magnitudes (scale = "absolute").
      Translucent bands link the same component between adjacent bars
      so its share can be followed across categories (links = TRUE,
      the preview). Scale and links are CONFIG, not new ids.
    avoid_when: >
      Do not use for side-by-side groups, flows between different
      components (that is a Sankey), faceted horizontal percent bars
      per group (bar-percent), or a ranked horizontal stack with an
      inset inheritance / composition doughnut (bar-stack-donut).
    input_shape: "one row per category-by-component; category, component, and value"
    language: "r"
    status: "stable"

  - id: "bar-stack-donut"
    title: "Horizontal stacked bars with inset doughnut"
    aliases:
      - "基因频率堆叠条形图"
      - "inheritance bar donut"
      - "SNHL gene frequency"
      - "stacked bar with pie"
    source: "scripts/bar/stack_donut/plot.R"
    examples:
      - "scripts/bar/stack_donut/example.tsv"
      - "scripts/bar/stack_donut/donut.tsv"
    preview: "scripts/bar/stack_donut/preview.png"
    use_when: >
      Rank categories (e.g. genes) by supplied absolute frequency as
      horizontal stacked bars by a fill such as inheritance mode, and
      show overall fill composition as an inset doughnut (sidecar
      percents preferred).
    avoid_when: >
      Do not use a plain stack without a doughnut (bar-stack), a
      doughnut alone (pie-doughnut), or a circos doughnut with radial
      bars (pie-doughnut-bar). Do not call genotypes or assign
      inheritance in the script; counts and donut percents are supplied.
    input_shape: >
      bars: one row per gene × mode with count; optional donut.tsv
      with mode and percent
    language: "r"
    status: "stable"

  - id: "bar-percent"
    title: "Percent stacked bar chart"
    aliases:
      - "百分比堆叠柱状图"
      - "构成比柱状图"
    source: "scripts/bar/percent/plot.R"
    examples:
      - "scripts/bar/percent/example.tsv"
    preview: "scripts/bar/percent/preview.png"
    use_when: >
      Compare part-to-whole composition across categories on a 100% scale.
    avoid_when: >
      Do not use when absolute counts matter more than proportions.
    input_shape: "one row per category-by-component; category, component, and value"
    language: "r"
    status: "stable"

  - id: "bar-errorbar"
    title: "Bar chart with error bars"
    aliases:
      - "误差线柱状图"
    source: "scripts/bar/errorbar/plot.R"
    examples:
      - "scripts/bar/errorbar/example.tsv"
    preview: "scripts/bar/errorbar/preview.png"
    use_when: >
      Show a summarized mean (or similar) with an explicit uncertainty bar.
    avoid_when: >
      Do not invent error bars; skip this template if no uncertainty column exists.
    input_shape: "one row per category with value and error (or ymin/ymax)"
    language: "r"
    status: "stable"

  - id: "bar-break"
    title: "Bar chart with axis break"
    aliases:
      - "断轴柱状图"
    source: "scripts/bar/break/plot.R"
    examples:
      - "scripts/bar/break/example.tsv"
    preview: "scripts/bar/break/preview.png"
    use_when: >
      Compare categories when one or a few values dwarf the rest and an
      axis break is needed.
    avoid_when: >
      Do not use a break merely to exaggerate small differences.
    input_shape: "one row per category; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "bar-waterfall"
    title: "Waterfall chart"
    aliases:
      - "瀑布图"
      - "增减柱状图"
    source: "scripts/bar/waterfall/plot.R"
    examples:
      - "scripts/bar/waterfall/example.tsv"
    preview: "scripts/bar/waterfall/preview.png"
    use_when: >
      Show how sequential signed changes accumulate from a start to an end.
    avoid_when: >
      Do not use for independent category comparisons. A gene ×
      sample alteration grid is heatmap-oncoprint, not this
      waterfall of signed increments.
    input_shape: "ordered rows of signed increments plus optional totals"
    language: "r"
    status: "stable"

  - id: "bar-butterfly"
    title: "Butterfly / diverging bar chart"
    aliases:
      - "蝴蝶图"
      - "对称条形图"
    source: "scripts/bar/butterfly/plot.R"
    examples:
      - "scripts/bar/butterfly/example.tsv"
    preview: "scripts/bar/butterfly/preview.png"
    use_when: >
      Mirror two series left and right of a shared category axis.
    avoid_when: >
      Do not use for a single-sided ranking, grade-stacked TRAE/AE
      butterflies (use bar-butterfly-stack), or tissue-wise
      outgoing/incoming bars aligned to a log2 ratio heatmap
      (use bar-communication).
    input_shape: "one row per category with two opposing numeric series"
    language: "r"
    status: "stable"

  - id: "bar-butterfly-stack"
    title: "Diverging stacked butterfly bars"
    aliases:
      - "分级对称条形图"
      - "TRAE AE butterfly"
      - "adverse event butterfly"
      - "diverging stacked bar"
    source: "scripts/bar/butterfly_stack/plot.R"
    examples:
      - "scripts/bar/butterfly_stack/example.tsv"
    preview: "scripts/bar/butterfly_stack/preview.png"
    use_when: >
      Compare two opposing sides (e.g. TRAEs vs AEs irrespective of
      causality) on shared event terms, each side stacked by supplied
      severity grade from the centre outward, with end totals and dual
      legends.
    avoid_when: >
      Do not use a non-stacked two-group butterfly (bar-butterfly), a
      one-sided stacked bar (bar-stack), enrichment opposite bars
      (bar-opposite), or communication bars with a ratio heatmap
      (bar-communication). Do not count patients, assign causality, or
      grade events in the script; percent by term/side/grade is supplied.
    input_shape: >
      one row per term × side × grade; term, side, grade, percent
    language: "r"
    status: "stable"

  - id: "bar-communication"
    title: "Cell communication mirrored bars"
    aliases:
      - "细胞通讯图"
      - "细胞通讯强度"
      - "outgoing incoming"
      - "communication bars"
    source: "scripts/bar/communication/plot.R"
    examples:
      - "scripts/bar/communication/example.tsv"
    preview: "scripts/bar/communication/preview.png"
    use_when: >
      Compare supplied outgoing and incoming interaction strength for
      the same cell types across tissues, with outgoing drawn left and
      incoming right, and a log2 ratio heatmap of a focal tissue versus
      the other tissues on the same rows.
    avoid_when: >
      Do not use a single butterfly panel (bar-butterfly), a Circos
      chord of flows (graph-chord), or a plain heatmap. Do not run
      CellChat or infer interaction scores in the script.
    input_shape: >
      one row per cell × tissue × direction; cell, tissue,
      direction=outgoing|incoming, strength
    language: "r"
    status: "stable"

  - id: "bar-opposite"
    title: "Opposite-direction bar chart"
    aliases:
      - "双向柱状图"
      - "正负柱状图"
    source: "scripts/bar/opposite/plot.R"
    examples:
      - "scripts/bar/opposite/example.tsv"
    preview: "scripts/bar/opposite/preview.png"
    use_when: >
      Plot values that extend in opposite directions from a baseline
      (for example gain vs loss).
    avoid_when: >
      Do not use a butterfly of two matched series if a signed single
      series is enough.
    input_shape: "one row per category with a signed value or two opposing series"
    language: "r"
    status: "stable"

  - id: "bar-waffle"
    title: "Waffle chart"
    aliases:
      - "华夫图"
      - "格子构成图"
    source: "scripts/bar/waffle/plot.R"
    examples:
      - "scripts/bar/waffle/example.tsv"
      - "scripts/bar/waffle/example_parliament.tsv"
    preview: "scripts/bar/waffle/preview.png"
    variants:
      - image: "scripts/bar/waffle/preview_parliament.png"
        example: "scripts/bar/waffle/example_parliament.tsv"
        config: "layout = \"parliament\", columns fill = \"cell_type\", values = \"cells\", parliament$unit = 20, arc = 180 (360 = full ring), rows = NULL (auto), inner = 0.4, palette = \"Qualitative.Paired / 12\", legend_title"
        shows: "Parliament / hemicycle: one bordered dot per 20 cells on concentric arcs, each cell type filling an angular sector."
    use_when: >
      Show part-to-whole composition as a grid of unit squares. One dot
      per unit on concentric hemicycle arcs (parliament plot) is
      layout = "parliament", not a new id.
    avoid_when: >
      Do not use when a pie, stacked bar, or percent bar is clearer, or
      when each category is a custom SVG rather than a square tile
      (bar-svg-icon). A continuous semicircle of areas is pie-half.
    input_shape: "one row per category; category plus numeric share"
    language: "r"
    status: "stable"

  - id: "bar-svg-icon"
    title: "Horizontal bars with SVG category marks"
    aliases:
      - "图标柱状图"
      - "SVG柱状图"
      - "生肖柱"
    source: "scripts/bar/svg_icon/plot.R"
    examples:
      - "scripts/bar/svg_icon/example.tsv"
    preview: "scripts/bar/svg_icon/preview.png"
    use_when: >
      Compare a numeric value across categories when each category is
      identified by a supplied SVG (for example a taxon silhouette)
      instead of y-axis text. One SVG file per category name in svg_dir.
    avoid_when: >
      Do not use a basic bar with text labels (bar-basic), a waffle of
      unit squares (bar-waffle), or an x-y scatter of SVG marks
      (scatter-svg). Do not add an id that only swaps the SVG set.
    input_shape: "one row per bar; category, numeric value, and SVG basename"
    language: "r"
    status: "stable"

  - id: "bar-radial"
    title: "Radial bar chart"
    aliases:
      - "径向柱状图"
    source: "scripts/bar/radial/plot.R"
    examples:
      - "scripts/bar/radial/example.tsv"
    preview: "scripts/bar/radial/preview.png"
    use_when: >
      Map category magnitudes to bar length around a circle.
    avoid_when: >
      Do not use polar stacked, sector, or grouped radial variants when
      a single series is enough. Do not use a circos doughnut with
      outer bars (pie-doughnut-bar).
    input_shape: "one row per category; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "bar-radial-groups"
    title: "Grouped radial bar chart"
    aliases:
      - "分组径向柱状图"
    source: "scripts/bar/radial_groups/plot.R"
    examples:
      - "scripts/bar/radial_groups/example.tsv"
    preview: "scripts/bar/radial_groups/preview.png"
    use_when: >
      Compare several groups as radial bars around the same categories.
    avoid_when: >
      Do not use for a single radial series (use bar-radial). Do not
      use a circos doughnut with an inner composition ring
      (pie-doughnut-bar), or stacked radial bars around an independent
      summary doughnut (bar-radial-donut).
    input_shape: "one row per category-by-group; category, group, and value"
    language: "r"
    status: "stable"

  - id: "bar-polar-horizontal"
    title: "Polar horizontal bars"
    aliases:
      - "极坐标水平柱"
    source: "scripts/bar/polar_horizontal/plot.R"
    examples:
      - "scripts/bar/polar_horizontal/example.tsv"
    preview: "scripts/bar/polar_horizontal/preview.png"
    use_when: >
      Draw category bars in polar coordinates with a horizontal-bar mapping.
    avoid_when: >
      Do not use polar-vertical, stacked-ring, or sector variants unless
      that geometry is requested.
    input_shape: "one row per category; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "bar-polar-vertical"
    title: "Polar vertical bars"
    aliases:
      - "极坐标竖直柱"
    source: "scripts/bar/polar_vertical/plot.R"
    examples:
      - "scripts/bar/polar_vertical/example.tsv"
    preview: "scripts/bar/polar_vertical/preview.png"
    use_when: >
      Draw category bars in polar coordinates with a vertical-bar mapping.
    avoid_when: >
      Do not use when stacked rings or a sector pie-bar is requested.
    input_shape: "one row per category; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "bar-polar-stack"
    title: "Polar stacked bars"
    aliases:
      - "极坐标堆叠柱"
    source: "scripts/bar/polar_stack/plot.R"
    examples:
      - "scripts/bar/polar_stack/example.tsv"
    preview: "scripts/bar/polar_stack/preview.png"
    use_when: >
      Stack components within polar bars.
    avoid_when: >
      Do not use the ring variant (bar-polar-stack-ring) unless a hollow
      ring stack is requested.
    input_shape: "one row per category-by-component; category, component, and value"
    language: "r"
    status: "stable"

  - id: "bar-polar-stack-ring"
    title: "Polar stacked ring bars"
    aliases:
      - "极坐标堆叠环"
    source: "scripts/bar/polar_stack_ring/plot.R"
    examples:
      - "scripts/bar/polar_stack_ring/example.tsv"
    preview: "scripts/bar/polar_stack_ring/preview.png"
    use_when: >
      Stack components as a polar ring with a hollow center.
    avoid_when: >
      Do not use filled polar stacks (bar-polar-stack).
    input_shape: "one row per category-by-component; category, component, and value"
    language: "r"
    status: "stable"

  - id: "bar-polar-sector"
    title: "Polar sector bars"
    aliases:
      - "扇区柱状图"
    source: "scripts/bar/polar_sector/plot.R"
    examples:
      - "scripts/bar/polar_sector/example.tsv"
    preview: "scripts/bar/polar_sector/preview.png"
    use_when: >
      Encode values as polar sectors (Nightingale-like bars with variable angle
      or radius, as implemented in this template).
    avoid_when: >
      Do not use a pie/Nightingale from the pie family when a bar-sector
      geometry is not requested.
    input_shape: "one row per category; category plus numeric value"
    language: "r"
    status: "stable"

  - id: "bar-radial-line"
    title: "Circular bar–line composite"
    aliases:
      - "环形柱线复合图"
      - "环形柱状折线图"
      - "极坐标柱线图"
      - "circular bar-line"
      - "radial bar line composite"
    source: "scripts/bar/radial_line/plot.R"
    examples:
      - "scripts/bar/radial_line/example.tsv"
    preview: "scripts/bar/radial_line/preview.png"
    use_when: >
      Show two supplied measures per item on one circle: radial bars of
      one measure (e.g. number of sites) in the inner band and a polar
      line with points and value labels of another (e.g. a threshold)
      in the outer band, with group-tinted sectors and an outer ring of
      item label tiles. Missing line values break the line; groups
      with no line values get an arc, neutral groups a dot. Scale
      maxima, radii, neutral groups and axis titles are CONFIG.
    avoid_when: >
      Do not use a single radial measure (bar-radial), grouped radial
      bars without a second measure (bar-radial-groups), disease
      sectors with header bands and shared-gene links
      (bar-circos-links), or a cartesian dual-axis line (line-double).
      Do not fit thresholds, breakpoints, or regressions in the script.
    input_shape: >
      one row per item; item, group, non-negative bar value, and an
      optional line value (empty = missing)
    language: "r"
    status: "stable"

  - id: "bar-radial-donut"
    title: "Radial stacked bars around a summary doughnut"
    aliases:
      - "环形柱+甜甜圈"
      - "eGene环图"
      - "细胞类型环形柱状图"
      - "radial bars with donut"
    source: "scripts/bar/radial_donut/plot.R"
    examples:
      - "scripts/bar/radial_donut/bars.tsv"
      - "scripts/bar/radial_donut/ring.tsv"
    preview: "scripts/bar/radial_donut/preview.png"
    use_when: >
      Show one stacked radial bar per item (e.g. cell type), grouped
      and coloured by a supplied group (e.g. lineage) with a darker tip
      for the outer stack part, rotated item labels (with "^{...}"
      superscripts), a scale axis at 12 o'clock, and an inner doughnut
      from a second, independent table (e.g. eGenes by number of
      sharing cell types) with its total in the centre. Stack parts,
      gaps, palettes, ring labels and title are CONFIG.
    avoid_when: >
      Do not use when the doughnut and bars show the same parts
      (pie-doughnut-bar), grouped radial bars without an inner ring
      (bar-radial-groups), a second measure as a polar line
      (bar-radial-line), or disease sectors with shared-gene links
      (bar-circos-links). Do not run eQTL mapping or sharing tests in
      the script.
    input_shape: >
      bars table (item, group, two or more stack-part columns) plus a
      ring table (category, value) in display order
    language: "r"
    status: "stable"

  - id: "bar-circos-links"
    title: "Circos sector bars with item labels and links"
    aliases:
      - "疾病基因环图"
      - "疾病-基因关联环图"
      - "Circos环形条形图"
      - "disease gene circos"
      - "sector bar circos"
    source: "scripts/bar/circos_links/plot.R"
    examples:
      - "scripts/bar/circos_links/genes.tsv"
      - "scripts/bar/circos_links/links.tsv"
    preview: "scripts/bar/circos_links/preview.png"
    use_when: >
      Group items (genes, proteins, metabolites) into Circos sectors by
      a supplied category (disease, phenotype, drug), with a header band
      per sector, item labels coloured by a supplied two-level
      direction, an inner bar track of a supplied score, and optional
      central links between items in different sectors (e.g. shared
      genes). Sort order, colours, track heights and links on/off are
      CONFIG.
    avoid_when: >
      Do not use ggplot polar bars without sectors or links (bar-radial,
      bar-radial-groups), a chord whose sector width is total flow
      (graph-chord), genomic coordinates on an ideogram
      (ideogram-circos), or a circular heatmap (heatmap-circos-split).
      Do not run GWAS, Mendelian randomization, or a gene-overlap test
      in the script; links are supplied endpoints.
    input_shape: >
      items table (disease, gene, score, direction) plus links table
      (from_disease, from_gene, to_disease, to_gene; header-only for
      no links)
    language: "r"
    status: "stable"

  - id: "bar-enrichment-points"
    title: "Enrichment bars with gene-ratio points"
    aliases:
      - "富集柱状加点图"
      - "GO富集图"
    source: "scripts/bar/enrichment_points/plot.R"
    examples:
      - "scripts/bar/enrichment_points/example.tsv"
    preview: "scripts/bar/enrichment_points/preview.png"
    use_when: >
      Rank enrichment terms as bars with gene-ratio points on a shared axis,
      faceted by ontology.
    avoid_when: >
      Do not use when the claim is a classic enrichment dotplot with
      size = Count and fill = -log10(p) (bar-enrichment-dot), when
      gene counts, expanded category headers, or multi-group
      enrichment are the main encodings. Do not use a classification
      tree with an outer enrichment track (tree-enrichment-ring), or
      enrichment bars as zoom panels on a DE heatmap
      (heatmap-enrichment-zoom).
    input_shape: "one row per term; description, ontology, gene ratio, q-value"
    language: "r"
    status: "stable"

  - id: "bar-enrichment-dot"
    title: "Enrichment dotplot"
    aliases:
      - "富集点图"
      - "GO点图"
      - "KEGG点图"
      - "enrichplot dotplot"
    source: "scripts/bar/enrichment_dot/plot.R"
    examples:
      - "scripts/bar/enrichment_dot/example.tsv"
    preview: "scripts/bar/enrichment_dot/preview.png"
    use_when: >
      Rank enrichment terms as a dotplot: x = gene ratio, y = term,
      point size = gene count, fill = -log10(adjusted p). Facet by
      ontology or Change is CONFIG. Extra databases are extra rows,
      not extra ids.
    avoid_when: >
      Do not use when bars plus gene-ratio points share one axis
      (bar-enrichment-points), when gene lists must sit under each
      bar (bar-enrichment-genes), when the same terms are compared
      across groups as bars (bar-enrichment-groups), when terms sit
      under category headers (bar-enrichment-expand), when a
      term-by-group signed-p heatmap is needed
      (heatmap-enrichment-terms), when enrichment bars align to
      Up/Down gene splits on a DE heatmap (heatmap-enrichment-zoom),
      or when cell-type marker bubbles share numbers with a UMAP
      (scatter-umap-dot).
      Do not run enricher or GSEA in the script.
    input_shape: "one row per term; description, gene ratio, adjusted p, count"
    language: "r"
    status: "stable"

  - id: "bar-enrichment-genes"
    title: "Enrichment bars by gene count"
    aliases:
      - "基因数富集柱状图"
    source: "scripts/bar/enrichment_genes/plot.R"
    examples:
      - "scripts/bar/enrichment_genes/example.tsv"
    preview: "scripts/bar/enrichment_genes/preview.png"
    use_when: >
      Rank enrichment terms by gene count rather than ratio.
    avoid_when: >
      Do not use when gene ratio is the requested x encoding. Do not
      use a classic enrichment dotplot (bar-enrichment-dot), a
      classification tree with an outer enrichment track
      (tree-enrichment-ring), or enrichment bars as zoom panels on a
      DE heatmap (heatmap-enrichment-zoom).
    input_shape: "one row per term; description, gene count, and significance"
    language: "r"
    status: "stable"

  - id: "bar-enrichment-groups"
    title: "Grouped enrichment bars"
    aliases:
      - "分组富集柱状图"
    source: "scripts/bar/enrichment_groups/plot.R"
    examples:
      - "scripts/bar/enrichment_groups/example.tsv"
    preview: "scripts/bar/enrichment_groups/preview.png"
    use_when: >
      Compare enrichment of the same terms across several contrast groups.
    avoid_when: >
      Do not use for a single-contrast enrichment bar, or enrichment
      bars as zoom panels on a DE heatmap (heatmap-enrichment-zoom).
    input_shape: "one row per term-by-group; term, group, and enrichment statistic"
    language: "r"
    status: "stable"

  - id: "bar-enrichment-expand"
    title: "Enrichment bars with expanded category headers"
    aliases:
      - "分层富集柱状图"
    source: "scripts/bar/enrichment_expand/plot.R"
    examples:
      - "scripts/bar/enrichment_expand/example.tsv"
    preview: "scripts/bar/enrichment_expand/preview.png"
    use_when: >
      Group enrichment terms under readable category headers on the y-axis.
    avoid_when: >
      Do not use when ontology is already handled by facets
      (bar-enrichment-points), coloured cluster facets with strip
      labels (bar-enrichment-cluster), a classification tree with an
      outer enrichment track (tree-enrichment-ring), or enrichment
      bars as zoom panels on a DE heatmap (heatmap-enrichment-zoom).
    input_shape: "one row per term; category, description, and enrichment statistic"
    language: "r"
    status: "stable"

  - id: "bar-enrichment-cluster"
    title: "Clustered enrichment bars"
    aliases:
      - "分簇富集柱状图"
      - "cluster enrichment bars"
      - "Klf4 dose enrichment"
    source: "scripts/bar/enrichment_cluster/plot.R"
    examples:
      - "scripts/bar/enrichment_cluster/example.tsv"
    preview: "scripts/bar/enrichment_cluster/preview.png"
    use_when: >
      Rank enrichment terms as horizontal bars in separate cluster
      facets, each with a matching tinted panel, coloured strip label
      (cluster + dose), and an optional -log10 significance threshold.
      Cluster colours are catalog refs (gold / sky / teal by default).
    avoid_when: >
      Do not use when category headers sit on one shared y-axis
      (bar-enrichment-expand), the same terms are compared across
      groups (bar-enrichment-groups), ontology facets with gene-ratio
      points (bar-enrichment-points), a classic enrichment dotplot
      (bar-enrichment-dot), or a single-panel EnrichR combined-score
      lollipop coloured by cluster (bar-enrichment-lollipop). Do not
      run enricher in the script.
    input_shape: "one row per term; cluster, description, adjusted p; optional dose for the strip subtitle"
    language: "r"
    status: "stable"

  - id: "bar-enrichment-lollipop"
    title: "Enrichment lollipop by combined score"
    aliases:
      - "富集棒棒糖图"
      - "EnrichR lollipop"
      - "MSigDB lollipop"
      - "combined score lollipop"
      - "LOESS cluster enrichment"
    source: "scripts/bar/enrichment_lollipop/plot.R"
    examples:
      - "scripts/bar/enrichment_lollipop/example.tsv"
    preview: "scripts/bar/enrichment_lollipop/preview.png"
    use_when: >
      Rank enrichment terms on one panel as horizontal lollipops by a
      supplied score (e.g. EnrichR combined score), with point size =
      -log10(adjusted p), fill by cluster, and an optional shaded
      low-score band plus vertical guide.
    avoid_when: >
      Do not use a classic gene-ratio enrichment dotplot
      (bar-enrichment-dot), faceted cluster bars
      (bar-enrichment-cluster), or signed delta lollipops
      (scatter-lollipop-delta). Do not run EnrichR, GSEA, or LOESS
      clustering in the script; score, p.adjust, and cluster are supplied.
    input_shape: "one row per term; term, score, p.adjust, cluster"
    language: "r"
    status: "stable"

  - id: "bar-upset"
    title: "UpSet combination matrix"
    aliases:
      - "UpSet"
      - "UpSetR"
      - "UpSet图"
      - "集合交集图"
      - "组合模式图"
      - "分组UpSet"
    source: "scripts/bar/upset/plot.R"
    examples:
      - "scripts/bar/upset/example.tsv"
      - "scripts/bar/upset/example_grouped.tsv"
    preview: "scripts/bar/upset/preview.png"
    variants:
      - image: "scripts/bar/upset/preview_grouped.png"
        example: "scripts/bar/upset/example_grouped.tsv"
        config: "style = \"grouped\", columns sets/count/percent/group, group_order T1..Other, set_order, Pastel soft + Bold hard palettes"
        shows: "Track-coloured intersection bars with count/percent labels, group-coloured matrix dots and connectors, alternating row stripes, and bottom T-group labels."
    use_when: >
      Show which sets co-occur in supplied combinations. style =
      "dual" draws observed vs expected bars, an n-set coloured
      matrix, and left set sizes. style = "grouped" colours bars and
      matrix dots by a supplied track group (e.g. T1–T7) with count /
      percent labels.
    avoid_when: >
      Do not draw overlapping Venn circles (use bar-venn for 2–4
      sets) or a core-plus-petal flower (bar-flower). Do not
      enumerate combinations from raw samples in the
      script. expected / percent / group are supplied. Two-set
      overlap as a single number is not this figure. Do not add a
      second id for grouped colouring or dual bars.
    input_shape: "one row per exclusive combination; dual: sets, observed, expected; grouped: sets, count, percent, group"
    language: "r"
    status: "stable"

  - id: "bar-venn"
    title: "Overlapping Venn circles"
    aliases:
      - "韦恩图"
      - "Venn"
      - "ggvenn"
      - "venn"
      - "基因交集韦恩"
    source: "scripts/bar/venn/plot.R"
    examples:
      - "scripts/bar/venn/example.tsv"
    preview: "scripts/bar/venn/preview.png"
    use_when: >
      Show overlap of 2–4 supplied sets as classic Venn circles.
      Counts are unique items in each region. Percentage labels and
      listing element names are CONFIG. Four circles are still this
      id; five or more sets are bar-upset.
    avoid_when: >
      Do not use an UpSet combination matrix (bar-upset) when
      overlapping circles are the claim. Do not add an id per
      package (ggvenn vs venn) or per 2/3/4 circles. Do not draw
      5+ set flower / petal diagrams (use bar-flower). Do not test
      enrichment in the script.
    input_shape: "one row per membership; item id and set name"
    language: "r"
    status: "stable"

  - id: "bar-flower"
    title: "Multi-set flower / petal diagram"
    aliases:
      - "花瓣图"
      - "花型韦恩"
      - "flower plot"
      - "petal Venn"
      - "多组花瓣图"
    source: "scripts/bar/flower/plot.R"
    examples:
      - "scripts/bar/flower/example.tsv"
      - "scripts/bar/flower/example_15.tsv"
      - "scripts/bar/flower/example_5.tsv"
    preview: "scripts/bar/flower/preview.png"
    variants:
      - image: "scripts/bar/flower/preview_ellipse.png"
        example: "scripts/bar/flower/example_15.tsv"
        config: "petal_shape = \"ellipse\", ellipse = list(inner = 0.12, outer = 1.05, width = 0.085), petal_label = \"unique\", label_rotate = TRUE, core_style = \"ring\", core_r = 0.1, label_r = 1.12, palettes$petal = c(\"Qualitative.Pastel\", \"Qualitative.Set3 / 12\"), core_n = 50"
        shows: "15 narrow non-overlapping ellipse petals with rotated counts and set names, small ringed core count."
      - image: "scripts/bar/flower/preview_overlap.png"
        example: "scripts/bar/flower/example_15.tsv"
        config: "as preview_ellipse plus ellipse = list(inner = 0.05, outer = 1.05, width = 0.2), alpha = 0.55, border = TRUE"
        shows: "Wide translucent overlapping ellipse petals with darker outlines around a ringed core."
      - image: "scripts/bar/flower/preview_pentagon.png"
        example: "scripts/bar/flower/example_5.tsv"
        config: "petal_shape = \"pentagon\", pentagon = list(centre = NULL, radius = 0.28, tuck = 0.1) (centre NULL = inner corners tucked under the core), core_r = 0.36, alpha = 0.85, border = TRUE, petal_label = \"unique\", label_rotate = TRUE, core_style = \"ring\", core_border = FALSE, label_r = 0.84, core_n = 2, text = list(count = 7, set = 6, core = 8), palettes$petal = \"Qualitative.Vivid\""
        shows: "Five outlined pentagon petals pointing outward whose inner corners slide under a white core circle carrying the shared count."
    use_when: >
      Show five or more supplied sets as petals around a shared core
      count. Each petal carries a supplied total and unique count;
      core_n is CONFIG. Extra sets are extra rows, not a new id.
      Petal shape (rounded wedge / ellipse / overlapping ellipse /
      pentagon), label content and rotation, alpha, outline and core
      style are CONFIG variants.
    avoid_when: >
      Do not draw classic overlapping circles for 2–4 sets
      (bar-venn). Do not use an UpSet combination matrix
      (bar-upset) when the claim is core-plus-per-set totals.
      Equal-angle value petals with caps are pie-nightingale
      shape = "petal". A hierarchical taxonomy of capsules is
      sunburst-petal. Do not enumerate membership or test
      enrichment in the script. Equal-length decorative petals
      with mismatched percentages are not this figure.
    input_shape: "one row per set; set name, total count, unique count; core_n in CONFIG"
    language: "r"
    status: "stable"

  - id: "bar-swimmer"
    title: "Swimmer plot of patient treatment lanes"
    aliases:
      - "泳道图"
      - "游泳图"
      - "swimmer plot"
      - "swimmer’s plot"
      - "剂量泳道图"
    source: "scripts/bar/swimmer/plot.R"
    examples:
      - "scripts/bar/swimmer/example.tsv"
      - "scripts/bar/swimmer/example_dose.tsv"
    preview: "scripts/bar/swimmer/preview.png"
    variants:
      - image: "scripts/bar/swimmer/preview_dose.png"
        example: "scripts/bar/swimmer/example_dose.tsv"
        config: "style = \"dose\", events_dose.tsv, dose_order, break_axis cut_low/cut_high, palettes$dose"
        shows: "Dose-coloured lanes with black SD circles / PD squares, escalate (*) and compassionate (#) marks, end labels, and an x-axis break."
    use_when: >
      Show each patient's treatment course as a horizontal time lane,
      with supplied intervals, best-response points, stop marks or
      ongoing arrows, and optional left-hand annotation tiles.
      style = "dose" uses dose fills, SD/PD glyphs, marks, end labels,
      and an optional axis break on a white panel. Extra treatments
      and annotation columns are CONFIG.
    avoid_when: >
      Do not use a magnitude bar (bar-basic), a two-point dumbbell
      (scatter-dumbbell), or a population Kaplan-Meier curve
      (line-survival). Do not convert calendar dates, call response,
      or estimate survival in the script. Do not add an id per
      metadata column or per Nature paper variant.
    input_shape: "one row per treatment interval; patient, treatment, start, end, plus optional response, stop, and annotation columns; dose style uses patient/dose/start/end/end_label plus events.tsv"
    language: "r"
    status: "stable"

  - id: "bar-line-multiaxis"
    title: "Multi-axis bar and line chart"
    aliases:
      - "多Y轴"
      - "多轴图"
      - "多轴柱线图"
      - "双Y轴柱线图"
      - "柱线组合图"
      - "multiple y axes"
      - "bar line combo"
    source: "scripts/bar/line_multiaxis/plot.R"
    examples:
      - "scripts/bar/line_multiaxis/example.tsv"
    preview: "scripts/bar/line_multiaxis/preview.png"
    use_when: >
      Draw several supplied series on one category axis, each on its
      own coloured y axis: bars dodged side by side, lines with open
      points on top, axes stacked on the left and / or right with
      titles on top and a shared tick count so gridlines align. Series
      count, type, side, colour, limits and units are CONFIG entries.
    avoid_when: >
      Do not use when series share units (one axis, bar-group /
