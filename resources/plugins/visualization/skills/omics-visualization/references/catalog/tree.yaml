family: "tree"
preview_background: "transparent"  # PNG alpha is empty; dark UIs look black. Do not treat as a black canvas.

templates:
  - id: "tree-basic"
    title: "Vertical tree / dendrogram"
    aliases:
      - "树图"
      - "纵向树"
      - "树状图"
    source: "scripts/tree/basic/plot.R"
    examples:
      - "scripts/tree/basic/example.tsv"
      - "scripts/tree/basic/example_regulon.tsv"
    preview: "scripts/tree/basic/preview.png"
    variants:
      - image: "scripts/tree/basic/preview_circular.png"
        example: "scripts/tree/basic/example_regulon.tsv"
        config: "layout = \"circular\"; circular$branch_colors per depth-1 branch (\"Family.Name:index\"), depth_shapes, depth_sizes, leaf_size_range, depth_names, size_note; title / subtitle"
        shows: "Radial TF-regulon hierarchy: hidden root, regulatory-axis circles, TF triangles and target-gene leaves sized by supplied DE signal, coloured by axis, radial labels and an encoding / node-meaning key."
    use_when: >
      Draw a single rooted hierarchy top-down from supplied parent/path
      edges, with internal labels above nodes and rotated labels on leaves.
      A radial dendrogram (hidden root, branch colours, depth shapes,
      leaf size by value), e.g. regulatory axis -> TF -> target gene
      regulons, is layout = "circular", not a new id.
    avoid_when: >
      Do not use a clustering tree from a numeric matrix
      (tree-dendrogram), a classification tree with an outer enrichment
      track (tree-enrichment-ring), a forest of several roots
      (tree-group), an unrooted daylight tip-bubble phylogeny
      (tree-daylight), a sunburst, or a Sankey of flows. Do not run
      DoRothEA, decoupleR or DE in the script; regulon edges and leaf
      values are supplied.
    input_shape: "hierarchical table with parent, name, path, and optional value"
    language: "r"
    status: "stable"

  - id: "tree-dendrogram"
    title: "Clustering dendrogram"
    aliases:
      - "聚类树"
      - "树状图"
      - "hclust"
      - "dendrogram"
      - "样本聚类树"
    source: "scripts/tree/dendrogram/plot.R"
    examples:
      - "scripts/tree/dendrogram/example.tsv"
    preview: "scripts/tree/dendrogram/preview.png"
    use_when: >
      Cluster samples or other leaves from a numeric feature matrix with
      dist + hclust, and draw the tree. Branch height is clustering
      height. Leaf colour is a supplied group, not cutree. Set
      circular = TRUE in CONFIG for the polar variant; do not add a
      second template.
    avoid_when: >
      Do not use a named parent/path hierarchy (tree-basic), a
      classification tree with an outer enrichment track
      (tree-enrichment-ring), a supplied Newick daylight tip-bubble
      tree (tree-daylight), a heatmap that already shows both
      dendrograms, a treemap, or a sunburst. Do not treat the tree as a
      phylogenetic reconstruction unless the input is a phylogenetic
      distance.
    input_shape: "one row per leaf; id, optional group, and numeric feature columns"
    language: "r"
    status: "stable"

  - id: "tree-group"
    title: "Grouped forest of trees"
    aliases:
      - "多树图"
      - "分组树"
    source: "scripts/tree/group/plot.R"
    examples:
      - "scripts/tree/group/example.tsv"
    preview: "scripts/tree/group/preview.png"
    use_when: >
      Draw several root trees from empty-parent rows in one figure.
    avoid_when: >
      Do not use a single-root vertical tree (tree-basic).
    input_shape: "hierarchical table with empty parent rows as roots"
    language: "r"
    status: "stable"

  - id: "tree-treemap"
    title: "Hierarchical treemap"
    aliases:
      - "矩形树图"
      - "treemap"
      - "树状矩形图"
    source: "scripts/tree/treemap/plot.R"
    examples:
      - "scripts/tree/treemap/example.tsv"
    preview: "scripts/tree/treemap/preview.png"
    use_when: >
      Show a hierarchy as nested rectangles whose area encodes a supplied
      leaf size, for example gene counts under GO or pathway groups.
      Each leaf gets a distinct catalog color from colors.json.
    avoid_when: >
      Do not use a sunburst, circle pack, icicle/partition, or node-link
      tree when the claim is nested area composition. Do not treat
      rectangle adjacency as a statistical relationship.
    input_shape: "hierarchical table with parent, name, path, and leaf value"
    language: "r"
    status: "stable"

  - id: "tree-circlepack"
    title: "Circle packing"
    aliases:
      - "圆堆积图"
      - "circle pack"
      - "circle packing"
    source: "scripts/tree/circlepack/plot.R"
    examples:
      - "scripts/tree/circlepack/example.tsv"
    preview: "scripts/tree/circlepack/preview.png"
    use_when: >
      Show a hierarchy as nested circles whose area encodes a supplied
      leaf size. Parent circles contain their children. Each leaf gets
      a distinct catalog color from colors.json.
    avoid_when: >
      Do not use a treemap, sunburst, icicle/partition, or node-link
      tree when the claim is nested circular containment. Do not treat
      circle adjacency as a statistical relationship.
    input_shape: "hierarchical table with parent, name, path, and leaf value"
    language: "r"
    status: "stable"

  - id: "tree-partition"
    title: "Icicle / rectangular partition"
    aliases:
      - "冰柱图"
      - "icicle"
      - "partition"
      - "矩形分区图"
    source: "scripts/tree/partition/plot.R"
    examples:
      - "scripts/tree/partition/example.tsv"
    preview: "scripts/tree/partition/preview.png"
    use_when: >
      Show a hierarchy as stacked rectangular bands (an icicle), where
      width encodes a supplied leaf size and vertical position is depth.
      Each leaf gets a distinct catalog color from colors.json.
    avoid_when: >
      Do not use a sunburst (circular partition), treemap, circle pack,
      or node-link tree when the claim is depth as horizontal bands.
      Do not treat band adjacency as a statistical relationship.
      Do not use a classification tree with an outer enrichment track
      (tree-enrichment-ring).
    input_shape: "hierarchical table with parent, name, path, and leaf value"
    language: "r"
    status: "stable"

  - id: "tree-enrichment-ring"
    title: "Classification tree with outer enrichment track"
    aliases:
      - "通路环图"
      - "层次富集图"
      - "富集环图"
      - "KEGG环形富集"
    source: "scripts/tree/enrichment_ring/plot.R"
    examples:
      - "scripts/tree/enrichment_ring/example.tsv"
    preview: "scripts/tree/enrichment_ring/preview.png"
    use_when: >
      Show a supplied classification tree (for example KEGG subclass to
      pathway) as a circular node-link interior, with Count and
      significance on a circumferential bar or point track. Colour is
      the supplied class. Set outer = "point" in CONFIG for dots;
      do not add a second template.
    avoid_when: >
      Do not use a ranked Cartesian enrichment bar or dotplot
      (bar-enrichment-*), a term-by-group signed-p heatmap
      (heatmap-enrichment-terms), a DE heatmap with enrichment zoom
      panels (heatmap-enrichment-zoom),
      a sunburst (angle encoding size), a circular clustering
      dendrogram (tree-dendrogram), an equal-angle cell tree with
      diverging assay tracks (tree-cell-ring), or a radial bar with no
      interior tree. Do not treat circular order as a statistical ranking.
    input_shape: "one row per term; class (from), term (to), Count, and pvalue"
    language: "r"
    status: "stable"

  - id: "tree-cell-ring"
    title: "Circular cell annotation tree"
    aliases:
      - "环形细胞注释树"
      - "细胞注释环"
      - "circular cell tree"
      - "Fig 1E"
    source: "scripts/tree/cell_ring/plot.R"
    examples:
      - "scripts/tree/cell_ring/example.tsv"
    preview: "scripts/tree/cell_ring/preview.png"
    use_when: >
      Place supplied cell subtypes at equal angles around a lineage
      tree (l1, l2, l3 capsules, numbered tips), with concentric
      diverging tracks such as Sex/Age by ATAC/RNA and outer labels
      of cell name plus a supplied proportion.
    avoid_when: >
      Do not use a class-to-term enrichment ring (tree-enrichment-ring),
      a sunburst whose angle encodes size, or a clustering dendrogram
      (tree-dendrogram).       Do not cluster cells or estimate proportions
      in the script. Track list and radii stay in CONFIG. An unrooted
      daylight phylogeny with tip bubbles is tree-daylight. A
      branch-length phylogeny with heatmap / stacked-bar rings is
      tree-phylo-rings.
    input_shape: >
      one row per cell in circular order; id, l1, l2, l3, cell_type,
      percent, plus score and optional star columns named in CONFIG
    language: "r"
    status: "stable"

  - id: "tree-daylight"
    title: "Daylight phylogenetic tip-bubble tree"
    aliases:
      - "daylight树"
      - "无根进化树"
      - "叶气泡进化树"
      - "daylight phylogeny"
    source: "scripts/tree/daylight/plot.R"
    examples:
      - "scripts/tree/daylight/tree.nwk"
      - "scripts/tree/daylight/tips.tsv"
    preview: "scripts/tree/daylight/preview.png"
    use_when: >
      Show a supplied Newick phylogeny in an unrooted daylight layout
      with tip points coloured by group and sized by a supplied
      magnitude. Branch lengths are ignored for spacing
      (branch.length = none).
    avoid_when: >
      Do not use a vertical parent/path tree (tree-basic), a clustering
      dendrogram from a numeric matrix (tree-dendrogram), a circular
      enrichment or cell-annotation ring (tree-enrichment-ring,
      tree-cell-ring), or RedeR / TreeAndLeaf interactive relaxation.
      Do not build or root the tree in the script.
    input_shape: "Newick tree plus tip table label, group, size"
    language: "r"
    status: "stable"

  - id: "tree-phylo-rings"
    title: "iTOL-style phylogeny with annotation rings"
    aliases:
      - "iTOL进化树"
      - "多环进化树"
      - "环形进化树注释"
      - "系统发育树热图柱状图"
      - "iTOL style tree"
    source: "scripts/tree/phylo_rings/plot.R"
    examples:
      - "scripts/tree/phylo_rings/tree.nwk"
      - "scripts/tree/phylo_rings/tips.tsv"
      - "scripts/tree/phylo_rings/bars.tsv"
    preview: "scripts/tree/phylo_rings/preview.png"
    use_when: >
      Show a supplied Newick phylogeny with branch lengths in an open
      fan, with clade background colour by a supplied tip group (e.g.
      family), tip labels, heatmap rings of supplied tip values (e.g.
      genome / BGC counts with a log2 display transform) and stacked-
      bar rings of supplied per-tip category values with dotted
      gridlines and tick labels in the opening. Ring list, transforms,
      palettes, open angle and widths are CONFIG.
    avoid_when: >
      Do not use an unrooted daylight tree with tip bubbles
      (tree-daylight), equal-angle cell lineage capsules with diverging
      tracks (tree-cell-ring), a class-to-term enrichment ring
      (tree-enrichment-ring), or a clustering dendrogram from a matrix
      (tree-dendrogram). Do not build, root or prune the tree, or count
      genomes / BGCs in the script.
    input_shape: >
      Newick tree plus tips table (label, group, heatmap columns) and a
      long bars table (label, track, category, value; header-only = none)
    language: "r"
    status: "stable"
