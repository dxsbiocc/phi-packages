family: "sunburst"
preview_background: "transparent"  # PNG alpha is empty; dark UIs look black. Do not treat as a black canvas.

templates:
  - id: "sunburst-basic"
    title: "Basic sunburst chart"
    aliases:
      - "旭日图"
      - "多层环图"
    source: "scripts/sunburst/basic/plot.R"
    examples:
      - "scripts/sunburst/basic/example.tsv"
    preview: "scripts/sunburst/basic/preview.png"
    use_when: >
      Show a hierarchy as concentric rings colored by root lineage, with
      radial labels on every ring.
    avoid_when: >
      Do not use when per-node colors and outer-ring labels are supplied
      (use sunburst-advanced), when a node-link tree is requested, or
      when an interior classification tree plus outer bars or points
      should share circular order (tree-enrichment-ring). Angle must
      encode descendant size; Count as bar height is not a sunburst.
    input_shape: "hierarchical table with parent, name, path, and value"
    language: "r"
    status: "stable"

  - id: "sunburst-advanced"
    title: "Layered sunburst with outside labels"
    aliases:
      - "分层旭日图"
      - "风味轮旭日图"
      - "sunburst-drink"
    source: "scripts/sunburst/advanced/plot.R"
    examples:
      - "scripts/sunburst/advanced/example.tsv"
    preview: "scripts/sunburst/advanced/preview.png"
    use_when: >
      Draw a three-level sunburst with tangential inner labels, radial
      middle labels, outer labels outside a thin rim, and optional
      per-node colors.
    avoid_when: >
      Do not use sunburst-basic when that layered labeling is required.
      Rounded wedges with tapered capsule leaves and centre group arcs
      are sunburst-petal.
    input_shape: "hierarchical table with parent, name, path, value, and optional itemStyle.color"
    language: "r"
    status: "stable"

  - id: "sunburst-petal"
    title: "Rounded petal sunburst"
    aliases:
      - "圆角旭日图"
      - "花瓣旭日图"
      - "花瓣分类图"
      - "petal sunburst"
      - "taxonomy flower"
    source: "scripts/sunburst/petal/plot.R"
    examples:
      - "scripts/sunburst/petal/example.tsv"
    preview: "scripts/sunburst/petal/preview.png"
    use_when: >
      Show a two- or three-level taxonomy (super-group → category →
      leaf) as rounded inner wedges, one tapered rounded capsule per
      leaf on the outer ring with the leaf name inside, and optional
      thick centre arcs for super-groups. Every leaf has equal angle,
      so wedge angle encodes the number of leaves.
    avoid_when: >
      Do not use when leaf values should set angle or when sharp
      annular rings are wanted (sunburst-basic, sunburst-advanced).
      Equal-angle wedges with semicircular caps and no hierarchy
      are pie-nightingale shape = "petal". A 5+ set flower / Venn
      around a shared core is bar-flower. Do not use a part-to-whole
      composition (pie-*) or a node-link tree. Sample counts such
      as "(13k)" are label text, not angle; the script does not
      count or classify.
    input_shape: >
      one row per leaf in clockwise order: category, subcategory;
      optional group, category_label, colour (hex per category)
    language: "r"
    status: "stable"
