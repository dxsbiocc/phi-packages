name: viz
description: >-
  Private scientific plotting environment for visualization (R 4.4 + Python 3.12
  stdlib helper runtime + CRAN/Bioconductor/GitHub plotting packages for all
  omics-visualization templates).
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - r-base=4.4
  - r-tidyverse
  - bioconductor-complexheatmap
  - bioconductor-ggtree
  - r-ade4
  - r-ape
  - r-aplot
  - r-circlize
  - r-cli
  - r-deldir
  - r-digest
  - r-dplyr
  - r-forcats
  - r-geomtextpath
  - r-ggbeeswarm
  - r-ggextra
  - r-ggforce
  - r-ggh4x
  - r-gghalves
  - r-ggnewscale
  - r-ggplot2
  - r-ggprism
  - r-ggpubr
  - r-ggraph
  - r-ggrepel
  - r-ggridges
  - r-ggsignif
  - r-ggtern
  - r-ggvenn
  - r-glue
  - r-graphlayouts
  - r-gridextra
  - r-gtable
  - r-hexbin
  - r-igraph
  - r-jsonlite
  - r-magrittr
  - r-patchwork
  - r-polyclip
  - r-purrr
  - r-quantreg
  - r-rcolorbrewer
  - r-readr
  - r-rlang
  - r-rsvg
  - r-scales
  - r-sf
  - r-stringr
  - r-survival
  - r-survminer
  - r-tibble
  - r-tidygraph
  - r-tidyr
  - r-tidytree
  - r-vctrs
  - r-vegan
  - r-yaml
sourcePackages:
