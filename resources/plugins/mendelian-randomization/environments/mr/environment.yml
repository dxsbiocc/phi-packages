name: mr
description: >-
  Private genetic epidemiology and Mendelian randomization environment: Python
  3.13 + pandas/numpy/scipy/scikit-learn/matplotlib-base for GWAS summary-stat
  QC, allele harmonization, Two-Sample MR (IVW, MR-Egger, Weighted Median/Mode,
  LOO, Steiger), and Wakefield ABF Bayesian colocalization.
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - matplotlib-base
