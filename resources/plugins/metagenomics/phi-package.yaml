schemaVersion: 1
id: metagenomics
type: plugin
version: 0.1.0
title: Metagenomics Analysis
summary: >-
  Two metagenomics routes: read-based profiling (kraken2/bracken plus merging,
  diversity and differential plots after MetaPhlAn/HUMAnN) and assembly/MAG
  (stats, MIMAG tiers, taxonomy/abundance integration after nf-core/mag).
  Heavy tools run via wrappers; scripts do deterministic statistics in Python.
toolPrefix: mg
components:
  agents:
    - agents/Metagenomics.md
  skills:
    - skills/profiling-workflow
    - skills/mag-workflow
environments:
  metagenomics:
    spec: environments/metagenomics/environment.yml