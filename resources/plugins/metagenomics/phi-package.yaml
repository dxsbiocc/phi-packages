schemaVersion: 1
id: metagenomics
type: plugin
version: 0.3.1
title: Metagenomics
summary: >-
  Three microbiome downstream routes in one locked Python environment (mg_):
  read-based profiling (diversity/PERMANOVA/PERMDISP, CLR multivariable DA,
  networks, CV classification), assembly/MAG (MIMAG, GTDB, AMR/BGC, metabolism),
  and 16S/ITS amplicon UniFrac after nf-core/ampliseq.
toolPrefix: mg
components:
  agents:
    - agents/Metagenomics.md
  skills:
    - skills/profiling-workflow
    - skills/mag-workflow
    - skills/amplicon-workflow
environments:
  metagenomics:
    spec: environments/metagenomics/environment.yml
