schemaVersion: 1
id: metabolomics
type: plugin
version: 0.1.0
title: Metabolomics Analysis
summary: >-
  Downstream untargeted LC-MS metabolomics: feature-table QC (RSD, detection
  rate), imputation and normalisation (TIC/median/PQN), PCA/PLS-DA (VIP,
  permutation), Welch/Wilcoxon with BH FDR, adduct/isotope grouping, MSP/MGF
  matching, pathway enrichment and heatmaps. Peak extraction is out of scope.
toolPrefix: mb
components:
  agents:
    - agents/Metabolomics.md
  skills:
    - skills/lcms-workflow
environments:
  metabolomics:
    spec: environments/metabolomics/environment.yml