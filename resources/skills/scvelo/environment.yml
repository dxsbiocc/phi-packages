name: scvelo
description: RNA velocity analysis environment for the standalone scvelo skill (Python 3.12 + scVelo + Scanpy/AnnData + NumPy/SciPy/pandas/Matplotlib).
channels:
  - conda-forge
dependencies:
  - python=3.12
  - scvelo
  - scanpy
  - anndata
  - numpy
  - pandas
  - scipy
  - matplotlib-base
